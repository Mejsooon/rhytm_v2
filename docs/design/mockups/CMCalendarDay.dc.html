<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon — Kalendarz, dzień (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
/* CM-BASE — wspólne dodatki mobilne COSS. Ten blok ma być IDENTYCZNY w każdym pliku CM*.
   Wszystko inne bierzemy z arkusza coss/coss.css (klasy .btn/.btnp/.btng/.btns/.btnd/.btndo,
   .inp/.igroup/.dd, .fld/.lbl/.hint/.err, .cbx/.sw/input[type=checkbox|radio], .seg/.tabs/.chip/.dot, .bdg.*,
   .card/.card-h/.card-t/.card-d/.card-p/.foot, .frame>.inner, .sep, .pop/.mi/.mi-sep/.mi-lbl, .backdrop, .dlg*,
   .toast, .alert.*, .kbd, .prog, .avatar, .empty/.empty-ic, .num, .muted, .h-title). */

/* Ekran telefonu */
html body .m-screen{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:var(--foreground);font-size:14px}
html body .m-status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600}
html body .m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);background:#fff}
html body .m-title{margin:0;font-size:18px;font-weight:600;letter-spacing:-.011em}
html body .m-body{padding:16px}

/* Cele dotykowe ≥44 px na telefonie (nadpisują rozmiary webowe arkusza) */
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo){height:44px}
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo).ic{width:44px}
html body .m-screen :is(.inp,.dd,.igroup){height:44px;font-size:16px}
html body .m-screen textarea.inp{height:auto}
html body .m-screen .seg :is(a,button){height:40px}
html body .m-screen .chip{height:36px}
html body .m-screen .mi{min-height:44px}
html body .m-hit{position:relative}
html body .m-hit::before{content:"";position:absolute;inset:-14px}

/* Wiersz listy (ustawienia, strony, wyniki wyszukiwania) */
html body .m-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
html body .m-row:last-child{border-bottom:0}

/* Arkusz od dołu = .dlg przyklejony do dołu */
html body .m-sheet{position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;max-height:88%;overflow:auto}
html body .m-grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:8px auto 0}

/* Krok +/− */
html body .m-step{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:var(--radius);box-shadow:var(--shadow-xs5);overflow:hidden}
html body .m-step button{width:44px;height:44px;border:0;background:#fff;font:inherit;font-size:18px;cursor:pointer}
html body .m-step span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}

/* Przycisk pływający (FAB) — nad paskiem zakładek */
html body .m-fab{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:16px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px -4px rgba(38,38,38,.32);cursor:pointer}

body{margin:0;background:#ffffff}
html body .day-pick{display:flex;flex-direction:column;align-items:center;gap:2px;height:58px;border:0;border-radius:12px;cursor:pointer;font:inherit;padding:6px 0}
</style>
</helmet>
<div class="m-screen" style="display: flex; flex-direction: column">

  <header class="m-head" style="flex: none">
    <div style="flex: 1; display: flex; align-items: baseline; gap: 8px; min-width: 0"><h1 class="m-title">Listopad</h1><span class="lbl">tydz. 46</span></div>
    <button type="button" class="btng ic" aria-label="Kategorie" aria-haspopup="dialog" onClick="{{openCats}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button>
    <a href="CMSearch.dc.html" class="btng ic" aria-label="Szukaj"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a>
  </header>
  <nav class="seg" aria-label="Widok kalendarza" style="display: flex; flex: none; margin: 12px 16px 8px"><a href="CMCalendarDay.dc.html" aria-current="page" style="flex: 1">Dzień</a><a href="CMCalendarWeek.dc.html" style="flex: 1">Tydzień</a><a href="CMCalendarMonth.dc.html" style="flex: 1">Miesiąc</a></nav>

  <!-- pasek tygodnia stoi w miejscu -->
  <div role="group" aria-label="Dzień tygodnia" style="flex: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 2px 12px 8px">
    <sc-for list="{{week}}" as="d" hint-placeholder-count="7"><button type="button" class="day-pick" aria-pressed="{{d.p}}" aria-label="{{d.label}}" onClick="{{d.pick}}" style="{{d.s}}"><span style="font-size: 11px; opacity: .75">{{d.wd}}</span><span class="num" style="font-size: 16px; font-weight: 500">{{d.n}}</span><span style="{{d.dot}}"></span></button></sc-for>
  </div>
  <div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: 13px" class="muted"><span>{{dayTitle}}</span><span aria-hidden="true">·</span><span class="bdg sec num">{{count}}</span></div>

  <!-- OŚ GODZIN wypełnia resztę ekranu do paska zakładek; przewija się tylko ona -->
  <div id="rh-tel-os-c" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px 16px 96px">
    <div style="position: relative; height: 1344px">
      <sc-for list="{{hours}}" as="h" hint-placeholder-count="24"><div style="{{h.s}}"><span class="num muted" style="width: 40px; font-size: 11px; transform: translateY(-7px); text-align: right">{{h.t}}</span><span style="flex: 1; border-top: 1px solid var(--border)"></span></div></sc-for>
      <a href="CMBlockSheet.dc.html" aria-label="Dodaj blok w wolnym miejscu" style="position: absolute; left: 48px; right: 0; top: 0; bottom: 0"></a>
      <sc-for list="{{blocks}}" as="b" hint-placeholder-count="4"><a href="CMBlockSheet.dc.html" style="{{b.s}}"><span style="font-weight: 500; font-size: 14px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">{{b.t}}</span><span class="num muted" style="font-size: 12px; line-height: 16px; white-space: nowrap; flex: none">{{b.time}}</span></a></sc-for>
      <sc-if value="{{isToday}}" hint-placeholder-val="{{true}}"><div aria-hidden="true" style="{{nowS}}"><span style="position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--destructive)"></span></div></sc-if>
    </div>
  </div>

  <a href="CMBlockSheet.dc.html" class="m-fab" aria-label="Nowy blok"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
  <dc-import name="CMTabBar" active="cal" hint-size="390px,64px"></dc-import>

  <!-- arkusz z kategoriami (jak przycisk „Kategorie” na komputerze) -->
  <sc-if value="{{catsOpen}}" hint-placeholder-val="{{false}}">
    <button type="button" class="backdrop" aria-label="Zamknij kategorie" onClick="{{closeCats}}" style="border: 0; padding: 0; cursor: pointer"></button>
    <div class="dlg m-sheet" role="dialog" aria-label="Kategorie">
      <div class="m-grab" aria-hidden="true"></div>
      <div class="dlg-h" style="padding: 8px 8px 8px 16px; align-items: center"><h2 class="dlg-t">Kategorie</h2><button type="button" class="btng ic" aria-label="Zamknij" onClick="{{closeCats}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
      <div style="border-top: 1px solid var(--border)">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><div class="m-row"><span style="{{c.dot}}"></span><span style="flex: 1">{{c.name}}</span><button type="button" class="sw m-hit" role="switch" aria-checked="{{c.on}}" aria-label="{{c.aria}}" onClick="{{c.toggle}}"></button></div></sc-for>
        <a href="CCategoryDialog.dc.html" class="m-row" style="color: var(--muted-foreground)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Kategoria</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { d: 15, hidden: {}, catsOpen: false }; }
  componentDidMount() {
    // start osi na 07:00, jak w aplikacji
    const el = document.getElementById('rh-tel-os-c');
    if (el) el.scrollTop = 7 * 56;
  }
  renderVals() {
    const CAT = { own: ['#15803d', 'Własne'], uni: ['#3b82f6', 'Studia'], sport: ['#f59e0b', 'Sport'], work: ['#8b5cf6', 'Praca'], life: ['#eab308', 'Dom'] };
    const DAYS = {
      9: [[7, 0.5, 'Poranna rutyna', 'life'], [10, 2, 'Systemy operacyjne — wykład', 'uni'], [14, 1.5, 'Strona Fanaberia', 'work'], [18, 1, 'Siłownia — Push', 'sport']],
      10: [[8, 1.5, 'Bazy danych — lab', 'uni'], [12, 2, 'rhytm — kod', 'own'], [17, 1, 'Bieg 6 km', 'sport']],
      11: [[9, 3, 'Strona Fanaberia', 'work'], [15, 1.5, 'C# — ćwiczenia', 'uni'], [19, 1, 'Angielski', 'life']],
      12: [[7, 0.5, 'Poranna rutyna', 'life'], [10, 2, 'rhytm — kod', 'own'], [18, 1.5, 'Siłownia — Pull', 'sport']],
      13: [[10, 1.5, 'Wstęp do cyberbezpieczeństwa', 'uni'], [13, 2, 'NetScope — research', 'own'], [17, 1, 'Bieg interwały', 'sport']],
      14: [[9, 1, 'Zakupy', 'life'], [11, 3, 'Strona Fanaberia — klient', 'work'], [16, 2, 'Długi bieg 14 km', 'sport']],
      15: [[8, 0.5, 'Poranna rutyna', 'life'], [10.5, 2, 'rhytm — kod', 'own'], [16, 1, 'Bieg 10 km', 'sport'], [19, 1, 'Bazy danych — projekt', 'uni']]
    };
    const H = 56;
    const sel = this.state.d;
    const hidden = this.state.hidden;
    const WD = ['pn', 'wt', 'śr', 'cz', 'pt', 'sb', 'nd'];
    const FULL = ['Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek', 'Sobota', 'Niedziela'];
    const fmt = (h) => String(Math.floor(h)).padStart(2, '0') + ':' + (h % 1 ? '30' : '00');
    const list = (DAYS[sel] || []).filter((b) => !hidden[b[3]]);
    const n = list.length;
    const r10 = n % 10, r100 = n % 100;
    const word = n === 1 ? 'blok' : (r10 >= 2 && r10 <= 4 && (r100 < 12 || r100 > 14)) ? 'bloki' : 'bloków';
    const now = 11 + 20 / 60;
    return {
      week: [9, 10, 11, 12, 13, 14, 15].map((d, i) => ({
        n: d, wd: WD[i], p: d === sel ? 'true' : 'false', label: FULL[i] + ' ' + d + ' listopada', pick: () => this.setState({ d }),
        s: d === sel ? 'background:var(--primary);color:var(--primary-foreground);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)' : d === 15 ? 'background:var(--accent);color:var(--foreground)' : 'background:transparent;color:var(--foreground)',
        dot: 'width:4px;height:4px;border-radius:50%;background:' + (d === sel ? '#fafafa' : (DAYS[d] || []).length ? '#15803d' : 'transparent')
      })),
      dayTitle: FULL[[9, 10, 11, 12, 13, 14, 15].indexOf(sel)] + ', ' + sel + ' listopada',
      count: n + ' ' + word,
      isToday: sel === 15,
      nowS: 'position:absolute;left:42px;right:0;top:' + Math.round(now * H) + 'px;height:2px;background:#ef4444;z-index:3',
      hours: Array.from({ length: 24 }, (_, i) => ({ t: i === 0 ? '' : String(i).padStart(2, '0') + ':00', s: 'position:absolute;left:0;right:0;top:' + (i * H) + 'px;height:' + H + 'px;display:flex;align-items:flex-start;gap:8px' })),
      blocks: list.map((b) => {
        const c = CAT[b[3]];
        // krótki blok (< 1 h): tytuł i godzina w jednej linii, żeby nic się nie ucinało
        const krotki = b[1] < 1;
        return { t: b[2], time: krotki ? fmt(b[0]) + '–' + fmt(b[0] + b[1]) : fmt(b[0]) + '–' + fmt(b[0] + b[1]) + ' · ' + c[1],
          s: 'position:absolute;left:52px;right:4px;top:' + (b[0] * H + 1) + 'px;height:' + (b[1] * H - 4) + 'px;box-sizing:border-box;border-radius:10px;display:flex;overflow:hidden;z-index:2;color:inherit;text-decoration:none;background:' + c[0] + '12;border:1px solid ' + c[0] + '4d' + (krotki ? ';flex-direction:row;align-items:center;gap:8px;padding:0 10px' : ';flex-direction:column;gap:2px;padding:6px 10px') };
      }),
      catsOpen: this.state.catsOpen,
      openCats: () => this.setState({ catsOpen: true }),
      closeCats: () => this.setState({ catsOpen: false }),
      cats: Object.keys(CAT).map((k) => {
        const on = !hidden[k];
        return { name: CAT[k][1], on: on ? 'true' : 'false', aria: 'Pokaż kategorię ' + CAT[k][1],
          toggle: () => this.setState({ hidden: Object.assign({}, hidden, { [k]: on }) }),
          dot: 'width:10px;height:10px;border-radius:50%;flex:none;background:' + CAT[k][0] };
      })
    };
  }
}
</script>
</body>
</html>
