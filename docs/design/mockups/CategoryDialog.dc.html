<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Nowa kategoria</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#171717}a:hover{color:#000000}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:.06em}
.card{border:1px solid #eaeaea;border-radius:8px;background:#ffffff}
.btn{background:#ffffff;color:#171717;border:1px solid #e0e0e0;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btnp{background:#171717;color:#ffffff;border:1px solid #171717;border-radius:6px;padding:7px 12px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btnd{background:#b91c1c;color:#ffffff;border:1px solid #b91c1c;border-radius:6px;padding:7px 12px;font:inherit;font-weight:500;cursor:pointer}
.inp{background:#ffffff;border:1px solid #e0e0e0;border-radius:6px;padding:8px 10px;font:inherit;color:#171717;width:100%;box-sizing:border-box}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.hint{font-size:12px;color:#6b6b6b;font-weight:400}
.th{text-align:left;padding:10px 14px;border-bottom:1px solid #eaeaea;font-weight:500;color:#666666;white-space:nowrap}
.td{padding:11px 14px;border-bottom:1px solid #f0f0f0}
.seg{display:flex;border:1px solid #e0e0e0;border-radius:6px;overflow:hidden;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #e0e0e0;border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;background:#ffffff;color:#404040;cursor:pointer}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;border-radius:6px;background:transparent;font:inherit;font-size:13px;color:#171717;cursor:pointer;text-align:left}
.kbd{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;border:1px solid #e0e0e0;border-radius:4px;padding:0 5px;color:#404040;background:#ffffff}

</style>
</helmet>
<div style="min-height: 900px; position: relative; display: flex; flex-wrap: wrap; background: #ffffff; color: #171717; font-family: 'Geist', system-ui, sans-serif; font-size: 14px">
  <div style="flex: 1 1 232px; max-width: 100%; background: #fafafa; border-right: 1px solid #eaeaea"><dc-import name="Sidebar" active="kalendarz" min-height="900" hint-size="100%,900px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px; border-bottom: 1px solid #eaeaea; min-height: 34px">
      <div class="mono" style="font-size: 13px; color: #666666"><span>Moduły</span> <span style="color: #b0b0b0">/</span> <span style="color: #171717">Kalendarz</span></div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center"><div class="seg"><a href="CalendarDay.dc.html" aria-current="false" style="padding: 6px 12px; text-decoration: none; color: #666666; background: #ffffff; border-right: 1px solid #e0e0e0">Dzień</a><a href="Calendar.dc.html" aria-current="page" style="padding: 6px 12px; text-decoration: none; background: #f0f0f0; font-weight: 500; color: #171717">Tydzień</a><a href="CalendarMonth.dc.html" aria-current="false" style="padding: 6px 12px; text-decoration: none; border-left: 1px solid #e0e0e0; color: #666666; background: #ffffff">Miesiąc</a></div><a href="BlockDialog.dc.html" class="btnp">Nowy blok</a></div>
    </header>
    <div aria-hidden="true" style="padding: 24px; opacity: .5">
      <div style="height: 30px; width: 520px; max-width: 100%; background: #fafafa; border: 1px solid #eaeaea; border-radius: 999px"></div>
      <div style="margin-top: 16px; height: 640px; border: 1px solid #eaeaea; border-radius: 8px; display: grid; grid-template-columns: 56px repeat(7, minmax(0, 1fr)); background-image: repeating-linear-gradient(to bottom, #ffffff 0, #ffffff 47px, #f0f0f0 47px, #f0f0f0 48px)"><div></div><div style="border-left: 1px solid #eaeaea"></div><div style="border-left: 1px solid #eaeaea"></div><div style="border-left: 1px solid #eaeaea"></div><div style="border-left: 1px solid #eaeaea"></div><div style="border-left: 1px solid #eaeaea"></div><div style="border-left: 1px solid #eaeaea"></div><div style="border-left: 1px solid #eaeaea"></div></div>
    </div>
  </main>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.25)"></div>
  <div role="dialog" aria-modal="true" aria-label="Nowa kategoria" style="position: absolute; left: 50%; top: 140px; transform: translateX(-50%); width: min(460px, calc(100% - 32px)); background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; box-shadow: 0 16px 48px rgba(0,0,0,.16); display: flex; flex-direction: column">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 14px">
      <div><h2 style="margin: 0; font-size: 17px; font-weight: 600">Nowa kategoria</h2><p style="margin: 4px 0 0; color: #666666; font-size: 13px">Kolor kropki w kalendarzu i w filtrach.</p></div>
      <button type="button" aria-label="Zamknij" style="width: 30px; height: 30px; border: 1px solid #e0e0e0; border-radius: 6px; background: #ffffff; color: #666666; cursor: pointer; font: inherit; flex: none">✕</button>
    </div>
    <div style="padding: 4px 20px 18px; display: flex; flex-direction: column; gap: 14px">
      <label class="fld">Nazwa<input class="inp" type="text" value="Języki"></label>
      <div class="fld">Kolor <span class="hint">wyblakłe są już zajęte, ale można je wybrać</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{colors}}" as="c" hint-placeholder-count="8"><button type="button" aria-label="{{c.name}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.s}}"></button></sc-for></div>
      </div>
      <div class="fld">Podgląd
        <div style="display: flex; gap: 12px; align-items: center; font-weight: 400">
          <span class="chip"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{color}}"></span>Języki <span class="mono" style="color: #6b6b6b">0</span></span>
          <div style="flex: 1; border-radius: 6px; padding: 6px 10px; border: 1px solid #e0e0e0; border-left: 3px solid {{color}}; font-size: 13px"><div style="font-weight: 500">Angielski</div><div class="mono" style="font-size: 11px; color: #404040">18:00–19:00</div></div>
        </div>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid #eaeaea; background: #fafafa; border-radius: 0 0 12px 12px">
<button type="button" class="btn">Anuluj</button><button type="button" class="btnp">Dodaj kategorię</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { c: 5 }; }
  renderVals() {
    const cols = [["#0070f3", "Niebieski"], ["#15803d", "Zielony"], ["#7c3aed", "Fioletowy"], ["#c2410c", "Pomara\u0144czowy"], ["#b91c1c", "Czerwony"], ["#0e7490", "Morski"], ["#a16207", "Musztardowy"], ["#525252", "Grafitowy"]];
    const used = [0, 1, 2, 3];
    const c = this.state.c;
    return { colors: cols.map((x, i) => ({ name: x[1], pick: () => this.setState({ c: i }), pressed: c === i ? 'true' : 'false',
      s: 'width:36px;height:36px;border-radius:8px;cursor:pointer;background:' + x[0] + ';opacity:' + (used.includes(i) && c !== i ? '.35' : '1') + ';border:2px solid ' + (c === i ? '#171717' : '#ffffff') + ';box-shadow:0 0 0 1px ' + (c === i ? '#171717' : '#e0e0e0') })),
      color: cols[c][0], cname: cols[c][1] };
  }
}
</script>
</body>
</html>
