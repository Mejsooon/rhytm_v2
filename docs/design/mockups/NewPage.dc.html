<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Nowa strona — wybór szablonu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#666666;text-decoration:none}a:hover{color:#171717}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
</style>
</helmet>
<div style="min-height: 900px; position: relative; background: #ffffff; color: #171717; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; display: flex; flex-wrap: wrap">

  <!-- dimmed app behind -->
  <div aria-hidden="true" style="flex: 1 1 232px; border-right: 1px solid #eaeaea; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px; opacity: .35">
    <div style="display: flex; align-items: center; gap: 10px"><svg width="22" height="22" viewBox="0 0 48 48" role="img" aria-label="rhytm" style="flex: none"><rect x="4" y="4" width="11" height="11" rx="3" fill="#171717" opacity="1"></rect><rect x="18" y="4" width="11" height="11" rx="3" fill="#171717" opacity="0.55"></rect><rect x="32" y="4" width="11" height="11" rx="3" fill="#171717" opacity="0.25"></rect><rect x="4" y="18" width="11" height="11" rx="3" fill="#171717" opacity="0.55"></rect><rect x="18" y="18" width="11" height="11" rx="3" fill="#171717" opacity="0.25"></rect><rect x="32" y="18" width="11" height="11" rx="3" fill="#15803d" opacity="1"></rect><rect x="4" y="32" width="11" height="11" rx="3" fill="#171717" opacity="0.25"></rect><rect x="18" y="32" width="11" height="11" rx="3" fill="#171717" opacity="1"></rect><rect x="32" y="32" width="11" height="11" rx="3" fill="#171717" opacity="0.55"></rect></svg><span style="font-weight: 600; letter-spacing: -0.045em; font-size: 16px">rhytm</span></div>
    <div style="height: 30px; border: 1px solid #eaeaea; border-radius: 6px"></div>
    <div style="color: #666666">Dziś</div><div style="color: #666666">Kalendarz</div><div style="color: #666666">Sport</div><div style="color: #666666">Nawyki i sen</div>
    <div style="color: #666666; margin-top: 10px">Subscriptions</div><div style="color: #666666">Books</div><div style="color: #666666">Projects</div>
  </div>
  <div aria-hidden="true" style="flex: 999 1 560px; opacity: .35; padding: 28px 24px">
    <div style="height: 28px; width: 220px; background: #f5f5f5; border-radius: 6px"></div>
    <div style="height: 300px; margin-top: 24px; border: 1px solid #eaeaea; border-radius: 8px"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.25)"></div>

  <!-- DIALOG -->
  <div role="dialog" aria-modal="true" aria-labelledby="np-title" style="position: absolute; left: 50%; top: 72px; transform: translateX(-50%); width: min(920px, calc(100% - 32px)); background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; box-shadow: 0 24px 80px rgba(0,0,0,.25); display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #eaeaea">
      <h2 id="np-title" style="margin: 0; font-size: 16px; font-weight: 600">Nowa strona</h2>
      <a href="Main.dc.html" aria-label="Zamknij" style="display: flex; padding: 6px; border-radius: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>

    <div style="display: flex; flex-wrap: wrap">
      <!-- templates -->
      <div style="flex: 999 1 380px; min-width: 0; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
        <label style="display: flex; align-items: center; gap: 8px; border: 1px solid #eaeaea; border-radius: 6px; padding: 7px 10px; color: #666666; background: #fafafa">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input type="text" placeholder="Szukaj szablonu…" aria-label="Szukaj szablonu" style="flex: 1; min-width: 0; background: none; border: 0; color: #171717; font: inherit; outline: none">
        </label>
        <div class="mono" style="font-size: 11px; color: #6b6b6b; text-transform: uppercase; letter-spacing: .06em">Szablony</div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{templates}}" as="t" hint-placeholder-count="6">
            <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="{{t.cardStyle}}">
              <span style="display: flex; align-items: center; gap: 8px; font-weight: 500; color: #171717"><span class="mono" aria-hidden="true" style="color: #6b6b6b">{{t.icon}}</span>{{t.name}}</span>
              <span style="font-size: 12px; color: #666666; line-height: 1.4">{{t.desc}}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <!-- preview -->
      <div style="flex: 1 1 300px; min-width: 0; border-left: 1px solid #eaeaea; padding: 18px 20px; background: #fafafa; display: flex; flex-direction: column; gap: 12px">
        <div class="mono" style="font-size: 11px; color: #6b6b6b; text-transform: uppercase; letter-spacing: .06em">Pola, które powstaną</div>
        <div style="font-size: 18px; font-weight: 600">{{sel.name}}</div>
        <div style="border: 1px solid #eaeaea; border-radius: 8px; overflow: hidden">
          <sc-for list="{{sel.fields}}" as="f" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border-bottom: 1px solid #f0f0f0">
              <span>{{f.n}}</span>
              <span class="mono" style="font-size: 11px; color: {{f.color}}; border: 1px solid #e0e0e0; border-radius: 4px; padding: 1px 6px; white-space: nowrap">{{f.t}}</span>
            </div>
          </sc-for>
          <sc-if value="{{sel.empty}}" hint-placeholder-val="{{false}}">
            <div style="padding: 14px 12px; color: #666666; font-size: 13px">Tylko kolumna „Nazwa”. Pola dodajesz przyciskiem „+ Pole”.</div>
          </sc-if>
        </div>
        <div class="mono" style="font-size: 12px; color: #666666; line-height: 1.5; white-space: pre-line">{{sel.extra}}</div>
        <div style="flex: 1"></div>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #666666">Nazwa strony
          <input type="text" value="{{sel.name}}" style="background: #fafafa; border: 1px solid #e0e0e0; border-radius: 6px; padding: 8px 10px; color: #171717; font: inherit; font-size: 14px">
        </label>
      </div>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid #eaeaea">
      <a href="Main.dc.html" style="border: 1px solid #e0e0e0; border-radius: 6px; padding: 8px 14px; color: #171717">Anuluj</a>
      <a href="Main.dc.html" style="background: #171717; color: #ffffff; border-radius: 6px; padding: 8px 14px; font-weight: 500">Utwórz stronę</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#15803d","options":["#15803d","#171717","#0090ff","#f5a524"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'subs' }; }
  renderVals() {
    const accent = this.props.accent ?? '#15803d';
    const smart = accent;
    const plain = '#666666';
    const list = [
      { id: 'empty', icon: '□', name: 'Pusta strona', desc: 'Tabela bez pól. Budujesz ją sama od zera.', fields: [], extra: '', empty: true },
      { id: 'subs', icon: '▦', name: 'Subscriptions', desc: 'Sumy miesięczne i roczne, odnowienia w kalendarzu.', fields: [
        { n: 'Nazwa', t: 'Tekst', color: plain }, { n: 'Cena', t: 'Kwota cykliczna', color: smart },
        { n: 'Odnowienie', t: 'Data odnowienia', color: smart }, { n: 'Kategoria', t: 'Select', color: plain }, { n: 'Aktywna', t: 'Checkbox', color: plain }],
        extra: '↻ Odnowienia trafią do kalendarza głównego.\nΣ Suma miesięczna i roczna nad tabelą.' },
      { id: 'books', icon: '▦', name: 'Books', desc: 'Status czytania, ocena, licznik przeczytanych.', fields: [
        { n: 'Tytuł', t: 'Tekst', color: plain }, { n: 'Autor', t: 'Tekst', color: plain }, { n: 'Status', t: 'Status', color: plain },
        { n: 'Ocena', t: 'Ocena', color: smart }, { n: 'Przeczytana', t: 'Data', color: plain }], extra: 'Σ Liczba przeczytanych w tym roku.' },
      { id: 'proj', icon: '▦', name: 'Projects', desc: 'Status i termin, terminy w kalendarzu.', fields: [
        { n: 'Nazwa', t: 'Tekst', color: plain }, { n: 'Status', t: 'Status', color: plain }, { n: 'Termin', t: 'Data · w kalendarzu', color: smart }, { n: 'Repo', t: 'URL', color: plain }],
        extra: '↻ Terminy trafią do kalendarza głównego.' },
      { id: 'web', icon: '▦', name: 'Websites', desc: 'Strony klientów: URL, klient, status.', fields: [
        { n: 'Nazwa', t: 'Tekst', color: plain }, { n: 'URL', t: 'URL', color: plain }, { n: 'Klient', t: 'Tekst', color: plain }, { n: 'Status', t: 'Status', color: plain }], extra: '' },
      { id: 'pass', icon: '✱', name: 'Passwords', desc: 'Hasła szyfrowane w przeglądarce hasłem głównym.', fields: [
        { n: 'Serwis', t: 'Tekst', color: plain }, { n: 'Login', t: 'Tekst', color: plain }, { n: 'Hasło', t: 'Sekret', color: smart }, { n: 'URL', t: 'URL', color: plain }],
        extra: '✱ Przy pierwszym otwarciu ustawisz hasło główne sejfu.' }
    ];
    const picked = this.state.picked;
    const sel = list.find((t) => t.id === picked) || list[1];
    return {
      accent,
      sel,
      templates: list.map((t) => ({
        ...t,
        pressed: t.id === picked ? 'true' : 'false',
        cardStyle: 'display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:8px;cursor:pointer;font:inherit;min-height:92px;background:' + (t.id === picked ? '#f5f5f5' : '#ffffff') + ';border:1px solid ' + (t.id === picked ? accent : '#eaeaea'),
        pick: () => this.setState({ picked: t.id })
      }))
    };
  }
}
</script>
</body>
</html>
