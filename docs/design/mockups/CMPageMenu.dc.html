<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon — Menu strony (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#fafafa}
/* CM-BASE — wspólne dodatki mobilne COSS. Ten blok ma być IDENTYCZNY w każdym pliku CM*.
   Wszystko inne bierzemy z arkusza coss/coss.css (klasy .btn/.btnp/.btng/.btns/.btnd/.btndo,
   .inp/.igroup/.dd, .fld/.lbl/.hint/.err, .cbx/.sw/input[type=checkbox|radio], .seg/.tabs/.chip/.dot, .bdg.*,
   .card/.card-h/.card-t/.card-d/.card-p/.foot, .frame>.inner, .sep, .pop/.mi/.mi-sep/.mi-lbl, .backdrop, .dlg*,
   .toast, .alert.*, .kbd, .prog, .avatar, .empty/.empty-ic, .num, .muted, .h-title). */

/* Ekran telefonu */
html body .m-screen{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:var(--foreground);font-size:14px}
html body .m-status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600}
html body .m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);background:#fff}
html body .m-title{margin:0;font-size:18px;font-weight:600;letter-spacing:-.011em}
html body .m-body{padding:16px}

/* Cele dotykowe ≥44 px na telefonie (nadpisują rozmiary webowe arkusza) */
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo){height:44px}
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo).ic{width:44px}
html body .m-screen :is(.inp,.dd,.igroup){height:44px;font-size:16px}
html body .m-screen textarea.inp{height:auto}
html body .m-screen .seg :is(a,button){height:40px}
html body .m-screen .chip{height:36px}
html body .m-screen .mi{min-height:44px}
html body .m-hit{position:relative}
html body .m-hit::before{content:"";position:absolute;inset:-14px}

/* Wiersz listy (ustawienia, strony, wyniki wyszukiwania) */
html body .m-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
html body .m-row:last-child{border-bottom:0}

/* Arkusz od dołu = .dlg przyklejony do dołu */
html body .m-sheet{position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;max-height:88%;overflow:auto}
html body .m-grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:8px auto 0}

/* Krok +/− */
html body .m-step{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:var(--radius);box-shadow:var(--shadow-xs5);overflow:hidden}
html body .m-step button{width:44px;height:44px;padding:0;border:0;background:#fff;font:inherit;font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer;color:var(--foreground)}
html body .m-step span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}

/* Przycisk pływający (FAB) — nad paskiem zakładek */
html body .m-fab{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:16px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px -4px rgba(38,38,38,.32);cursor:pointer}
html body button.m-row.row-btn{width:100%;border:0;background:none;font:inherit;text-align:left;cursor:pointer}
</style>
</helmet>
<div class="m-screen">
  <header class="m-head" style="padding:0 8px"><span class="btng ic" aria-hidden="true"></span><div style="flex:1"></div></header>
  <div class="m-body" style="opacity:.45;display:flex;flex-direction:column;gap:12px" aria-hidden="true"><div style="height:28px;width:60%;border-radius:8px;background:rgba(0,0,0,.08)"></div><div class="card" style="height:90px"></div><div class="card" style="height:300px"></div></div>
  <a href="CMEditor.dc.html" class="backdrop" aria-label="Zamknij"></a>
  <div class="dlg m-sheet" role="dialog" aria-label="Menu strony Książki" style="padding-bottom:20px">
    <div class="m-grab" aria-hidden="true"></div>
    <sc-if value="{{menu}}" hint-placeholder-val="{{true}}"><div style="padding:8px 0 0">
      <div style="padding:4px 16px 10px;display:flex;align-items:center;gap:10px"><span class="empty-ic" style="width:36px;height:36px" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg></span><span style="flex:1;min-width:0"><span style="display:block;font-weight:600">Książki</span><span class="hint num">11 wierszy · 5 pól</span></span></div>
      <div style="border-top:1px solid var(--border)">
        <button type="button" class="m-row row-btn" onClick="{{toRename}}">Zmień nazwę</button>
        <button type="button" class="m-row row-btn" onClick="{{toIcon}}">Zmień ikonę</button>
        <button type="button" class="m-row row-btn" onClick="{{dup}}">{{dupTxt}}</button>
        <button type="button" class="m-row row-btn" onClick="{{fav}}">{{favTxt}}</button>
        <button type="button" class="m-row row-btn" style="color:#b91c1c" onClick="{{toDel}}">Usuń stronę</button>
      </div>
    </div></sc-if>
    <sc-if value="{{rename}}" hint-placeholder-val="{{false}}"><div style="padding:12px 16px 0;display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-size:18px;font-weight:600">Zmień nazwę</h2><label class="fld">Nazwa strony<input class="inp" type="text" value="Książki"></label><div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px"><button type="button" class="btn" onClick="{{back}}">Anuluj</button><button type="button" class="btnp" onClick="{{back}}">Zapisz</button></div></div></sc-if>
    <sc-if value="{{icon}}" hint-placeholder-val="{{false}}"><div style="padding:12px 16px 0;display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-size:18px;font-weight:600">Zmień ikonę</h2><input class="inp" type="search" placeholder="Szukaj ikony" aria-label="Szukaj ikony"><div style="display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:6px"><sc-for list="{{icons}}" as="i" hint-placeholder-count="12"><button type="button" class="btng" aria-label="{{i.t}}" aria-pressed="{{i.p}}" onClick="{{back}}" style="height:48px;{{i.s}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"></path></svg></button></sc-for></div></div></sc-if>
    <sc-if value="{{del}}" hint-placeholder-val="{{false}}"><div style="padding:12px 16px 0;display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-size:18px;font-weight:600">Usunąć stronę „Książki”?</h2><p class="muted" style="margin:0">11 wierszy trafi do kosza na 30 dni. Daty z tej strony znikną z kalendarza.</p><div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px"><button type="button" class="btn" onClick="{{back}}">Anuluj</button><a href="CMPages.dc.html" class="btnd">Usuń stronę</a></div></div></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const v = S.v || 'menu';
    const I = [['Książka', 'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'], ['Folder', 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'], ['Gwiazda', 'm12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z'], ['Kod', 'm16 18 6-6-6-6M8 6l-6 6 6 6'], ['Globus', 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20'], ['Serce', 'M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 12 5a5.5 5.5 0 0 0-10 3.5c0 2.3 1.5 4 3 5.5l7 7z'], ['Kalendarz', 'M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM16 2v4M8 2v4M3 10h18'], ['Lista', 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01'], ['Dom', 'm3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'], ['Teczka', 'M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM16 6V4H8v2'], ['Muzyka', 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z'], ['Kubek', 'M17 8h1a4 4 0 0 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z']];
    return {
      menu: v === 'menu', rename: v === 'rename', icon: v === 'icon', del: v === 'del',
      toRename: () => this.setState({ v: 'rename' }), toIcon: () => this.setState({ v: 'icon' }), toDel: () => this.setState({ v: 'del' }), back: () => this.setState({ v: 'menu' }),
      dupTxt: S.dup ? 'Zduplikowano jako „Książki (kopia)” ✓' : 'Duplikuj', dup: () => this.setState({ dup: true }),
      favTxt: S.fav ? 'Usuń z ulubionych' : 'Dodaj do ulubionych', fav: () => this.setState({ fav: !S.fav }),
      icons: I.map((x, i) => ({ t: x[0], d: x[1], p: i === 0 ? 'true' : 'false', s: i === 0 ? 'background:var(--accent)' : '' }))
    };
  }
}
</script>
</body>
</html>
