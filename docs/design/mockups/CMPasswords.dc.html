<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon — Hasła (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#fafafa}
/* CM-BASE — wspólne dodatki mobilne COSS. Ten blok ma być IDENTYCZNY w każdym pliku CM*.
   Wszystko inne bierzemy z arkusza coss/coss.css (klasy .btn/.btnp/.btng/.btns/.btnd/.btndo,
   .inp/.igroup/.dd, .fld/.lbl/.hint/.err, .cbx/.sw/input[type=checkbox|radio], .seg/.tabs/.chip/.dot, .bdg.*,
   .card/.card-h/.card-t/.card-d/.card-p/.foot, .frame>.inner, .sep, .pop/.mi/.mi-sep/.mi-lbl, .backdrop, .dlg*,
   .toast, .alert.*, .kbd, .prog, .avatar, .empty/.empty-ic, .num, .muted, .h-title). */

/* Ekran telefonu */
html body .m-screen{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:var(--foreground);font-size:14px}
html body .m-status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600}
html body .m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);background:#fff}
html body .m-title{margin:0;font-size:18px;font-weight:600;letter-spacing:-.011em}
html body .m-body{padding:16px}

/* Cele dotykowe ≥44 px na telefonie (nadpisują rozmiary webowe arkusza) */
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo){height:44px}
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo).ic{width:44px}
html body .m-screen :is(.inp,.dd,.igroup){height:44px;font-size:16px}
html body .m-screen textarea.inp{height:auto}
html body .m-screen .seg :is(a,button){height:40px}
html body .m-screen .chip{height:36px}
html body .m-screen .mi{min-height:44px}
html body .m-hit{position:relative}
html body .m-hit::before{content:"";position:absolute;inset:-14px}

/* Wiersz listy (ustawienia, strony, wyniki wyszukiwania) */
html body .m-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
html body .m-row:last-child{border-bottom:0}

/* Arkusz od dołu = .dlg przyklejony do dołu */
html body .m-sheet{position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;max-height:88%;overflow:auto}
html body .m-grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:8px auto 0}

/* Krok +/− */
html body .m-step{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:var(--radius);box-shadow:var(--shadow-xs5);overflow:hidden}
html body .m-step button{width:44px;height:44px;padding:0;border:0;background:#fff;font:inherit;font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer;color:var(--foreground)}
html body .m-step span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}

/* Przycisk pływający (FAB) — nad paskiem zakładek */
html body .m-fab{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:16px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px -4px rgba(38,38,38,.32);cursor:pointer}
html body button.m-row.pass-row{width:100%;min-height:64px;border:0;background:none;font:inherit;text-align:left;cursor:pointer;padding:0 14px}
html body button.m-row.pass-row:hover{background:rgba(0,0,0,.02)}
</style>
</helmet>
<div class="m-screen" style="display:flex;flex-direction:column">
  <div class="m-status"><span>9:41</span><span></span></div>
  <header class="m-head" style="padding:0 8px"><a href="CMPages.dc.html" class="btng ic" aria-label="Strony"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><div style="flex:1"></div><a href="CMVault.dc.html" class="btng ic" aria-label="Zablokuj sejf" style="color:var(--warning-foreground)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></a><button type="button" class="btng ic" aria-label="Nowe hasło"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></header>
  <div style="flex:1;overflow-y:auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px">
    <div><h1 class="h-title" style="font-size:24px">Hasła</h1><div style="margin-top:10px"><span class="bdg ok lg num">odblokowany · auto-blokada za 4:52</span></div></div>
    <label class="igroup">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Szukaj" aria-label="Szukaj haseł"></label>
    <div style="display:flex;gap:8px;overflow-x:auto;align-items:center"><sc-for list="{{cats}}" as="c" hint-placeholder-count="4"><button type="button" class="chip m-hit" aria-pressed="{{c.p}}" onClick="{{c.pick}}">{{c.t}}</button></sc-for><button type="button" class="btng" style="flex:none;padding:0 6px" aria-label="Opcje kategorii">Edytuj</button></div>
    <div class="frame"><div class="inner"><sc-for list="{{items}}" as="it" hint-placeholder-count="6">
      <div style="border-bottom:1px solid var(--border)">
        <button type="button" class="m-row pass-row" onClick="{{it.toggle}}" aria-expanded="{{it.exp}}"><span class="avatar">{{it.ini}}</span><span style="flex:1;min-width:0"><span style="display:block;font-weight:500">{{it.name}}</span><span class="muted num" style="font-size:13px">{{it.user}}</span></span><span class="{{it.catC}}">{{it.cat}}</span><span style="{{it.chevS}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></button>
        <sc-if value="{{it.open}}" hint-placeholder-val="{{false}}"><div style="padding:0 14px 14px 60px;display:flex;flex-direction:column;gap:8px">
          <span class="lbl" style="font-size:12px">Hasło</span>
          <div class="igroup" style="padding-right:0;gap:0"><span class="num" style="flex:1;min-width:0;letter-spacing:.02em;color:var(--foreground)">{{it.pw}}</span><button type="button" class="btng ic" aria-label="{{it.revealLbl}}" onClick="{{it.reveal}}" style="color:var(--muted-foreground)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button><button type="button" class="btng ic" aria-label="Kopiuj hasło" onClick="{{it.copy}}" style="color:var(--muted-foreground)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button></div>
          <span class="lbl" style="font-size:12px">Notatka</span>
          <div class="igroup" style="padding-right:0;gap:0"><span class="num" style="flex:1;min-width:0;letter-spacing:.02em;color:var(--foreground)">{{it.noteTxt}}</span><button type="button" class="btng ic" aria-label="{{it.revealNoteLbl}}" onClick="{{it.revealNote}}" style="color:var(--muted-foreground)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>
          <span class="lbl" style="font-size:12px">URL</span><span class="num" style="font-size:14px">{{it.url}}</span>
          <div style="display:flex;align-items:center;gap:8px"><span class="num" style="flex:1;font-size:12px;color:{{it.noteC}}">{{it.note}}</span><a href="CMRowEdit.dc.html" class="btn">Edytuj</a></div>
        </div></sc-if>
      </div>
    </sc-for></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const q = (S.q || '').toLowerCase();
    // Serwis, login, hasło, URL, kategoria, notatka (Notatka jest zaszyfrowana jak hasło).
    const R = [['Google', 'mejson@example.com', 'k7#Vq2!mLp9z', 'accounts.google.com', 'Prywatne', 'Kody zapasowe w sejfie'], ['GitHub', 'Mejsooon', 'Gh_42!xTr8w', 'github.com', 'Praca', 'Token CLI do 01.2027'], ['Netflix', 'mejson@example.com', 'netflix2024', 'netflix.com', 'Prywatne', ''],
      ['USOS', 's123456', 'Uczelnia#2026', 'usosweb.umcs.pl', 'Studia', 'PIN do legitymacji 4821'], ['Framer', 'mejson@example.com', 'Fr4mer!Site', 'framer.com', 'Praca', ''], ['Revolut', '+48 ••• ••• 123', 'R3v!0lut_88', 'app.revolut.com', 'Prywatne', 'Karta wirtualna']];
    const CAT = { Praca: 'bdg info', Prywatne: 'bdg sec', Studia: 'bdg ok' };
    const open = S.open, shown = S.shown || {}, shownNote = S.shownNote || {}, copied = S.copied;
    return {
      q: S.q || '', onQ: (e) => this.setState({ q: e.target.value }),
      cats: ['Wszystkie', 'Praca', 'Prywatne', 'Studia'].map((c) => ({ t: c, p: (S.cat || 'Wszystkie') === c ? 'true' : 'false', pick: () => this.setState({ cat: c }) })),
      items: R.filter((r) => (!S.cat || S.cat === 'Wszystkie' || r[4] === S.cat) && (!q || (r[0] + ' ' + r[1]).toLowerCase().indexOf(q) >= 0)).map((r) => {
        const o = open === r[0], sh = !!shown[r[0]], shn = !!shownNote[r[0]];
        return { name: r[0], user: r[1], ini: r[0].charAt(0), open: o, exp: o ? 'true' : 'false',
          chevS: 'display:flex;transition:transform 150ms ease;' + (o ? 'transform:rotate(90deg)' : ''),
          toggle: () => this.setState({ open: o ? null : r[0] }),
          pw: sh ? r[2] : '••••••••••', revealLbl: sh ? 'Ukryj hasło' : 'Pokaż hasło', reveal: () => this.setState({ shown: Object.assign({}, shown, { [r[0]]: !sh }) }),
          copy: () => this.setState({ copied: r[0] }),
          cat: r[4], catC: CAT[r[4]],
          noteTxt: r[5] ? (shn ? r[5] : '••••••••') : '—', revealNoteLbl: shn ? 'Ukryj notatkę' : 'Pokaż notatkę', revealNote: () => this.setState({ shownNote: Object.assign({}, shownNote, { [r[0]]: !shn }) }),
          url: r[3], note: copied === r[0] ? 'Skopiowano · schowek wyczyści się za 30 s' : '', noteC: '#15803d' };
      })
    };
  }
}
</script>
</body>
</html>
