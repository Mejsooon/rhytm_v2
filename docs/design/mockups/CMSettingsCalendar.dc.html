<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon — Ustawienia, Kalendarz (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
/* CM-BASE — wspólne dodatki mobilne COSS. Ten blok ma być IDENTYCZNY w każdym pliku CM*.
   Wszystko inne bierzemy z arkusza coss/coss.css (klasy .btn/.btnp/.btng/.btns/.btnd/.btndo,
   .inp/.igroup/.dd, .fld/.lbl/.hint/.err, .cbx/.sw/input[type=checkbox|radio], .seg/.tabs/.chip/.dot, .bdg.*,
   .card/.card-h/.card-t/.card-d/.card-p/.foot, .frame>.inner, .sep, .pop/.mi/.mi-sep/.mi-lbl, .backdrop, .dlg*,
   .toast, .alert.*, .kbd, .prog, .avatar, .empty/.empty-ic, .num, .muted, .h-title). */

/* Ekran telefonu */
html body .m-screen{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:var(--foreground);font-size:14px}
html body .m-status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600}
html body .m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);background:#fff}
html body .m-title{margin:0;font-size:18px;font-weight:600;letter-spacing:-.011em}
html body .m-body{padding:16px}

/* Cele dotykowe ≥44 px na telefonie (nadpisują rozmiary webowe arkusza) */
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo){height:44px}
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo).ic{width:44px}
html body .m-screen :is(.inp,.dd,.igroup){height:44px;font-size:16px}
html body .m-screen textarea.inp{height:auto}
html body .m-screen .seg :is(a,button){height:40px}
html body .m-screen .chip{height:36px}
html body .m-screen .mi{min-height:44px}
html body .m-hit{position:relative}
html body .m-hit::before{content:"";position:absolute;inset:-14px}

/* Wiersz listy (ustawienia, strony, wyniki wyszukiwania) */
html body .m-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
html body .m-row:last-child{border-bottom:0}

/* Arkusz od dołu = .dlg przyklejony do dołu */
html body .m-sheet{position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;max-height:88%;overflow:auto}
html body .m-grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:8px auto 0}

/* Krok +/− */
html body .m-step{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:var(--radius);box-shadow:var(--shadow-xs5);overflow:hidden}
html body .m-step button{width:44px;height:44px;padding:0;border:0;background:#fff;font:inherit;font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer;color:var(--foreground)}
html body .m-step span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}

/* Przycisk pływający (FAB) — nad paskiem zakładek */
html body .m-fab{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:16px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px -4px rgba(38,38,38,.32);cursor:pointer}

body{margin:0;background:#ffffff}
html body .crow{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-bottom:1px solid var(--border)}
html body .crow:last-child{border-bottom:0}
html body section.card,html body .card{flex-shrink:0}

html body .m-screen .card :is(.card-h,.card-p,.foot,.m-row){padding-left:16px;padding-right:16px}
</style>
</helmet>
<div class="m-screen" style="display: flex; flex-direction: column">
  <div class="m-status"><span>9:41</span><span></span></div>
  <header class="m-head" style="padding: 0 8px"><a href="CMSettings.dc.html" class="btng ic" aria-label="Wstecz"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><h1 class="m-title" style="flex: 1; text-align: center">Kalendarz</h1><span style="width: 44px"></span></header>
  <div style="flex: 1; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <section class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
      <div class="fld"><span>Widok domyślny</span><div class="seg" role="radiogroup" aria-label="Widok domyślny" style="display: flex"><sc-for list="{{views}}" as="v" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{v.p}}" aria-pressed="{{v.p}}" onClick="{{v.pick}}" style="flex: 1">{{v.t}}</button></sc-for></div></div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px"><label class="fld">Siatka od<select class="dd" aria-label="Siatka od"><option>07:00</option><option>06:00</option><option>08:00</option></select></label><label class="fld">do<select class="dd" aria-label="Siatka do"><option>23:00</option><option>22:00</option><option>24:00</option></select></label></div>
      <div class="fld"><span>Domyślna długość bloku</span><div class="seg" role="radiogroup" aria-label="Długość bloku" style="display: flex"><sc-for list="{{lens}}" as="v" hint-placeholder-count="4"><button type="button" role="radio" aria-checked="{{v.p}}" aria-pressed="{{v.p}}" onClick="{{v.pick}}" style="flex: 1">{{v.t}}</button></sc-for></div></div>
    </section>
    <section class="card" style="padding: 0">
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="2"><div class="crow" style="min-height: 60px"><span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 500">{{t.t}}</span><span class="hint" style="font-size: 13px">{{t.d}}</span></span><button type="button" class="sw m-hit" role="switch" aria-checked="{{t.on}}" aria-label="{{t.t}}" onClick="{{t.toggle}}"></button></div></sc-for>
    </section>
    <div class="lbl" style="margin: 0 4px -8px">Połączone kalendarze</div>
    <section class="card" style="padding: 0">
      <div class="crow"><span style="width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); display: grid; place-items: center; font-weight: 700; color: #4285f4; flex: none">G</span><span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Google Calendar</span><span class="hint" style="display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{gTxt}}</span></span><button type="button" class="btn" onClick="{{gToggle}}" style="height: 36px">{{gBtn}}</button></div>
      <sc-if value="{{gOn}}" hint-placeholder-val="{{true}}"><sc-for list="{{subs}}" as="k" hint-placeholder-count="3"><label class="crow" style="padding-left: 56px"><span style="{{k.dot}}"></span><span style="flex: 1">{{k.t}}</span><input type="checkbox" checked="{{k.on}}" onChange="{{k.toggle}}" aria-label="{{k.t}}"></label></sc-for></sc-if>
      <div class="crow"><span style="flex: 1; color: #525252; white-space: nowrap">+ Połącz Outlook albo iCloud</span></div>
    </section>
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px -8px"><span class="lbl">Kategorie</span><a href="CMCategorySheet.dc.html" class="hint">+ Nowa</a></div>
    <section class="card" style="padding: 0"><sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><a href="CMCategorySheet.dc.html" class="crow" style="color: inherit; text-decoration: none"><span style="{{c.dot}}"></span><span style="flex: 1">{{c.t}}</span><span class="hint num" style="font-size: 13px">{{c.n}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></sc-for></section>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const view = S.view || 'week', len = S.len || 60, T = S.t || { renew: true, wk: true }, sub = S.sub || { p: true, u: true, b: false };
    const g = S.g !== false;
    const dot = (c) => 'width:10px;height:10px;border-radius:50%;flex:none;background:' + c;
    return {
      views: [['day', 'Dzień'], ['week', 'Tydzień'], ['month', 'Miesiąc']].map((v) => ({ t: v[1], p: view === v[0] ? 'true' : 'false', pick: () => this.setState({ view: v[0] }) })),
      lens: [[30, '30 min'], [60, '1 h'], [90, '1,5 h'], [120, '2 h']].map((v) => ({ t: v[1], p: len === v[0] ? 'true' : 'false', pick: () => this.setState({ len: v[0] }) })),
      toggles: [['renew', 'Odnowienia subskrypcji', 'Chipy nad dniem ze strony Subskrypcje'], ['wk', 'Numery tygodni', 'W miesiącu i mini-kalendarzu']].map((x) => ({ t: x[1], d: x[2], on: T[x[0]] ? 'true' : 'false', toggle: () => this.setState({ t: Object.assign({}, T, { [x[0]]: !T[x[0]] }) }) })),
      gOn: g, gTxt: g ? 'mejson@gmail.com · 2 min temu' : 'Rozłączono', gBtn: g ? 'Rozłącz' : 'Połącz', gToggle: () => this.setState({ g: !g }),
      subs: [['p', 'Prywatny', '#4285f4'], ['u', 'Uczelnia — plan zajęć', '#0b8043'], ['b', 'Urodziny', '#8e24aa']].map((k) => ({ t: k[1], dot: dot(k[2]), on: !!sub[k[0]], toggle: () => this.setState({ sub: Object.assign({}, sub, { [k[0]]: !sub[k[0]] }) }) })),
      cats: [['Studia', '#3b82f6', '14 bloków'], ['Projekty', '#15803d', '9 bloków'], ['Praca', '#8b5cf6', '0 bloków'], ['Sport', '#f59e0b', '6 bloków'], ['Dom', '#eab308', '3 bloki']].map((c) => ({ t: c[0], dot: dot(c[1]), n: c[2] }))
    };
  }
}

</script>
</body>
</html>
