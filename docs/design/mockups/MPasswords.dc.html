<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon — Hasła</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#171717;text-decoration:none}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:.06em}
.top{display:flex;align-items:center;gap:4px;padding:8px;min-height:60px;box-sizing:border-box;flex:none}
.ib{width:44px;height:44px;border:0;background:none;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#171717;flex:none;padding:0}
.ib:hover{background:#f5f5f5}
.body{flex:1;overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:16px}
.h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0}
.h2{font-size:17px;font-weight:600;margin:0}
.sub{font-size:13px;color:#666666}
.card{border:1px solid #eaeaea;border-radius:12px;background:#ffffff}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-bottom:1px solid #f0f0f0;box-sizing:border-box}
.row:last-child{border-bottom:0}
a.row:hover{background:#fafafa}
.btnp{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:10px;background:#171717;color:#ffffff;border:1px solid #171717;font:inherit;font-weight:500;cursor:pointer;width:100%;box-sizing:border-box}
a.btnp,a.btnp:hover{color:#ffffff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:10px;background:#ffffff;color:#171717;border:1px solid #e0e0e0;font:inherit;font-weight:500;cursor:pointer;width:100%;box-sizing:border-box}
.btn:hover{background:#fafafa}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:#f2f2f2;border-radius:10px;padding:3px;gap:3px}
.sg{height:34px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:13px;color:#555555;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sg.on,.sg[aria-pressed="true"]{background:#ffffff;color:#171717;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.inp{height:48px;border:1px solid #e0e0e0;border-radius:10px;padding:0 14px;font:inherit;font-size:15px;font-weight:400;width:100%;box-sizing:border-box;background:#ffffff;color:#171717;outline:none}
.inp:focus{border-color:#171717}
.inp::placeholder{color:#a3a3a3}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid #e0e0e0;border-radius:999px;background:#ffffff;font:inherit;font-size:14px;color:#171717;cursor:pointer}
.chip.on,.chip[aria-pressed="true"]{background:#171717;border-color:#171717;color:#ffffff}
.fab{position:absolute;right:16px;bottom:100px;width:56px;height:56px;border-radius:16px;background:#171717;color:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.18);z-index:5}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:8}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:#ffffff;border-radius:18px 18px 0 0;display:flex;flex-direction:column;max-height:92%;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.grab{width:36px;height:5px;border-radius:3px;background:#d4d4d4;margin:8px auto 2px;flex:none}
.cb{width:24px;height:24px;flex:0 0 24px;border-radius:7px;border:1.5px solid #cfcfcf;background:#ffffff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:#ffffff}
.cb[aria-checked="true"]{background:#15803d;border-color:#15803d}
.sw{width:50px;height:30px;flex:0 0 50px;border-radius:15px;border:0;background:#d9d9d9;position:relative;cursor:pointer;padding:0;transition:background 160ms ease}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#ffffff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform 160ms ease}
.sw[aria-checked="true"]{background:#15803d}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.badge{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;border-radius:5px;padding:2px 7px;white-space:nowrap}
.stat{display:block;background:#ffffff;padding:12px 14px;color:#171717}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:#eaeaea;border:1px solid #eaeaea;border-radius:12px;overflow:hidden}
.num{font-family:'Geist Mono',ui-monospace,monospace;font-size:22px;font-weight:500;margin-top:4px}
.chev{color:#a3a3a3;margin-left:auto;flex:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #ffffff; color: #171717; font-family: 'Geist', system-ui, sans-serif; font-size: 15px">

  <header class="top" style="padding: 8px 8px 4px 8px"><a href="MPages.dc.html" class="ib" aria-label="Strony"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><div style="flex: 1"></div><a href="MVault.dc.html" class="ib" aria-label="Zablokuj sejf" style="color: #b45309"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></a><button type="button" class="ib" aria-label="Nowe hasło"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></header>
  <div class="body" style="padding-top: 0">
    <div><h1 class="h1">Passwords</h1><div class="mono" style="font-size: 12px; color: #15803d; margin-top: 4px">odblokowany · auto-blokada za 4:52</div></div>
    <label style="position: relative; display: block"><span style="position: absolute; left: 12px; top: 12px; color: #8a8a8a; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span><input class="inp" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Szukaj" aria-label="Szukaj haseł" style="height: 44px; padding-left: 40px; background: #f5f5f5; border-color: #f5f5f5"></label>
    <div class="card"><sc-for list="{{items}}" as="it" hint-placeholder-count="6">
      <div style="border-bottom: 1px solid #f0f0f0">
        <button type="button" onClick="{{it.toggle}}" aria-expanded="{{it.exp}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 0 14px; border: 0; background: none; font: inherit; cursor: pointer; text-align: left; color: #171717"><span style="width: 40px; height: 40px; border-radius: 10px; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-weight: 600; flex: none">{{it.ini}}</span><span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 500">{{it.name}}</span><span style="font-size: 13px; color: #6b6b6b">{{it.user}}</span></span><span style="{{it.chevS}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></button>
        <sc-if value="{{it.open}}" hint-placeholder-val="{{false}}"><div style="padding: 0 14px 14px 66px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 4px; background: #fafafa; border: 1px solid #eaeaea; border-radius: 10px; padding-left: 12px"><span class="mono" style="flex: 1; font-size: 15px; letter-spacing: .02em">{{it.pw}}</span><button type="button" class="ib" aria-label="{{it.revealLbl}}" onClick="{{it.reveal}}" style="width: 40px; height: 40px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button><button type="button" class="ib" aria-label="Kopiuj hasło" onClick="{{it.copy}}" style="width: 40px; height: 40px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button></div>
          <span class="mono" style="font-size: 11px; color: {{it.noteC}}">{{it.note}}</span>
        </div></sc-if>
      </div>
    </sc-for></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const q = (S.q || '').toLowerCase();
    const R = [['Google', 'mejson@example.com', 'k7#Vq2!mLp9z', 'zmienione 3 mies. temu'], ['GitHub', 'Mejsooon', 'Gh_42!xTr8w', '2FA włączone'], ['Netflix', 'mejson@example.com', 'netflix2024', 'słabe hasło — zmień'],
      ['USOS', 's123456', 'Uczelnia#2026', 'zmienione 2 tyg. temu'], ['Framer', 'mejson@example.com', 'Fr4mer!Site', 'używane przez 2 konta'], ['Revolut', '+48 ••• ••• 123', 'R3v!0lut_88', '2FA włączone']];
    const open = S.open, shown = S.shown || {}, copied = S.copied;
    return {
      q: S.q || '', onQ: (e) => this.setState({ q: e.target.value }),
      items: R.filter((r) => !q || (r[0] + ' ' + r[1]).toLowerCase().indexOf(q) >= 0).map((r) => {
        const o = open === r[0], sh = !!shown[r[0]];
        return { name: r[0], user: r[1], ini: r[0].charAt(0), open: o, exp: o ? 'true' : 'false',
          chevS: 'display:flex;transition:transform 150ms ease;' + (o ? 'transform:rotate(90deg)' : ''),
          toggle: () => this.setState({ open: o ? null : r[0] }),
          pw: sh ? r[2] : '••••••••••', revealLbl: sh ? 'Ukryj hasło' : 'Pokaż hasło', reveal: () => this.setState({ shown: Object.assign({}, shown, { [r[0]]: !sh }) }),
          copy: () => this.setState({ copied: r[0] }),
          note: copied === r[0] ? 'Skopiowano · schowek wyczyści się za 30 s' : r[3], noteC: copied === r[0] ? '#15803d' : (r[3].indexOf('słabe') >= 0 ? '#b91c1c' : '#6b6b6b') };
      })
    };
  }
}
</script>
</body>
</html>
