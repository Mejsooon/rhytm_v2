<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Sidebar rhytm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
nav a{transition:background-color 120ms ease}
nav a:hover{background:#f5f5f5;color:#171717}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;border-radius:6px;background:transparent;font:inherit;font-size:13px;color:#171717;cursor:pointer;text-align:left;box-sizing:border-box}
.mi:hover{background:#f5f5f5}
</style>
</helmet>
<nav aria-label="Główna nawigacja" style="box-sizing: border-box; min-height: min({{mh}}px, 100vh); height: 100%; width: 100%; background: #fafafa; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; color: #171717">
  <div style="display: flex; align-items: center; gap: 10px; padding: 6px 8px 8px">
    <svg width="24" height="24" viewBox="0 0 48 48" role="img" aria-label="rhytm" style="flex: none"><rect x="4" y="4" width="11" height="11" rx="3" fill="#171717" opacity="1"></rect><rect x="18" y="4" width="11" height="11" rx="3" fill="#171717" opacity="0.55"></rect><rect x="32" y="4" width="11" height="11" rx="3" fill="#171717" opacity="0.25"></rect><rect x="4" y="18" width="11" height="11" rx="3" fill="#171717" opacity="0.55"></rect><rect x="18" y="18" width="11" height="11" rx="3" fill="#171717" opacity="0.25"></rect><rect x="32" y="18" width="11" height="11" rx="3" fill="#15803d" opacity="1"></rect><rect x="4" y="32" width="11" height="11" rx="3" fill="#171717" opacity="0.25"></rect><rect x="18" y="32" width="11" height="11" rx="3" fill="#171717" opacity="1"></rect><rect x="32" y="32" width="11" height="11" rx="3" fill="#171717" opacity="0.55"></rect></svg>
    <span style="font-weight: 600; flex: 1; letter-spacing: -0.045em; font-size: 16px">rhytm</span>
  </div>
  <a href="CommandK.dc.html" style="display: flex; align-items: center; gap: 8px; border: 1px solid #eaeaea; border-radius: 6px; padding: 7px 10px; margin: 2px 0 10px; color: #666666; background: #ffffff; text-decoration: none">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <span style="flex: 1">Szukaj…</span>
    <span style="font-family: 'Geist Mono', monospace; font-size: 11px; border: 1px solid #e0e0e0; border-radius: 4px; padding: 0 5px">⌘K</span>
  </a>

  <div style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #6b6b6b; padding: 6px 8px; text-transform: uppercase; letter-spacing: .06em">Moduły</div>
  <a href="Today.dc.html" style="{{s.dzis}}" onMouseEnter="{{en.dzis}}" onMouseLeave="{{lv}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg>Dziś</a>
  <a href="Calendar.dc.html" style="{{s.kalendarz}}" onMouseEnter="{{en.kalendarz}}" onMouseLeave="{{lv}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Kalendarz</a>
  <a href="Sport.dc.html" style="{{s.sport}}" onMouseEnter="{{en.sport}}" onMouseLeave="{{lv}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>Sport</a>
  <a href="Habits.dc.html" style="{{s.nawyki}}" onMouseEnter="{{en.nawyki}}" onMouseLeave="{{lv}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="m8 12 3 3 5-6"></path></svg>Nawyki i sen</a>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 8px 6px">
    <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #6b6b6b; text-transform: uppercase; letter-spacing: .06em">Strony</span>
    <a href="NewPage.dc.html" aria-label="Dodaj stronę" style="color: #666666; display: flex; padding: 2px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
  </div>
  <sc-for list="{{pages}}" as="p" hint-placeholder-count="6">
  <div draggable="{{p.draggable}}" onDragStart="{{p.dragStart}}" onDragOver="{{p.dragOver}}" onDrop="{{p.drop}}" onDragEnd="{{dragEnd}}" style="{{p.rowS}}" onMouseEnter="{{p.enter}}" onMouseLeave="{{lv}}">
    <sc-if value="{{p.editing}}" hint-placeholder-val="{{false}}">
      <input type="text" aria-label="Nazwa strony" value="{{draft}}" onChange="{{onDraft}}" onKeyDown="{{onDraftKey}}" onBlur="{{saveName}}" style="box-sizing: border-box; width: 100%; height: 32px; padding: 0 8px; border: 1px solid #171717; border-radius: 6px; background: #ffffff; font: inherit; font-size: 14px; color: #171717; outline: none">
    </sc-if>
    <sc-if value="{{p.notEditing}}" hint-placeholder-val="{{true}}">
      <a href="{{p.href}}" draggable="false" style="{{p.s}}">
        <dc-import name="PageIcon" icon="{{p.icon}}" size="16" fallback="{{p.fallback}}" hint-size="16px,16px"></dc-import>
        <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.label}}</span>
        <sc-if value="{{p.fav}}" hint-placeholder-val="{{false}}"><span aria-label="Ulubiona" style="font-size: 11px; color: #a16207; margin-right: 22px">★</span></sc-if>
      </a>
      <sc-if value="{{p.showDots}}" hint-placeholder-val="{{false}}">
        <button type="button" aria-label="{{p.menuLabel}}" aria-haspopup="menu" aria-expanded="{{p.menuExp}}" onClick="{{p.toggleMenu}}" style="position: absolute; right: 3px; top: 3px; width: 26px; height: 26px; border: 0; border-radius: 5px; background: {{p.dotsBg}}; color: #404040; font: inherit; font-size: 14px; line-height: 1; cursor: pointer">⋯</button>
      </sc-if>
    </sc-if>

    <sc-if value="{{p.menuOpen}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.06); padding: 6px; box-sizing: border-box; font-size: 13px">
        <sc-if value="{{modeList}}" hint-placeholder-val="{{true}}">
          <div role="menu" aria-label="{{p.menuLabel}}" style="display: flex; flex-direction: column">
            <button type="button" role="menuitem" class="mi" onClick="{{startRename}}"><span aria-hidden="true" style="width: 18px; color: #6b6b6b; font-family: 'Geist Mono', monospace">✎</span><span style="flex: 1">Zmień nazwę</span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #6b6b6b">F2</span></button>
            <button type="button" role="menuitem" class="mi" onClick="{{showIcons}}"><span aria-hidden="true" style="width: 18px; color: #6b6b6b; font-family: 'Geist Mono', monospace">◇</span><span style="flex: 1">Zmień ikonę</span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #6b6b6b">›</span></button>
            <button type="button" role="menuitem" class="mi" onClick="{{duplicate}}"><span aria-hidden="true" style="width: 18px; color: #6b6b6b; font-family: 'Geist Mono', monospace">⧉</span><span style="flex: 1">Duplikuj</span></button>
            <button type="button" role="menuitem" class="mi" onClick="{{toggleFav}}"><span aria-hidden="true" style="width: 18px; color: #a16207; font-family: 'Geist Mono', monospace">★</span><span style="flex: 1">{{favLabel}}</span></button>
            <div style="height: 1px; background: #eaeaea; margin: 6px 4px"></div>
            <button type="button" role="menuitem" class="mi" onClick="{{askDelete}}" style="color: #b91c1c"><span aria-hidden="true" style="width: 18px; font-family: 'Geist Mono', monospace">✕</span><span style="flex: 1">Usuń stronę</span></button>
          </div>
        </sc-if>
        <sc-if value="{{modeIcons}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 6px; padding: 2px">
            <div style="display: flex; align-items: center; gap: 6px"><button type="button" aria-label="Wróć do menu" onClick="{{showList}}" style="width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; font: inherit; cursor: pointer; color: #404040">←</button><span style="font-weight: 500">Zmień ikonę</span></div>
            <dc-import name="IconPicker" value="{{curIcon}}" on-pick="{{pickIcon}}" hint-size="100%,330px"></dc-import>
          </div>
        </sc-if>
      </div>
    </sc-if>
  </div>
  </sc-for>
  <a href="NewPage.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 6px; color: #6b6b6b; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nowa strona</a>

  <div style="flex: 1; min-height: 24px"></div>
  <a href="Settings.dc.html" style="{{s.ustawienia}}" onMouseEnter="{{en.ustawienia}}" onMouseLeave="{{lv}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"></path></svg>Ustawienia</a>
  <div style="position: relative; margin-top: 6px; border-top: 1px solid #eaeaea; padding-top: 4px">
  <sc-if value="{{acctOpen}}" hint-placeholder-val="{{false}}">
    <div role="dialog" aria-label="Konto" style="position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); z-index: 20; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.06); padding: 6px; display: flex; flex-direction: column; gap: 2px; font-size: 13px">
      <div style="padding: 8px 10px 10px; border-bottom: 1px solid #f0f0f0; margin-bottom: 4px"><div style="font-weight: 500">Mejson</div><div style="font-size: 12px; color: #666666">mejson@example.com</div></div>
      <a href="Login.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: #b91c1c; text-decoration: none; font-weight: 500"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5M21 12H9"></path></svg>Wyloguj się</a>
    </div>
  </sc-if>
  <button type="button" onClick="{{toggleAcct}}" aria-expanded="{{acctExp}}" aria-haspopup="dialog" style="{{acctS}}">
    <span style="width: 26px; height: 26px; border-radius: 50%; background: #f0f0f0; border: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500">M</span>
    <span style="display: flex; flex-direction: column; min-width: 0; flex: 1"><span style="font-weight: 500">Mejson</span><span style="font-size: 12px; color: #666666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">mejson@example.com</span></span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" aria-hidden="true"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"></path></svg>
  </button>
  </div>
  <sc-if value="{{anyMenu}}" hint-placeholder-val="{{false}}">
    <button type="button" aria-label="Zamknij menu strony" tabindex="-1" onClick="{{closeMenu}}" style="position: fixed; inset: 0; z-index: 25; border: 0; padding: 0; margin: 0; background: transparent; cursor: default"></button>
  </sc-if>
  <sc-if value="{{confirmOpen}}" hint-placeholder-val="{{false}}">
    <div style="position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.32); display: flex; align-items: center; justify-content: center; padding: 16px">
      <div role="alertdialog" aria-label="Usuń stronę" style="width: 360px; max-width: 100%; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; box-shadow: 0 16px 48px rgba(0,0,0,.16); padding: 18px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box">
        <div style="font-weight: 600">{{confirmTitle}}</div>
        <p style="margin: 0; font-size: 13px; color: #666666; line-height: 1.5">{{confirmText}}</p>
        <div style="display: flex; justify-content: flex-end; gap: 8px"><button type="button" onClick="{{cancelDelete}}" style="background: #ffffff; color: #171717; border: 1px solid #e0e0e0; border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer">Anuluj</button><button type="button" onClick="{{doDelete}}" style="background: #b91c1c; color: #ffffff; border: 1px solid #b91c1c; border-radius: 6px; padding: 7px 12px; font: inherit; font-weight: 500; cursor: pointer">Usuń</button></div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{toastOpen}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: fixed; right: 24px; bottom: 24px; z-index: 45; display: flex; align-items: center; gap: 14px; background: #171717; color: #ffffff; border-radius: 8px; padding: 10px 12px 10px 14px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.18)">
      <span>Usunięto</span><button type="button" onClick="{{undoDelete}}" style="background: transparent; color: #ffffff; border: 1px solid #525252; border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer">Cofnij</button>
    </div>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"minHeight":{"editor":"int","default":900,"min":600,"max":2000,"unit":"px"},"active":{"editor":"enum","options":["dzis","kalendarz","sport","nawyki","subs","books","projects","websites","passwords","empty","ustawienia"],"default":"dzis"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const active = this.props.active ?? 'dzis';
    const base = 'display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;text-decoration:none;';
    const keys = ['dzis', 'kalendarz', 'sport', 'nawyki', 'ustawienia'];
    const s = {};
    const en = {};
    keys.forEach((k) => {
      s[k] = base + (k === active ? 'background:#f0f0f0;color:#171717;font-weight:500;' : (st.hov === k ? 'background:#f5f5f5;color:#171717;' : 'color:#666666;'));
      en[k] = () => this.setState({ hov: k });
    });

    // Strony: kolejność, nazwy, ikony, ulubione i kosz żyją w stanie, jak w aplikacji.
    const START = [
      { k: 'subs', href: 'Main.dc.html', name: 'Subscriptions', lock: false, rows: 13, icon: { kind: 'emoji', v: '💳' } },
      { k: 'books', href: 'Books.dc.html', name: 'Books', lock: false, rows: 11, icon: { kind: 'emoji', v: '📚' } },
      { k: 'projects', href: 'Projects.dc.html', name: 'Projects', lock: false, rows: 8, icon: { kind: 'icon', v: 'rocket', color: 'blue' } },
      { k: 'websites', href: 'Websites.dc.html', name: 'Websites', lock: false, rows: 4, icon: { kind: 'icon', v: 'globe', color: 'teal' } },
      { k: 'passwords', href: 'Passwords.dc.html', name: 'Passwords', lock: true, rows: 4, icon: { kind: 'emoji', v: '🔒' } },
      { k: 'empty', href: 'EmptyPage.dc.html', name: '', lock: false, rows: 0 }
    ];
    const lista = st.list || START;
    const zywe = lista.filter((p) => !(st.deleted || {})[p.k]);
    const menu = st.menu || null;
    const tryb = st.mode || 'list';
    const otwarta = zywe.find((p) => p.k === menu) || null;
    const nazwa = (p) => ((st.names || {})[p.k] ?? p.name) || 'Bez tytułu';
    const odmiana = (n) => {
      const d = n % 10;
      const s100 = n % 100;
      if (n === 1) return '1 wiersz trafi';
      if (d >= 2 && d <= 4 && !(s100 >= 12 && s100 <= 14)) return n + ' wiersze trafią';
      return n + ' wierszy trafi';
    };
    // Przeciąganie: strona upuszczona nad/pod inną stroną trafia w to miejsce.
    const upusc = (cel, po) => {
      const zrodlo = st.drag;
      if (!zrodlo || zrodlo === cel) { this.setState({ drag: null, over: null }); return; }
      const bez = lista.filter((x) => x.k !== zrodlo);
      const i = bez.findIndex((x) => x.k === cel);
      bez.splice(po ? i + 1 : i, 0, lista.find((x) => x.k === zrodlo));
      this.setState({ list: bez, drag: null, over: null });
    };

    const pages = zywe.map((p) => {
      const ikona = (st.icons || {})[p.k] || p.icon || null;
      const isActive = p.k === active;
      const isOpen = p.k === menu;
      const editing = st.renaming === p.k;
      const hov = st.hov === p.k;
      return {
        href: p.href,
        label: nazwa(p),
        icon: ikona,
        fallback: p.lock ? 'lock' : 'table',
        fav: !!(st.fav || {})[p.k],
        editing,
        notEditing: !editing,
        showDots: isActive || hov || isOpen,
        dotsBg: isOpen ? '#e6e6e6' : 'transparent',
        menuOpen: isOpen,
        menuExp: isOpen ? 'true' : 'false',
        menuLabel: 'Menu strony ' + nazwa(p),
        s: base + 'padding-right:32px;' + (isActive ? 'background:#f0f0f0;color:#171717;font-weight:500;' : (hov || isOpen ? 'background:#f5f5f5;color:#171717;' : 'color:#666666;')),
        draggable: editing ? 'false' : 'true',
        rowS: 'position:relative;border-radius:6px;' + (st.drag === p.k ? 'opacity:.45;' : '') + (st.over && st.over.k === p.k && st.drag !== p.k ? (st.over.po ? 'box-shadow:inset 0 -2px 0 #171717;' : 'box-shadow:inset 0 2px 0 #171717;') : ''),
        dragStart: (e) => {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', p.k);
          this.setState({ drag: p.k, menu: null });
        },
        dragOver: (e) => {
          if (!st.drag) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          const r = e.currentTarget.getBoundingClientRect();
          const po = e.clientY > r.top + r.height / 2;
          if (!st.over || st.over.k !== p.k || st.over.po !== po) this.setState({ over: { k: p.k, po } });
        },
        drop: (e) => {
          e.preventDefault();
          upusc(p.k, !!(st.over && st.over.k === p.k && st.over.po));
        },
        enter: () => this.setState({ hov: p.k }),
        toggleMenu: () => this.setState({ menu: isOpen ? null : p.k, mode: 'list' })
      };
    });

    const zapisz = () => {
      if (!st.renaming) return;
      const n = Object.assign({}, st.names || {});
      n[st.renaming] = (st.draft || '').trim();
      this.setState({ names: n, renaming: null });
    };
    const ao = !!st.acct;
    const usuwana = lista.find((p) => p.k === st.confirm) || null;

    return {
      s, en, pages,
      lv: () => this.setState({ hov: null }),
      dragEnd: () => this.setState({ drag: null, over: null }),
      mh: this.props.minHeight ?? 900,
      anyMenu: !!otwarta,
      modeList: tryb === 'list',
      modeIcons: tryb === 'icons',
      closeMenu: () => this.setState({ menu: null, mode: 'list' }),
      showIcons: () => this.setState({ mode: 'icons' }),
      showList: () => this.setState({ mode: 'list' }),
      curIcon: otwarta ? ((st.icons || {})[otwarta.k] || otwarta.icon || null) : null,
      pickIcon: (v) => {
        const ic = Object.assign({}, st.icons || {});
        ic[menu] = v;
        this.setState({ icons: ic, menu: null, mode: 'list' });
      },
      startRename: () => this.setState({ renaming: menu, draft: otwarta ? ((st.names || {})[otwarta.k] ?? otwarta.name) : '', menu: null }),
      draft: st.draft || '',
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onDraftKey: (e) => {
        if (e.key === 'Enter') zapisz();
        if (e.key === 'Escape') this.setState({ renaming: null });
      },
      saveName: zapisz,
      duplicate: () => {
        if (!otwarta) return;
        const kopia = Object.assign({}, otwarta, { k: otwarta.k + '-kopia-' + Date.now(), name: (((st.names || {})[otwarta.k] ?? otwarta.name) || 'Bez tytułu') + ' (kopia)' });
        const nowa = lista.slice();
        nowa.splice(lista.indexOf(otwarta) + 1, 0, kopia);
        const ic = Object.assign({}, st.icons || {});
        if (ic[otwarta.k] !== undefined) ic[kopia.k] = ic[otwarta.k];
        this.setState({ list: nowa, icons: ic, menu: null });
      },
      favLabel: otwarta && (st.fav || {})[otwarta.k] ? 'Usuń z ulubionych' : 'Dodaj do ulubionych',
      toggleFav: () => {
        const f = Object.assign({}, st.fav || {});
        f[menu] = !f[menu];
        this.setState({ fav: f, menu: null });
      },
      askDelete: () => this.setState({ confirm: menu, menu: null }),
      confirmOpen: !!usuwana,
      confirmTitle: usuwana ? 'Usunąć stronę „' + nazwa(usuwana) + '”?' : '',
      confirmText: usuwana ? (usuwana.rows > 0 ? odmiana(usuwana.rows) + ' do kosza na 30 dni. Daty z tej strony znikną z kalendarza.' : 'Strona trafi do kosza na 30 dni.') : '',
      cancelDelete: () => this.setState({ confirm: null }),
      doDelete: () => {
        const d = Object.assign({}, st.deleted || {});
        d[st.confirm] = true;
        this.setState({ deleted: d, confirm: null, lastDeleted: st.confirm });
      },
      toastOpen: !!st.lastDeleted,
      undoDelete: () => {
        const d = Object.assign({}, st.deleted || {});
        delete d[st.lastDeleted];
        this.setState({ deleted: d, lastDeleted: null });
      },
      acctOpen: ao, acctExp: ao ? 'true' : 'false',
      toggleAcct: () => this.setState({ acct: !ao }),
      acctS: 'display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:6px;font:inherit;color:#171717;text-align:left;cursor:pointer;background:' + (ao ? '#f0f0f0' : 'transparent')
    };
  }
}
</script>
</body>
</html>
