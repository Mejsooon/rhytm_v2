    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <span style="flex: 1">Szukaj…</span>
    <span style="font-family: 'Geist Mono', monospace; font-size: 11px; border: 1px solid #e0e0e0; border-radius: 4px; padding: 0 5px">⌘K</span>

  <div style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #6b6b6b; padding: 6px 8px; text-transform: uppercase; letter-spacing: .06em">Moduły</div>
  <a href="Today.dc.html" style="{{s.dzis}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg>Dziś</a>
  <a href="Calendar.dc.html" style="{{s.kalendarz}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Kalendarz</a>
  <a href="Sport.dc.html" style="{{s.sport}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>Sport</a>
  <a href="Habits.dc.html" style="{{s.nawyki}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="m8 12 3 3 5-6"></path></svg>Nawyki i sen</a>

  </div>
  <a href="Main.dc.html" style="{{s.subs}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 10v10"></path></svg>Subscriptions</a>
  <a href="Books.dc.html" style="{{s.books}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 10v10"></path></svg>Books</a>
  <a href="Projects.dc.html" style="{{s.projects}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 10v10"></path></svg>Projects</a>

  <a href="EmptyPage.dc.html" style="{{s.empty}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 10v10"></path></svg>Bez tytułu</a>

  <div style="flex: 1; min-height: 24px"></div>

    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" aria-hidden="true"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"></path></svg>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"minHeight":{"editor":"int","default":900,"min":600,"max":2000,"unit":"px"},"active":{"editor":"enum","options":["dzis","kalendarz","sport","nawyki","subs","books","projects","websites","passwords","empty","ustawienia"],"default":"dzis"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dzis';
    const base = 'display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;text-decoration:none;';
    const keys = ['dzis', 'kalendarz', 'sport', 'nawyki', 'subs', 'books', 'projects', 'websites', 'passwords', 'empty', 'ustawienia'];
    const s = {};
    keys.forEach((k) => {
      s[k] = base + (k === active ? 'background:#f0f0f0;color:#171717;font-weight:500;' : 'color:#666666;');
    });
    return { s, mh: this.props.minHeight ?? 900 };
  }
}
</script>
</body>
</html>
