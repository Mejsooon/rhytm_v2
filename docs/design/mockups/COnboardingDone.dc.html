<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Onboarding 7 — Gotowe (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#fafafa}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid rgba(0,0,0,.1);border-radius:12px;background:#fff;background-clip:padding-box;box-shadow:0 1px 2px rgba(0,0,0,.05);font:inherit;color:#262626;cursor:pointer;box-sizing:border-box;transition:border-color .15s,background-color .15s,box-shadow .15s}
.opt:hover{background:#fafafa}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:rgba(0,0,0,.24);background:rgba(0,0,0,.025);box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.opt .cbx{margin-top:2px;pointer-events:none}
.opt[aria-pressed="true"] .cbx,.opt[aria-checked="true"] .cbx{background:#262626;border-color:#262626;color:#fafafa}
@media (max-width:1100px){.split{grid-template-columns:1fr !important}.pvside{display:none !important}}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: #fafafa; color: #262626; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums">
  <header style="height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 24px">
    <svg width="24" height="24" viewBox="0 0 48 48" role="img" aria-label="rhytm" style="flex: none"><rect x="4" y="4" width="11" height="11" rx="3" fill="#262626"></rect><rect x="18" y="4" width="11" height="11" rx="3" fill="#262626" opacity="0.55"></rect><rect x="32" y="4" width="11" height="11" rx="3" fill="#262626" opacity="0.25"></rect><rect x="4" y="18" width="11" height="11" rx="3" fill="#262626" opacity="0.55"></rect><rect x="18" y="18" width="11" height="11" rx="3" fill="#262626" opacity="0.25"></rect><rect x="32" y="18" width="11" height="11" rx="3" fill="#15803d"></rect><rect x="4" y="32" width="11" height="11" rx="3" fill="#262626" opacity="0.25"></rect><rect x="18" y="32" width="11" height="11" rx="3" fill="#262626"></rect><rect x="32" y="32" width="11" height="11" rx="3" fill="#262626" opacity="0.55"></rect></svg><span style="font-weight: 600; font-size: 16px; letter-spacing: -0.03em">rhytm</span>
    <span class="bdg sec lg" style="margin-left: auto">Krok 7 z 7</span>
    <a href="CLogin.dc.html" class="btng sm" style="margin-left: 8px; color: #686868">Wyloguj</a>
  </header>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 24px 40px">
    <div class="card" style="width: 100%; max-width: 1120px; height: 720px; overflow: hidden">
      <div role="progressbar" aria-label="Postęp" aria-valuemin="1" aria-valuemax="7" aria-valuenow="7" style="display: flex; gap: 4px; padding: 16px 20px 0"><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span></div>
      <div class="split" style="flex: 1; min-height: 0; display: grid; grid-template-columns: 520px 1fr">
        <div style="display: flex; flex-direction: column; min-height: 0">
          <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; padding: 32px 40px 20px">
            <div style="display: flex; flex-direction: column; gap: 16px">
              <svg width="40" height="40" viewBox="0 0 48 48" role="img" aria-label="rhytm" style="flex: none"><rect x="4" y="4" width="11" height="11" rx="3" fill="#262626"></rect><rect x="18" y="4" width="11" height="11" rx="3" fill="#262626" opacity="0.55"></rect><rect x="32" y="4" width="11" height="11" rx="3" fill="#262626" opacity="0.25"></rect><rect x="4" y="18" width="11" height="11" rx="3" fill="#262626" opacity="0.55"></rect><rect x="18" y="18" width="11" height="11" rx="3" fill="#262626" opacity="0.25"></rect><rect x="32" y="18" width="11" height="11" rx="3" fill="#15803d"></rect><rect x="4" y="32" width="11" height="11" rx="3" fill="#262626" opacity="0.25"></rect><rect x="18" y="32" width="11" height="11" rx="3" fill="#262626"></rect><rect x="32" y="32" width="11" height="11" rx="3" fill="#262626" opacity="0.55"></rect></svg>
              <div><h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.02em">Gotowe, {{name}}</h1><p class="muted" style="margin: 6px 0 0">Twój rhytm jest ułożony. Oto co przygotowaliśmy</p></div>
            </div>
            <div class="card" style="padding: 0 16px">
              <dl style="margin: 0">
                <sc-for list="{{sum}}" as="s" hint-placeholder-count="5"><div style="{{s.rs}}"><span style="width: 20px; height: 20px; border-radius: 50%; background: rgba(21,128,61,.1); display: grid; place-items: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><dt class="hint" style="font-size: 13px">{{s.k}}</dt><dd style="margin: 0; font-weight: 500">{{s.v}}</dd><a href="{{s.href}}" class="btng xs" style="color: #686868">Zmień</a></div></sc-for>
              </dl>
            </div>
            <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #686868">Pierwszy blok dodasz skrótem <span class="kbd">Ctrl</span><span class="kbd">K</span></div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; padding: 14px 40px; border-top: 1px solid rgba(0,0,0,.08); background: rgba(0,0,0,.02)">
            <a class="btng" href="COnboardingNotify.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Wstecz</a>
            <span style="flex: 1"></span>

            <a class="btnp" href="CEmptyToday.dc.html">Przejdź do Dziś<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
          </div>
        </div>
        <div class="pvside" style="position: relative; border-left: 1px solid rgba(0,0,0,.08); overflow: hidden"><dc-import name="COnbPreview" s="{{S}}" step="7" hint-size="100%,680px"></dc-import></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = {}; }
  renderVals() {
    const D = { name: 'Mejson', tz: 'Europe/Warsaw', week: 'pn', clock: '24', roles: { student: true, sport: true }, field: 'Cyberbezpieczeństwo', goals: { plan: true, sport: true, habits: true, subs: true, proj: true }, pages: { Subscriptions: true, Projects: true }, notify: { perm: true, before: true, renew: true, weekly: true, habits: false } };
    const S = Object.assign({}, D, this.state || {});
    const v = (e) => (e && e.target ? e.target.value : e);
    const nm = (S.name || '').trim() || 'Ty';
    const R = S.roles || {};
    const cn = [];
    if (R.student) cn.push('Studia'); if (R.work) cn.push('Praca'); if (R.free) cn.push('Projekty'); if (R.sport) cn.push('Sport'); if (R.other || !cn.length) cn.push('Dom');
    const P = S.pages || {};
    const pages = ['Subscriptions', 'Projects', 'Books', 'Websites', 'Passwords'].filter((p) => P[p]);
    const N = S.notify || {};
    const N2 = ['before', 'renew', 'weekly', 'habits'].filter((k) => N[k]).length;
    const L = [
      { k: 'Profil', v: nm + ' · ' + S.tz, href: 'COnboarding.dc.html' },
      { k: 'Kategorie', v: cn.join(', '), href: 'COnboardingRole.dc.html' },
      { k: 'Cele treningowe', v: '3 treningi / tydz. · 25 km / tydz.', href: 'COnboardingGoals.dc.html' },
      { k: 'Strony', v: pages.join(', ') || 'brak', href: 'COnboardingPages.dc.html' },
      { k: 'Przypomnienia', v: N2 + ' włączone', href: 'COnboardingNotify.dc.html' }
    ];
    const sum = L.map((s, i) => Object.assign({}, s, { rs: 'display:grid;grid-template-columns:24px 128px 1fr auto;align-items:center;gap:8px;min-height:48px;' + (i < L.length - 1 ? 'border-bottom:1px solid rgba(0,0,0,.08)' : '') }));
    return { S, name: nm, sum };
  }
}
</script>
</body>
</html>
