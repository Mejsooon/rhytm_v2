<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon — Trening siłowy (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
/* CM-BASE — wspólne dodatki mobilne COSS. Ten blok ma być IDENTYCZNY w każdym pliku CM*.
   Wszystko inne bierzemy z arkusza coss/coss.css (klasy .btn/.btnp/.btng/.btns/.btnd/.btndo,
   .inp/.igroup/.dd, .fld/.lbl/.hint/.err, .cbx/.sw/input[type=checkbox|radio], .seg/.tabs/.chip/.dot, .bdg.*,
   .card/.card-h/.card-t/.card-d/.card-p/.foot, .frame>.inner, .sep, .pop/.mi/.mi-sep/.mi-lbl, .backdrop, .dlg*,
   .toast, .alert.*, .kbd, .prog, .avatar, .empty/.empty-ic, .num, .muted, .h-title). */

/* Ekran telefonu */
html body .m-screen{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:var(--foreground);font-size:14px}
html body .m-status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600}
html body .m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);background:#fff}
html body .m-title{margin:0;font-size:18px;font-weight:600;letter-spacing:-.011em}
html body .m-body{padding:16px}

/* Cele dotykowe ≥44 px na telefonie (nadpisują rozmiary webowe arkusza) */
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo){height:44px}
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo).ic{width:44px}
html body .m-screen :is(.inp,.dd,.igroup){height:44px;font-size:16px}
html body .m-screen textarea.inp{height:auto}
html body .m-screen .seg :is(a,button){height:40px}
html body .m-screen .chip{height:36px}
html body .m-screen .mi{min-height:44px}
html body .m-hit{position:relative}
html body .m-hit::before{content:"";position:absolute;inset:-14px}

/* Wiersz listy (ustawienia, strony, wyniki wyszukiwania) */
html body .m-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
html body .m-row:last-child{border-bottom:0}

/* Arkusz od dołu = .dlg przyklejony do dołu */
html body .m-sheet{position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;max-height:88%;overflow:auto}
html body .m-grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:8px auto 0}

/* Krok +/− */
html body .m-step{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:var(--radius);box-shadow:var(--shadow-xs5);overflow:hidden}
html body .m-step button{width:44px;height:44px;border:0;background:#fff;font:inherit;font-size:18px;cursor:pointer}
html body .m-step span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}

/* Przycisk pływający (FAB) — nad paskiem zakładek */
html body .m-fab{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:16px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px -4px rgba(38,38,38,.32);cursor:pointer}

body{margin:0;background:#ffffff}
html body .set-grid{display:grid;grid-template-columns:36px 1fr 1fr 44px;gap:8px;align-items:center}
</style>
</helmet>
<div class="m-screen" style="display: flex; flex-direction: column">

  <header class="m-head" style="flex: none; padding: 0 8px"><a href="CMSport.dc.html" class="btng ic" aria-label="Wstecz"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><div style="flex: 1; text-align: center"><h1 class="m-title" style="font-size: 16px">Push</h1><div class="hint num">{{doneSets}}/{{allSets}} serii · 32:10</div></div><a href="CMSport.dc.html" class="btng" style="color: var(--success-foreground)">Zakończ</a></header>
  <div class="prog" style="flex: none; height: 4px; border-radius: 0"><div style="{{progS}}"></div></div>
  <div class="m-body" style="flex: 1; overflow-y: auto; padding-top: 14px; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{ex}}" as="e" hint-placeholder-count="3">
      <section class="card">
        <div style="display: flex; align-items: center; padding: 12px 14px 6px"><a href="CMExerciseDetail.dc.html" style="flex: 1; font-weight: 600; color: inherit; text-decoration: none">{{e.t}}</a><span class="bdg out num">{{e.prev}}</span><button type="button" class="btng ic" aria-label="{{e.delLbl}}" onClick="{{e.del}}" style="color: var(--muted-foreground); margin-right: -10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg></button></div>
        <div class="set-grid lbl" style="padding: 6px 14px; border-bottom: 1px solid var(--border)"><span>Seria</span><span>kg</span><span>Powt.</span><span></span></div>
        <sc-for list="{{e.sets}}" as="s" hint-placeholder-count="3"><div class="set-grid" style="{{s.rowS}}"><span class="bdg sec num" style="width: 24px">{{s.n}}</span><span class="num" style="font-size: 16px; font-weight: 500">{{s.kg}}</span><span class="num" style="font-size: 16px; font-weight: 500">{{s.reps}}</span><button type="button" class="cbx m-hit" role="checkbox" aria-checked="{{s.on}}" aria-label="{{s.label}}" onClick="{{s.toggle}}" style="justify-self: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></button></div></sc-for>
        <button type="button" class="btng" onClick="{{e.add}}" style="width: 100%; border-top: 1px solid var(--border); border-radius: 0 0 15px 15px">+ Dodaj serię</button>
      </section>
    </sc-for>
    <button type="button" class="btn" style="width: 100%; border-style: dashed"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Dodaj ćwiczenie</button>
    <span class="hint" style="text-align: center; margin-top: -6px">mc = masa ciała 78 kg z profilu · „+ kg” to dociążenie</span>
    <button type="button" class="btn" style="width: 100%" onClick="{{saveTpl}}">{{tplTxt}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const BASE = [['Wyciskanie leżąc', 'ost. 3×8 · 60 kg', [[60, 8], [60, 8], [62.5, 6]]], ['Wyciskanie hantli nad głowę', 'ost. 3×10 · 16 kg', [[16, 10], [16, 10], [16, 9]]], ['Pompki na poręczach', 'ost. 3×12 · mc', [[0, 12], [0, 12], [5, 10]], true]];
    const extra = S.extra || [0, 0, 0];
    const done = S.done || { '0-0': true, '0-1': true };
    let all = 0, dn = 0;
    const gone = S.gone || [];
    const ex = BASE.map((e, ei) => [e, ei]).filter((x) => !gone.includes(x[1])).map(([e, ei]) => {
      const sets = e[2].concat(Array(extra[ei]).fill(e[2][e[2].length - 1]));
      return { t: e[0], prev: e[1], delLbl: 'Usuń ćwiczenie ' + e[0], del: () => this.setState({ gone: gone.concat([ei]) }), add: () => this.setState({ extra: extra.map((x, j) => (j === ei ? x + 1 : x)) }),
        sets: sets.map((s, si) => { const k = ei + '-' + si; const on = !!done[k]; all++; if (on) dn++;
          return { n: si + 1, kg: e[3] ? (s[0] ? 'mc + ' + String(s[0]).replace('.', ',') : 'mc') : String(s[0]).replace('.', ','), reps: s[1], on: on ? 'true' : 'false', label: e[0] + ', seria ' + (si + 1),
            rowS: 'min-height:48px;padding:0 14px;border-bottom:1px solid rgba(0,0,0,.05);' + (on ? 'background:rgba(21,128,61,.05)' : ''),
            toggle: () => this.setState({ done: Object.assign({}, done, { [k]: !on }) }) }; }) };
    });
    return { ex, doneSets: dn, allSets: all, progS: 'height:100%;background:#15803d;width:' + (all ? dn / all * 100 : 0) + '%',
      tplTxt: S.tpl ? 'Zapisano zmiany w szablonie „Push” ✓' : 'Zapisz jako szablon', saveTpl: () => this.setState({ tpl: true }) };
  }
}
</script>
</body>
</html>
