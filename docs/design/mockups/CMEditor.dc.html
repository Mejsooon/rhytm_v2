<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon — Edytor strony (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#fff}
/* CM-BASE — wspólne dodatki mobilne COSS. Ten blok ma być IDENTYCZNY w każdym pliku CM*.
   Wszystko inne bierzemy z arkusza coss/coss.css (klasy .btn/.btnp/.btng/.btns/.btnd/.btndo,
   .inp/.igroup/.dd, .fld/.lbl/.hint/.err, .cbx/.sw/input[type=checkbox|radio], .seg/.tabs/.chip/.dot, .bdg.*,
   .card/.card-h/.card-t/.card-d/.card-p/.foot, .frame>.inner, .sep, .pop/.mi/.mi-sep/.mi-lbl, .backdrop, .dlg*,
   .toast, .alert.*, .kbd, .prog, .avatar, .empty/.empty-ic, .num, .muted, .h-title). */

/* Ekran telefonu */
html body .m-screen{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:var(--foreground);font-size:14px}
html body .m-status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600}
html body .m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);background:#fff}
html body .m-title{margin:0;font-size:18px;font-weight:600;letter-spacing:-.011em}
html body .m-body{padding:16px}

/* Cele dotykowe ≥44 px na telefonie (nadpisują rozmiary webowe arkusza) */
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo){height:44px}
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo).ic{width:44px}
html body .m-screen :is(.inp,.dd,.igroup){height:44px;font-size:16px}
html body .m-screen textarea.inp{height:auto}
html body .m-screen .seg :is(a,button){height:40px}
html body .m-screen .chip{height:36px}
html body .m-screen .mi{min-height:44px}
html body .m-hit{position:relative}
html body .m-hit::before{content:"";position:absolute;inset:-14px}

/* Wiersz listy (ustawienia, strony, wyniki wyszukiwania) */
html body .m-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
html body .m-row:last-child{border-bottom:0}

/* Arkusz od dołu = .dlg przyklejony do dołu */
html body .m-sheet{position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;max-height:88%;overflow:auto}
html body .m-grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:8px auto 0}

/* Krok +/− */
html body .m-step{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:var(--radius);box-shadow:var(--shadow-xs5);overflow:hidden}
html body .m-step button{width:44px;height:44px;padding:0;border:0;background:#fff;font:inherit;font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer;color:var(--foreground)}
html body .m-step span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}

/* Przycisk pływający (FAB) — nad paskiem zakładek */
html body .m-fab{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:16px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px -4px rgba(38,38,38,.32);cursor:pointer}

html body .ed-body{flex:1;overflow-y:auto;padding:8px 16px 96px;display:flex;flex-direction:column;gap:10px}
html body .ed-in{border:0;outline:none;font:inherit;color:var(--foreground);background:transparent;width:100%;min-width:0;box-sizing:border-box;border-radius:6px}
html body .ed-in:focus{background:rgba(0,0,0,.02);box-shadow:0 0 0 2px rgba(38,38,38,.08)}
html body .block-icon{width:40px;height:40px;flex:0 0 40px;border:1px solid var(--border);border-radius:10px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#525252;box-shadow:var(--shadow-xs5)}
html body .th-cell{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border:0;border-right:1px solid var(--border);background:none;font:inherit;font-size:14px;font-weight:500;color:var(--muted-foreground);cursor:pointer;text-align:left;white-space:nowrap}
html body .editbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;align-items:center;padding:8px 12px 26px;border-top:1px solid var(--border);background:#fafafa;z-index:4}
</style>
</helmet>
<div class="m-screen" style="display:flex;flex-direction:column">
  <div class="m-status"><span>9:41</span><span></span></div>

  <header class="m-head" style="padding:0 8px"><a href="CMPages.dc.html" class="btng ic" aria-label="Strony"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><div style="flex: 1"></div><a href="CMFilterSheet.dc.html" class="btng ic" aria-label="Filtr i sortowanie"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></a><a href="CMCardSheet.dc.html" class="btng ic" aria-label="Dodaj kartę"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 15v-3M12 15V9M17 15v-5"></path></svg></a><a href="CMPageMenu.dc.html" class="btng ic" aria-label="Menu strony"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></a></header>
  <div class="ed-body">
    <input type="text" value="{{title}}" onChange="{{onTitle}}" placeholder="Bez tytułu" aria-label="Nazwa strony" style="border: 0; outline: 0; font: inherit; font-size: 24px; font-weight: 600; letter-spacing: -.02em; padding: 0; background: transparent; color: #262626; width: 100%">
    <sc-for list="{{blocks}}" as="b" hint-placeholder-count="0">
      <sc-if value="{{b.isH}}" hint-placeholder-val="{{false}}"><input type="text" class="ed-in" value="{{b.text}}" onChange="{{b.onText}}" placeholder="Nagłówek" aria-label="Nagłówek" style="font-size: 20px; font-weight: 600; letter-spacing: -.01em; padding: 6px 0"></sc-if>
      <sc-if value="{{b.isText}}" hint-placeholder-val="{{false}}"><input type="text" class="ed-in" value="{{b.text}}" onChange="{{b.onText}}" placeholder="Pusty akapit" aria-label="Akapit" style="line-height: 1.6; padding: 4px 0"></sc-if>
      <sc-if value="{{b.isTodo}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; gap: 10px; min-height: 44px"><button type="button" class="cbx m-hit" role="checkbox" aria-checked="{{b.ac}}" aria-label="Zrobione" onClick="{{b.toggle}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button><input type="text" class="ed-in" value="{{b.text}}" onChange="{{b.onText}}" placeholder="Zadanie" aria-label="Zadanie" style="{{b.todoS}}"></div></sc-if>
      <sc-if value="{{b.isTable}}" hint-placeholder-val="{{false}}">
        <section style="display: flex; flex-direction: column; gap: 8px; margin: 4px 0">
          <div class="frame"><div class="inner" style="overflow-x:auto">
            <div style="{{b.gridS}}; background: rgba(0,0,0,.02); border-bottom: 1px solid rgba(0,0,0,.08)"><sc-for list="{{b.cols}}" as="c" hint-placeholder-count="3"><button type="button" class="th-cell" onClick="{{c.edit}}" aria-label="{{c.aria}}"><span style="color: #a3a3a3; font-size: 12px; font-weight: 600; min-width: 14px">{{c.icon}}</span>{{c.name}}</button></sc-for><button type="button" class="btng ic" onClick="{{b.addCol}}" aria-label="Dodaj kolumnę" style="border-radius:0;font-size:18px">+</button></div>
            <sc-for list="{{b.rows}}" as="row" hint-placeholder-count="2"><div style="{{b.gridS}}; border-bottom: 1px solid rgba(0,0,0,.06)"><sc-for list="{{row.cells}}" as="cell" hint-placeholder-count="3"><div style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-right: 1px solid rgba(0,0,0,.04)">
              <sc-if value="{{cell.isText}}" hint-placeholder-val="{{true}}"><input type="text" class="ed-in" value="{{cell.v}}" onChange="{{cell.on}}" placeholder="{{cell.ph}}" aria-label="{{cell.label}}" style="{{cell.inS}}"></sc-if>
              <sc-if value="{{cell.isCheck}}" hint-placeholder-val="{{false}}"><button type="button" class="cbx m-hit" role="checkbox" aria-checked="{{cell.ac}}" aria-label="{{cell.label}}" onClick="{{cell.toggle}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button></sc-if>
              <sc-if value="{{cell.isSel}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{cell.cycle}}" aria-label="{{cell.label}}: {{cell.v}}, stuknij by zmienić" class="m-hit" style="background:none;border:0;padding:0;cursor:pointer;font:inherit"><span class="{{cell.bc}}">{{cell.txt}}</span></button></sc-if>
            </div></sc-for><button type="button" class="btng ic" aria-label="Usuń wiersz" onClick="{{row.remove}}" style="border-radius:0;color:#a3a3a3"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div></sc-for>
          </div></div>
          <div style="display: flex; align-items: center; justify-content: space-between"><button type="button" class="btng muted" onClick="{{b.addRow}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nowy wiersz</button><span class="bdg sec">{{b.meta}}</span></div>
        </section>
      </sc-if>
    </sc-for>
    <div style="position:relative"><input type="text" class="ed-in" value="{{cmd}}" onChange="{{onCmd}}" onKeyDown="{{onKey}}" placeholder="Wpisz „/”, aby wstawić blok" aria-label="Nowy blok" style="padding: 10px 0; color: #404040"></div>
  </div>
  <div class="editbar">
    <button type="button" class="btnp ic" aria-label="Wstaw blok" onClick="{{openMenu}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    <button type="button" class="btng ic" aria-label="Wstaw tabelę" onClick="{{addTable}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 10v10"></path></svg></button>
    <button type="button" class="btng ic" aria-label="Wstaw zadanie" onClick="{{addTodo}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="m8 12 3 3 5-6"></path></svg></button>
    <button type="button" class="btng ic" aria-label="Wstaw nagłówek" onClick="{{addH}}" style="font-weight: 700">H</button>
    <span style="flex: 1"></span><span class="bdg sec">{{blockCount}}</span>
  </div>
  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
    <button type="button" class="backdrop" aria-label="Zamknij menu" onClick="{{closeMenu}}" style="border:0;cursor:pointer"></button>
    <div class="dlg m-sheet" role="dialog" aria-label="Wstaw blok">
      <div class="m-grab"></div>
      <div class="dlg-h" style="align-items:center;padding:8px 8px 8px 20px"><h2 class="dlg-t" style="flex:1">Wstaw blok</h2><button type="button" class="btng ic" aria-label="Zamknij" onClick="{{closeMenu}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
      <div style="padding:0 12px 30px"><sc-for list="{{menu}}" as="m" hint-placeholder-count="5"><button type="button" class="mi" aria-selected="{{m.sel}}" onClick="{{m.pick}}" style="min-height:60px;gap:12px;padding:8px"><span class="block-icon">{{m.icon}}</span><span style="display: flex; flex-direction: column; text-align: left"><span style="font-weight: 500">{{m.label}}</span><span class="muted" style="font-size: 13px">{{m.desc}}</span></span></button></sc-for>
        <sc-if value="{{menuEmpty}}" hint-placeholder-val="{{false}}"><p class="hint" style="padding:12px 8px;margin:0">Brak bloku „{{q}}”</p></sc-if></div>
    </div>
  </sc-if>
  <sc-if value="{{colOpen}}" hint-placeholder-val="{{false}}">
    <button type="button" class="backdrop" aria-label="Zamknij" onClick="{{closeCol}}" style="border:0;cursor:pointer"></button>
    <div class="dlg m-sheet" role="dialog" aria-label="Ustawienia kolumny">
      <div class="m-grab"></div>
      <div class="dlg-h" style="align-items:center;padding:8px 8px 8px 20px"><h2 class="dlg-t" style="flex:1">Kolumna</h2><button type="button" class="btng" aria-label="Gotowe" onClick="{{closeCol}}" style="font-weight:600">Gotowe</button></div>
      <div class="dlg-b" style="padding:4px 20px 30px">
        <input class="inp" type="text" value="{{col.name}}" onChange="{{col.onName}}" aria-label="Nazwa kolumny">
        <span class="lbl">Typ pola</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><sc-for list="{{col.types}}" as="t" hint-placeholder-count="4"><button type="button" class="chip" aria-pressed="{{t.p}}" onClick="{{t.pick}}" style="justify-content:flex-start"><span class="num muted" style="width:20px;font-size:12px;font-weight:600">{{t.icon}}</span>{{t.label}}</button></sc-for></div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button type="button" class="btn" onClick="{{col.moveL}}">← W lewo</button><button type="button" class="btn" onClick="{{col.moveR}}">W prawo →</button></div>
        <button type="button" class="btndo" onClick="{{col.remove}}">Usuń kolumnę</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const B = S.blocks || [];
    const cmd = S.cmd || '';
    const P = S.col || null;
    const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    const pl = (n, a, b, c) => n + ' ' + (n === 1 ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? b : c);
    // typy jak w aplikacji (src/features/pages/fields.ts); Sekret tylko w module Hasła
    const TYPES = [['text', 'Aa', 'Tekst'], ['num', '#', 'Liczba'], ['date', '▦', 'Data'], ['sel', '◐', 'Wybór'], ['check', '☑', 'Checkbox'], ['url', '↗', 'URL'], ['rating', '★', 'Ocena'], ['recurring', '↻zł', 'Kwota cykliczna'], ['renewal', '↻', 'Data odnowienia']];
    const OPTS = ['Do zrobienia', 'W toku', 'Zrobione'];
    const OPS = ['bdg sec', 'bdg info', 'bdg ok'];
    const DEFS = [['table', '▦', 'Tabela', 'Wiersze i kolumny z typami pól', 'tabela table'], ['todo', '☑', 'Lista zadań', 'Punkty do odhaczenia', 'lista zadania todo'],
      ['h', 'H', 'Nagłówek', 'Tytuł sekcji', 'naglowek heading'], ['text', '¶', 'Tekst', 'Zwykły akapit', 'tekst akapit']];
    const save = (blocks, extra) => this.setState(Object.assign({ blocks }, extra || {}));
    const upd = (id, fn, extra) => save(B.map((b) => (b.id === id ? fn(b) : b)), extra);
    const mk = (k, text) => k === 'table'
      ? { id: nid(), type: 'table', cols: [{ id: 'a', name: 'Nazwa', type: 'text' }, { id: 'b', name: 'Status', type: 'sel' }, { id: 'c', name: 'Gotowe', type: 'check' }], rows: [{ id: nid(), v: {} }, { id: nid() + 'x', v: {} }] }
      : { id: nid(), type: k, text: text || '', done: false };
    const insert = (k, text) => save(B.concat([mk(k, text)]), { cmd: '', menu: false });
    const q = cmd.charAt(0) === '/' ? cmd.slice(1).toLowerCase().trim() : null;
    const menuOn = !!S.menu || q !== null;
    const found = DEFS.filter((d) => !q || (d[2].toLowerCase() + ' ' + d[4]).indexOf(q) >= 0);
    const blocks = B.map((b) => {
      const o = { isH: b.type === 'h', isText: b.type === 'text', isTodo: b.type === 'todo', isTable: b.type === 'table', text: b.text || '',
        onText: (e) => upd(b.id, (x) => Object.assign({}, x, { text: e.target.value })),
        ac: b.done ? 'true' : 'false', toggle: () => upd(b.id, (x) => Object.assign({}, x, { done: !x.done })),
        todoS: (b.done ? 'text-decoration:line-through;color:#a3a3a3' : '') };
      if (b.type === 'table') {
        const n = b.cols.length;
        o.gridS = 'display:grid;grid-template-columns:' + b.cols.map((c, i) => (i === 0 ? '160px' : '120px')).join(' ') + ' 44px;min-width:' + (160 + 120 * (n - 1) + 44) + 'px';
        o.cols = b.cols.map((c) => ({ name: c.name, icon: TYPES.filter((t) => t[0] === c.type)[0][1], aria: 'Kolumna ' + c.name + ' — ustawienia', edit: () => this.setState({ col: { b: b.id, c: c.id } }) }));
        o.addCol = () => { const id = 'c' + nid(); upd(b.id, (x) => Object.assign({}, x, { cols: x.cols.concat([{ id, name: 'Kolumna ' + (x.cols.length + 1), type: 'text' }]) }), { col: { b: b.id, c: id } }); };
        o.addRow = () => upd(b.id, (x) => Object.assign({}, x, { rows: x.rows.concat([{ id: nid(), v: {} }]) }));
        o.meta = pl(b.rows.length, 'wiersz', 'wiersze', 'wierszy') + ' · ' + pl(n, 'kolumna', 'kolumny', 'kolumn');
        o.rows = b.rows.map((r) => ({
          remove: () => upd(b.id, (x) => Object.assign({}, x, { rows: x.rows.filter((y) => y.id !== r.id) })),
          cells: b.cols.map((c, ci) => {
            const v = r.v[c.id];
            const set = (val) => upd(b.id, (x) => Object.assign({}, x, { rows: x.rows.map((y) => (y.id === r.id ? Object.assign({}, y, { v: Object.assign({}, y.v, { [c.id]: val }) }) : y)) }));
            const oi = OPTS.indexOf(v);
            return { isText: c.type === 'text' || c.type === 'num', isCheck: c.type === 'check', isSel: c.type === 'sel', label: c.name,
              v: v || '', on: (e) => set(e.target.value), ph: ci === 0 ? 'Bez nazwy' : '',
              inS: 'font-size:14px;' + (ci === 0 ? 'font-weight:500;' : '') + (c.type === 'num' ? 'text-align:right;font-variant-numeric:tabular-nums' : ''),
              ac: v ? 'true' : 'false', toggle: () => set(!v),
              txt: oi >= 0 ? v : '—', bc: oi >= 0 ? OPS[oi] : 'muted', cycle: () => set(OPTS[(oi + 1) % OPTS.length]) };
          })
        }));
      }
      return o;
    });
    let col = {};
    const cb = P && B.filter((b) => b.id === P.b)[0];
    const cc = cb && cb.cols.filter((c) => c.id === P.c)[0];
    if (cc) {
      const ci = cb.cols.indexOf(cc);
      const setCol = (patch) => upd(cb.id, (x) => Object.assign({}, x, { cols: x.cols.map((c) => (c.id === cc.id ? Object.assign({}, c, patch) : c)) }));
      const move = (dir) => { const j = ci + dir; if (j < 0 || j >= cb.cols.length) return; upd(cb.id, (x) => { const a = x.cols.slice(); const t = a[ci]; a[ci] = a[j]; a[j] = t; return Object.assign({}, x, { cols: a }); }); };
      col = { name: cc.name, onName: (e) => setCol({ name: e.target.value }), moveL: () => move(-1), moveR: () => move(1),
        remove: () => { if (cb.cols.length > 1) upd(cb.id, (x) => Object.assign({}, x, { cols: x.cols.filter((c) => c.id !== cc.id) }), { col: null }); },
        types: TYPES.map((t) => ({ icon: t[1], label: t[2], p: t[0] === cc.type ? 'true' : 'false', pick: () => setCol({ type: t[0] }),  })) };
    }
    return {
      title: S.title || '', onTitle: (e) => this.setState({ title: e.target.value }),
      blocks, isEmpty: !B.length, blockCount: pl(B.length, 'blok', 'bloki', 'bloków'),
      cmd, onCmd: (e) => this.setState({ cmd: e.target.value }),
      onKey: (e) => { const val = e.target.value || ''; if (e.key === 'Enter') { e.preventDefault(); if (val.charAt(0) === '/') { const qq = val.slice(1).toLowerCase().trim(); const hit = DEFS.filter((d) => (d[2].toLowerCase() + ' ' + d[4]).indexOf(qq) >= 0)[0]; if (hit) insert(hit[0]); } else if (val.trim()) insert('text', val.trim()); } },
      openMenu: () => this.setState({ menu: true }), closeMenu: () => this.setState({ menu: false, cmd: '' }),
      addTable: () => insert('table'), addTodo: () => insert('todo'), addH: () => insert('h'),
      menuOpen: menuOn, q: q || '', menuEmpty: menuOn && !found.length,
      menu: found.map((d, i) => ({ icon: d[1], label: d[2], desc: d[3], pick: () => insert(d[0]),
        sel: i === 0 && q ? 'true' : 'false' })),
      colOpen: !!cc, closeCol: () => this.setState({ col: null }), col
    };
  }
}
</script>
