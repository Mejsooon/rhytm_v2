<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Onboarding 6 — Powiadomienia (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#fafafa}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid rgba(0,0,0,.1);border-radius:12px;background:#fff;background-clip:padding-box;box-shadow:0 1px 2px rgba(0,0,0,.05);font:inherit;color:#262626;cursor:pointer;box-sizing:border-box;transition:border-color .15s,background-color .15s,box-shadow .15s}
.opt:hover{background:#fafafa}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:rgba(0,0,0,.24);background:rgba(0,0,0,.025);box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.opt .cbx{margin-top:2px;pointer-events:none}
.opt[aria-pressed="true"] .cbx,.opt[aria-checked="true"] .cbx{background:#262626;border-color:#262626;color:#fafafa}
@media (max-width:1100px){.split{grid-template-columns:1fr !important}.pvside{display:none !important}}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: #fafafa; color: #262626; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums">
  <header style="height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 24px">
    <svg width="24" height="24" viewBox="0 0 48 48" role="img" aria-label="rhytm" style="flex: none"><rect x="4" y="4" width="11" height="11" rx="3" fill="#262626"></rect><rect x="18" y="4" width="11" height="11" rx="3" fill="#262626" opacity="0.55"></rect><rect x="32" y="4" width="11" height="11" rx="3" fill="#262626" opacity="0.25"></rect><rect x="4" y="18" width="11" height="11" rx="3" fill="#262626" opacity="0.55"></rect><rect x="18" y="18" width="11" height="11" rx="3" fill="#262626" opacity="0.25"></rect><rect x="32" y="18" width="11" height="11" rx="3" fill="#15803d"></rect><rect x="4" y="32" width="11" height="11" rx="3" fill="#262626" opacity="0.25"></rect><rect x="18" y="32" width="11" height="11" rx="3" fill="#262626"></rect><rect x="32" y="32" width="11" height="11" rx="3" fill="#262626" opacity="0.55"></rect></svg><span style="font-weight: 600; font-size: 16px; letter-spacing: -0.03em">rhytm</span>
    <span class="bdg sec lg" style="margin-left: auto">Krok 6 z 7</span>
    <a href="S2Login.dc.html" class="btng sm" style="margin-left: 8px; color: #686868">Wyloguj</a>
  </header>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 24px 40px">
    <div class="card" style="width: 100%; max-width: 1120px; height: 720px; overflow: hidden">
      <div role="progressbar" aria-label="Postęp" aria-valuemin="1" aria-valuemax="7" aria-valuenow="6" style="display: flex; gap: 4px; padding: 16px 20px 0"><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(0,0,0,.08)"></span></div>
      <div class="split" style="flex: 1; min-height: 0; display: grid; grid-template-columns: 520px 1fr">
        <div style="display: flex; flex-direction: column; min-height: 0">
          <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; padding: 32px 40px 20px">
            <div><h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em">Przypomnienia</h1><p class="muted" style="margin: 6px 0 0">Wybierz, o czym mamy Ci przypominać. Ustawienia zmienisz w każdej chwili</p></div>
            <div class="card" style="flex-direction: row; align-items: center; gap: 12px; padding: 14px 16px">
              <span style="width: 32px; height: 32px; border-radius: 8px; background: rgba(0,0,0,.04); display: grid; place-items: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg></span>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">Powiadomienia w przeglądarce</span><span class="hint" style="font-size: 13px">{{permText}}</span></span>
              <sc-if value="{{notPerm}}" hint-placeholder-val="{{false}}"><button type="button" class="btnp" onClick="{{allow}}">Zezwól</button></sc-if>
              <sc-if value="{{perm}}" hint-placeholder-val="{{true}}"><span class="bdg ok lg"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Włączone</span><button type="button" class="btng sm" onClick="{{revoke}}">Anuluj</button></sc-if>
            </div>
            <div class="card" style="padding: 0 16px">
              <sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><div style="{{r.rs}}"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">{{r.title}}</span><span class="hint" style="font-size: 13px">{{r.when}}</span></span><button type="button" class="sw" role="switch" aria-checked="{{r.on}}" aria-label="{{r.title}}" onClick="{{r.toggle}}"></button></div></sc-for>
            </div>
            <div class="alert info"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path></svg><span>Na telefonie dodaj rhytm do ekranu głównego, żeby dostawać push także przy zamkniętej karcie</span></div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; padding: 14px 40px; border-top: 1px solid rgba(0,0,0,.08); background: rgba(0,0,0,.02)">
            <a class="btng" href="S2OnboardingPages.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Wstecz</a>
            <span style="flex: 1"></span>

            <a class="btnp" href="S2OnboardingDone.dc.html">Dalej<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
          </div>
        </div>
        <div class="pvside" style="position: relative; border-left: 1px solid rgba(0,0,0,.08); overflow: hidden"><dc-import name="S2OnbPreview" s="{{S}}" step="6" hint-size="100%,680px"></dc-import></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { notify: { perm: false, before: true, renew: true, weekly: true, habits: false } }; }
  renderVals() {
    const D = { name: 'Mejson', tz: 'Europe/Warsaw', week: 'pn', clock: '24', roles: { student: true, sport: true }, field: 'Cyberbezpieczeństwo', goals: { plan: true, sport: true, habits: true, subs: true, proj: true }, pages: { Subscriptions: true, Projects: true }, notify: { perm: true, before: true, renew: true, weekly: true, habits: false } };
    const S = Object.assign({}, D, this.state || {});
    const v = (e) => (e && e.target ? e.target.value : e);
    const N = S.notify || {};
    const RW = [['before', 'Przed blokiem', '10 min wcześniej'], ['renew', 'Odnowienie subskrypcji', '3 dni wcześniej, o 9:00'], ['weekly', 'Podsumowanie tygodnia', 'Niedziela, 18:00'], ['habits', 'Nawyki na dziś', 'Codziennie, 21:00']];
    const rows = RW.map((r, i) => { const on = !!N[r[0]]; return { title: r[1], when: r[2], on: on ? 'true' : 'false', rs: 'display:flex;align-items:center;gap:12px;min-height:58px;' + (i < RW.length - 1 ? 'border-bottom:1px solid rgba(0,0,0,.08)' : ''), toggle: () => this.setState({ notify: Object.assign({}, N, { [r[0]]: !on }) }) }; });
    return { S, rows, perm: !!N.perm, notPerm: !N.perm, permText: N.perm ? 'Przeglądarka pozwoliła na powiadomienia' : 'Przeglądarka zapyta o zgodę', allow: () => this.setState({ notify: Object.assign({}, N, { perm: true }) }), revoke: () => this.setState({ notify: Object.assign({}, N, { perm: false }) }) };
  }
}
</script>
</body>
</html>
