<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Szybkie dodawanie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#171717}a:hover{color:#000000}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:.06em}
.card{border:1px solid #eaeaea;border-radius:8px;background:#ffffff}
.btn{background:#ffffff;color:#171717;border:1px solid #e0e0e0;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btnp{background:#171717;color:#ffffff;border:1px solid #171717;border-radius:6px;padding:7px 12px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btnd{background:#b91c1c;color:#ffffff;border:1px solid #b91c1c;border-radius:6px;padding:7px 12px;font:inherit;font-weight:500;cursor:pointer}
.inp{background:#ffffff;border:1px solid #e0e0e0;border-radius:6px;padding:8px 10px;font:inherit;color:#171717;width:100%;box-sizing:border-box}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.hint{font-size:12px;color:#6b6b6b;font-weight:400}
.th{text-align:left;padding:10px 14px;border-bottom:1px solid #eaeaea;font-weight:500;color:#666666;white-space:nowrap}
.td{padding:11px 14px;border-bottom:1px solid #f0f0f0}
.seg{display:flex;border:1px solid #e0e0e0;border-radius:6px;overflow:hidden;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #e0e0e0;border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;background:#ffffff;color:#404040;cursor:pointer}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;border-radius:6px;background:transparent;font:inherit;font-size:13px;color:#171717;cursor:pointer;text-align:left}
.kbd{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;border:1px solid #e0e0e0;border-radius:4px;padding:0 5px;color:#404040;background:#ffffff}

</style>
</helmet>
<div style="min-height: 900px; position: relative; display: flex; flex-wrap: wrap; background: #ffffff; color: #171717; font-family: 'Geist', system-ui, sans-serif; font-size: 14px">
  <div style="flex: 1 1 232px; max-width: 100%; background: #fafafa; border-right: 1px solid #eaeaea"><dc-import name="Sidebar" active="dzis" min-height="900" hint-size="100%,900px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px; border-bottom: 1px solid #eaeaea; min-height: 34px">
      <div class="mono" style="font-size: 13px; color: #666666"><span>Moduły</span> <span style="color: #b0b0b0">/</span> <span style="color: #171717">Dziś</span></div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center"></div>
    </header>
    <div aria-hidden="true" style="padding: 28px 24px; opacity: .5">
      <div style="font-size: 24px; font-weight: 600">Dziś</div><div style="margin-top: 24px; height: 150px; border: 1px solid #eaeaea; border-radius: 8px; background: #fafafa"></div><div style="margin-top: 24px; height: 560px; border: 1px solid #eaeaea; border-radius: 8px; background: #fafafa"></div>
    </div>
  </main>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.25)"></div>
  <div role="dialog" aria-modal="true" aria-label="Szybkie dodawanie" style="position: absolute; left: 50%; top: 110px; transform: translateX(-50%); width: min(620px, calc(100% - 32px)); background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; box-shadow: 0 16px 48px rgba(0,0,0,.16); overflow: hidden">
    <label style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #eaeaea">
      <span class="mono" style="font-size: 16px; color: #15803d">+</span>
      <input type="text" value="bieg 10 km jutro 18:00" aria-label="Co dodać?" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 16px; color: #171717; background: none">
      <span class="kbd">Ctrl K</span>
    </label>
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div class="lbl">Rozumiem to tak</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #eaeaea; border: 1px solid #eaeaea; border-radius: 8px; overflow: hidden">
        <div style="background: #fff; padding: 10px 12px"><div class="lbl">Typ</div><div style="margin-top: 4px; font-weight: 500"><span class="mono" style="font-size: 10px; color: #fff; background: #c2410c; border-radius: 4px; padding: 1px 5px">BIEG</span></div></div>
        <div style="background: #fff; padding: 10px 12px"><div class="lbl">Dzień</div><div class="mono" style="margin-top: 4px">śr 18.11</div></div>
        <div style="background: #fff; padding: 10px 12px"><div class="lbl">Godzina</div><div class="mono" style="margin-top: 4px">18:00</div></div>
        <div style="background: #fff; padding: 10px 12px"><div class="lbl">Dystans</div><div class="mono" style="margin-top: 4px">10 km</div></div>
      </div>
      <p style="margin: 0; font-size: 13px; color: #666666">Zapiszemy jako zaplanowany bieg. Czas i tempo uzupełnisz po treningu.</p>
      <div class="lbl" style="margin-top: 4px">Przykłady</div>
      <div class="mono" style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px">
        <span class="chip">siłownia push pt 17:00</span><span class="chip">sen 23:40–7:10</span><span class="chip">blok nauka matma jutro 8–10</span><span class="chip">nawyk woda</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid #eaeaea; background: #fafafa">
      <button type="button" class="btn" style="font-size: 13px">Otwórz pełny formularz</button>
      <span style="flex: 1"></span><span class="mono" style="font-size: 11px; color: #6b6b6b"><span class="kbd">↵</span> zapisz</span>
      <button type="button" class="btnp">Zapisz bieg</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
