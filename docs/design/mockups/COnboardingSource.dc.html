<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#fafafa}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid rgba(0,0,0,.1);border-radius:12px;background:#fff;background-clip:padding-box;box-shadow:0 1px 2px rgba(0,0,0,.05);font:inherit;color:#262626;cursor:pointer;box-sizing:border-box;transition:border-color .15s,background-color .15s,box-shadow .15s}

    <svg width="24" height="24" viewBox="0 0 48 48" role="img" aria-label="rhytm" style="flex: none"><rect x="4" y="4" width="11" height="11" rx="3" fill="#262626"></rect><rect x="18" y="4" width="11" height="11" rx="3" fill="#262626" opacity="0.55"></rect><rect x="32" y="4" width="11" height="11" rx="3" fill="#262626" opacity="0.25"></rect><rect x="4" y="18" width="11" height="11" rx="3" fill="#262626" opacity="0.55"></rect><rect x="18" y="18" width="11" height="11" rx="3" fill="#262626" opacity="0.25"></rect><rect x="32" y="18" width="11" height="11" rx="3" fill="#15803d"></rect><rect x="4" y="32" width="11" height="11" rx="3" fill="#262626" opacity="0.25"></rect><rect x="18" y="32" width="11" height="11" rx="3" fill="#262626"></rect><rect x="32" y="32" width="11" height="11" rx="3" fill="#262626" opacity="0.55"></rect></svg><span style="font-weight: 600; font-size: 16px; letter-spacing: -0.03em">rhytm</span>

  </header>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 24px 40px">
    <div class="card" style="width: 100%; max-width: 1120px; height: 720px; overflow: hidden">
      <div role="progressbar" aria-label="Postęp" aria-valuemin="1" aria-valuemax="7" aria-valuenow="4" style="display: flex; gap: 4px; padding: 16px 20px 0"><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(0,0,0,.08)"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(0,0,0,.08)"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(0,0,0,.08)"></span></div>
      <div class="split" style="flex: 1; min-height: 0; display: grid; grid-template-columns: 520px 1fr">
        <div style="display: flex; flex-direction: column; min-height: 0">
          <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; padding: 32px 40px 20px">
            <div><h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em">Skąd o nas usłyszałeś?</h1><p class="muted" style="margin: 6px 0 0">Jedno pytanie, które mówi nam, gdzie warto o rhytm opowiadać. Możesz je pominąć</p></div>
            <div role="radiogroup" aria-label="Źródło" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">

              <button type="button" class="opt" role="radio" aria-checked="{{src_uni}}" aria-pressed="{{src_uni}}" onClick="{{pick_uni}}" style="align-items: center; height: 44px; padding: 0 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M2 9l10-5 10 5-10 5z"></path><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"></path></svg><span style="font-weight: 500">Na uczelni</span></button>
              <button type="button" class="opt" role="radio" aria-checked="{{src_tiktok}}" aria-pressed="{{src_tiktok}}" onClick="{{pick_tiktok}}" style="align-items: center; height: 44px; padding: 0 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M14 3v12a4 4 0 1 1-4-4"></path><path d="M14 3c0 3 2 5 5 5"></path></svg><span style="font-weight: 500">TikTok</span></button>
              <button type="button" class="opt" role="radio" aria-checked="{{src_insta}}" aria-pressed="{{src_insta}}" onClick="{{pick_insta}}" style="align-items: center; height: 44px; padding: 0 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.5"></circle></svg><span style="font-weight: 500">Instagram</span></button>
              <button type="button" class="opt" role="radio" aria-checked="{{src_yt}}" aria-pressed="{{src_yt}}" onClick="{{pick_yt}}" style="align-items: center; height: 44px; padding: 0 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="2" y="5" width="20" height="14" rx="4"></rect><path d="m10 9 5 3-5 3z"></path></svg><span style="font-weight: 500">YouTube</span></button>
              <button type="button" class="opt" role="radio" aria-checked="{{src_x}}" aria-pressed="{{src_x}}" onClick="{{pick_x}}" style="align-items: center; height: 44px; padding: 0 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 4l16 16M20 4 4 20"></path></svg><span style="font-weight: 500">X</span></button>
              <button type="button" class="opt" role="radio" aria-checked="{{src_reddit}}" aria-pressed="{{src_reddit}}" onClick="{{pick_reddit}}" style="align-items: center; height: 44px; padding: 0 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="14" r="7"></circle><circle cx="9.5" cy="13" r="0.8"></circle><circle cx="14.5" cy="13" r="0.8"></circle><path d="M9.5 16.5c1.5 1 3.5 1 5 0"></path><path d="M12 7l1-4 4 1"></path></svg><span style="font-weight: 500">Reddit</span></button>
              <button type="button" class="opt" role="radio" aria-checked="{{src_search}}" aria-pressed="{{src_search}}" onClick="{{pick_search}}" style="align-items: center; height: 44px; padding: 0 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span style="font-weight: 500">Wyszukiwarka</span></button>
              <button type="button" class="opt" role="radio" aria-checked="{{src_ai}}" aria-pressed="{{src_ai}}" onClick="{{pick_ai}}" style="align-items: center; height: 44px; padding: 0 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path><rect x="7" y="7" width="10" height="10" rx="2"></rect></svg><span style="font-weight: 500">ChatGPT lub inne AI</span></button>
              <button type="button" class="opt" role="radio" aria-checked="{{src_other}}" aria-pressed="{{src_other}}" onClick="{{pick_other}}" style="align-items: center; height: 44px; padding: 0 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg><span style="font-weight: 500">Inne</span></button>
            </div>
            <sc-if value="{{isOther}}" hint-placeholder-val="{{false}}"><label class="fld">Gdzie dokładnie?<input class="inp" type="text" placeholder="np. podcast, newsletter" onChange="{{onOther}}"></label></sc-if>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; padding: 14px 40px; border-top: 1px solid rgba(0,0,0,.08); background: rgba(0,0,0,.02)">
            <a class="btng" href="COnboardingGoals.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Wstecz</a>
            <span style="flex: 1"></span>
            <a class="btng" href="COnboardingPages.dc.html">Pomiń</a>
            <a class="btnp" href="COnboardingPages.dc.html">Dalej<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
          </div>
        </div>
        <div class="pvside" style="position: relative; border-left: 1px solid rgba(0,0,0,.08); overflow: hidden"><dc-import name="COnbPreview" s="{{S}}" step="4" hint-size="100%,680px"></dc-import></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { src: 'uni' }; }
  renderVals() {
    const D = { name: 'Mejson', tz: 'Europe/Warsaw', week: 'pn', clock: '24', roles: { student: true, sport: true }, field: 'Cyberbezpieczeństwo', goals: { plan: true, sport: true, habits: true, subs: true, proj: true }, pages: { Subscriptions: true, Projects: true }, notify: { perm: true, before: true, renew: true, weekly: true, habits: false } };
    const S = Object.assign({}, D, this.state || {});
    const v = (e) => (e && e.target ? e.target.value : e);
    const keys = ["friend", "uni", "tiktok", "insta", "yt", "x", "reddit", "search", "ai", "other"];
    const out = { S, isOther: S.src === 'other', onOther: (e) => this.setState({ srcOther: v(e) }) };
    keys.forEach((k) => { out['src_' + k] = S.src === k ? 'true' : 'false'; out['pick_' + k] = () => this.setState({ src: S.src === k ? null : k }); });
    return out;
  }
}
</script>
