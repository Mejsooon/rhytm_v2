<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon — Szczegóły ćwiczenia (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#fafafa}
/* CM-BASE — wspólne dodatki mobilne COSS. Ten blok ma być IDENTYCZNY w każdym pliku CM*.
   Wszystko inne bierzemy z arkusza coss/coss.css (klasy .btn/.btnp/.btng/.btns/.btnd/.btndo,
   .inp/.igroup/.dd, .fld/.lbl/.hint/.err, .cbx/.sw/input[type=checkbox|radio], .seg/.tabs/.chip/.dot, .bdg.*,
   .card/.card-h/.card-t/.card-d/.card-p/.foot, .frame>.inner, .sep, .pop/.mi/.mi-sep/.mi-lbl, .backdrop, .dlg*,
   .toast, .alert.*, .kbd, .prog, .avatar, .empty/.empty-ic, .num, .muted, .h-title). */

/* Ekran telefonu */
html body .m-screen{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:var(--foreground);font-size:14px}
html body .m-status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600}
html body .m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);background:#fff}
html body .m-title{margin:0;font-size:18px;font-weight:600;letter-spacing:-.011em}
html body .m-body{padding:16px}

/* Cele dotykowe ≥44 px na telefonie (nadpisują rozmiary webowe arkusza) */
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo){height:44px}
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo).ic{width:44px}
html body .m-screen :is(.inp,.dd,.igroup){height:44px;font-size:16px}
html body .m-screen textarea.inp{height:auto}
html body .m-screen .seg :is(a,button){height:40px}
html body .m-screen .chip{height:36px}
html body .m-screen .mi{min-height:44px}
html body .m-hit{position:relative}
html body .m-hit::before{content:"";position:absolute;inset:-14px}

/* Wiersz listy (ustawienia, strony, wyniki wyszukiwania) */
html body .m-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
html body .m-row:last-child{border-bottom:0}

/* Arkusz od dołu = .dlg przyklejony do dołu */
html body .m-sheet{position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;max-height:88%;overflow:auto}
html body .m-grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:8px auto 0}

/* Krok +/− */
html body .m-step{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:var(--radius);box-shadow:var(--shadow-xs5);overflow:hidden}
html body .m-step button{width:44px;height:44px;border:0;background:#fff;font:inherit;font-size:18px;cursor:pointer}
html body .m-step span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}

/* Przycisk pływający (FAB) — nad paskiem zakładek */
html body .m-fab{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:16px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px -4px rgba(38,38,38,.32);cursor:pointer}
html body button.m-row.row-btn{width:100%;border:0;background:none;font:inherit;text-align:left;cursor:pointer}
</style>
</helmet>
<div class="m-screen" style="display:flex;flex-direction:column">
  <div class="m-status"><span>9:41</span><span></span></div>
  <header class="m-head" style="padding:0 8px"><a href="CMGym.dc.html" class="btng ic" aria-label="Wstecz"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a><h1 class="m-title" style="flex:1;text-align:center;font-size:16px">Wyciskanie na ławce</h1><span style="width:44px"></span></header>
  <div style="flex:1;overflow-y:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px">
    <section class="card">
      <div class="card-p" style="display:flex;flex-direction:column;gap:4px"><span class="lbl">Szacowany 1RM</span><div style="display:flex;align-items:baseline;gap:10px"><span class="num" style="font-size:30px;font-weight:600">82,5 kg</span><span class="bdg ok num">+10,5 kg · 8 tyg.</span></div></div>
      <div class="seg" role="group" aria-label="Metryka" style="display:flex;margin:0 14px 10px"><sc-for list="{{metrics}}" as="m" hint-placeholder-count="2"><button type="button" style="flex:1" aria-pressed="{{m.p}}" onClick="{{m.pick}}">{{m.t}}</button></sc-for></div>
      <div role="img" aria-label="1RM rośnie z 72 do 82,5 kg w 8 tygodni" style="display:grid;grid-template-columns:repeat(8, minmax(0, 1fr));gap:6px;align-items:end;height:120px;padding:0 14px 6px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="8"><span style="{{b.s}}"></span></sc-for></div>
      <div class="num muted" style="display:flex;justify-content:space-between;font-size:11px;padding:0 14px 12px"><span>tydz. 39</span><span>tydz. 46</span></div>
    </section>
    <section class="card">
      <div class="card-h"><h2 class="card-t">Rekordy</h2></div>
      <div style="padding:4px 0">
        <div class="m-row"><span class="muted" style="flex:1">Najcięższa seria</span><span class="num" style="font-weight:500">70 kg × 3</span></div>
        <div class="m-row"><span class="muted" style="flex:1">Najwięcej powt.</span><span class="num" style="font-weight:500">60 kg × 10</span></div>
        <div class="m-row"><span class="muted" style="flex:1">Najlepsza seria (szac. 1RM)</span><span class="num" style="font-weight:500">70 kg × 5 <span class="bdg ok">REKORD</span></span></div>
      </div>
    </section>
    <section class="card">
      <div class="card-h"><h2 class="card-t">Historia</h2><p class="card-d">w szablonie „Push”</p></div>
      <div style="padding:4px 0"><sc-for list="{{hist}}" as="h" hint-placeholder-count="4"><div class="m-row" style="min-height:56px"><span style="flex:1;min-width:0"><span class="num" style="display:block;font-weight:500">{{h.d}}</span><span class="hint num">{{h.sets}}</span></span><span class="num muted" style="font-size:13px">{{h.rm}}</span></div></sc-for></div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const met = S.met || '1RM';
    const RM = [72, 73.5, 75, 76, 77.5, 79, 80.5, 82.5], VOL = [1440, 1500, 1560, 1520, 1620, 1700, 1740, 1810];
    const data = met === '1RM' ? RM : VOL, mn = Math.min.apply(null, data) * 0.9, mx = Math.max.apply(null, data);
    return {
      metrics: [['1RM', 'Szac. 1RM'], ['vol', 'Objętość']].map((m) => ({ t: m[1], p: m[0] === met ? 'true' : 'false', pick: () => this.setState({ met: m[0] }) })),
      bars: data.map((v, i) => ({ s: 'display:block;border-radius:4px 4px 0 0;background:' + (i === data.length - 1 ? 'var(--primary)' : 'rgba(0,0,0,.14)') + ';height:' + Math.round((v - mn) / (mx - mn) * 100) + '%' })),
      hist: [['czw 12.11', '60×8 · 60×8 · 62,5×6', '82,5 kg'], ['pn 09.11', '60×8 · 60×7 · 60×7', '80,5 kg'], ['czw 05.11', '57,5×8 · 60×6 · 60×6', '79,0 kg'], ['pn 02.11', '57,5×8 · 57,5×8 · 57,5×7', '77,5 kg']].map((h) => ({ d: h[0], sets: h[1], rm: h[2] }))
    };
  }
}
</script>
</body>
</html>
