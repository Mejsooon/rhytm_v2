<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon — Kalendarz, dzień</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#171717;text-decoration:none}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.lbl{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:.06em}
.top{display:flex;align-items:center;gap:4px;padding:8px;min-height:60px;box-sizing:border-box;flex:none}
.ib{width:44px;height:44px;border:0;background:none;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#171717;flex:none;padding:0}
.ib:hover{background:#f5f5f5}
.body{flex:1;overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:16px}
.h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0}
.h2{font-size:17px;font-weight:600;margin:0}
.sub{font-size:13px;color:#666666}
.card{border:1px solid #eaeaea;border-radius:12px;background:#ffffff}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-bottom:1px solid #f0f0f0;box-sizing:border-box}
.row:last-child{border-bottom:0}
a.row:hover{background:#fafafa}
.btnp{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:10px;background:#171717;color:#ffffff;border:1px solid #171717;font:inherit;font-weight:500;cursor:pointer;width:100%;box-sizing:border-box}
a.btnp,a.btnp:hover{color:#ffffff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:10px;background:#ffffff;color:#171717;border:1px solid #e0e0e0;font:inherit;font-weight:500;cursor:pointer;width:100%;box-sizing:border-box}
.btn:hover{background:#fafafa}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:#f2f2f2;border-radius:10px;padding:3px;gap:3px}
.sg{height:34px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:13px;color:#555555;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sg.on,.sg[aria-pressed="true"]{background:#ffffff;color:#171717;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.inp{height:48px;border:1px solid #e0e0e0;border-radius:10px;padding:0 14px;font:inherit;font-size:15px;font-weight:400;width:100%;box-sizing:border-box;background:#ffffff;color:#171717;outline:none}
.inp:focus{border-color:#171717}
.inp::placeholder{color:#a3a3a3}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid #e0e0e0;border-radius:999px;background:#ffffff;font:inherit;font-size:14px;color:#171717;cursor:pointer}
.chip.on,.chip[aria-pressed="true"]{background:#171717;border-color:#171717;color:#ffffff}
.fab{position:absolute;right:16px;bottom:100px;width:56px;height:56px;border-radius:16px;background:#171717;color:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.18);z-index:5}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:8}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:#ffffff;border-radius:18px 18px 0 0;display:flex;flex-direction:column;max-height:92%;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.grab{width:36px;height:5px;border-radius:3px;background:#d4d4d4;margin:8px auto 2px;flex:none}
.cb{width:24px;height:24px;flex:0 0 24px;border-radius:7px;border:1.5px solid #cfcfcf;background:#ffffff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:#ffffff}
.cb[aria-checked="true"]{background:#15803d;border-color:#15803d}
.sw{width:50px;height:30px;flex:0 0 50px;border-radius:15px;border:0;background:#d9d9d9;position:relative;cursor:pointer;padding:0;transition:background 160ms ease}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#ffffff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform 160ms ease}
.sw[aria-checked="true"]{background:#15803d}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.badge{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;border-radius:5px;padding:2px 7px;white-space:nowrap}
.stat{display:block;background:#ffffff;padding:12px 14px;color:#171717}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:#eaeaea;border:1px solid #eaeaea;border-radius:12px;overflow:hidden}
.num{font-family:'Geist Mono',ui-monospace,monospace;font-size:22px;font-weight:500;margin-top:4px}
.chev{color:#a3a3a3;margin-left:auto;flex:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #ffffff; color: #171717; font-family: 'Geist', system-ui, sans-serif; font-size: 15px">

  <header class="top" style="padding: 8px 8px 4px 16px"><div style="flex: 1"><div class="lbl">2026 · tydzień 46</div><h1 class="h1" style="margin-top: 2px">Listopad</h1></div><a href="MSearch.dc.html" class="ib" aria-label="Szukaj"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a href="MBlockSheet.dc.html" class="ib" aria-label="Nowy blok"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a></header>
  <nav class="seg" aria-label="Widok kalendarza" style="margin: 0 16px 8px; flex: none"><a href="MCalendarDay.dc.html" class="sg on" aria-current="page">Dzień</a><a href="MCalendarWeek.dc.html" class="sg">Tydzień</a><a href="MCalendarMonth.dc.html" class="sg">Miesiąc</a></nav>
  <div role="group" aria-label="Dzień tygodnia" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 4px 12px 10px; border-bottom: 1px solid #eaeaea; flex: none">
    <sc-for list="{{week}}" as="d" hint-placeholder-count="7"><button type="button" aria-pressed="{{d.p}}" aria-label="{{d.label}}" onClick="{{d.pick}}" style="{{d.s}}"><span style="font-size: 11px; opacity: .75">{{d.wd}}</span><span class="mono" style="font-size: 16px; font-weight: 500">{{d.n}}</span><span style="{{d.dot}}"></span></button></sc-for>
  </div>
  <div class="body" style="padding: 14px 16px 100px; gap: 0">
    <div class="sub" style="padding: 0 0 10px 48px">{{dayTitle}} · {{count}}</div>
    <div style="position: relative">
      <div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">07:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div><div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">08:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div><div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">09:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div><div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">10:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div><div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">11:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div><div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">12:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div><div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">13:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div><div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">14:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div><div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">15:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div><div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">16:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div><div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">17:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div><div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">18:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div><div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">19:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div><div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">20:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div><div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">21:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div><div style="height: 56px; display: flex; align-items: flex-start; gap: 8px"><span class="mono" style="width: 40px; font-size: 11px; color: #8a8a8a; transform: translateY(-7px); text-align: right">22:00</span><span style="flex: 1; border-top: 1px solid #f0f0f0"></span></div>
      <a href="MBlockSheet.dc.html" aria-label="Dodaj blok w wolnym miejscu" style="position: absolute; left: 48px; right: 0; top: 0; bottom: 0"></a>
      <sc-for list="{{blocks}}" as="b" hint-placeholder-count="4"><a href="MBlockSheet.dc.html" style="{{b.s}}"><span style="font-weight: 600; font-size: 14px; color: #171717">{{b.t}}</span><span class="mono" style="font-size: 11px; color: #555555">{{b.time}}</span></a></sc-for>
      <sc-if value="{{isToday}}" hint-placeholder-val="{{true}}"><div aria-hidden="true" style="position: absolute; left: 42px; right: 0; top: 257px; height: 2px; background: #b91c1c; z-index: 3"><span style="position: absolute; left: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #b91c1c"></span></div></sc-if>
    </div>
  </div>
  <a href="MBlockSheet.dc.html" class="fab" aria-label="Nowy blok"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
  <dc-import name="MTabBar" active="cal" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const CAT = { own: ['#15803d', '#f0faf4', 'Własne'], uni: ['#0070f3', '#eef5ff', 'Studia'], sport: ['#c2410c', '#fff4ed', 'Sport'], work: ['#7c3aed', '#f5f3ff', 'Praca'], life: ['#525252', '#f5f5f5', 'Dom'] };
    const DAYS = {
      9: [[7, 0.5, 'Poranna rutyna', 'life'], [10, 2, 'Systemy operacyjne — wykład', 'uni'], [14, 1.5, 'Strona Fanaberia', 'work'], [18, 1, 'Siłownia — Push', 'sport']],
      10: [[8, 1.5, 'Bazy danych — lab', 'uni'], [12, 2, 'rhytm — kod', 'own'], [17, 1, 'Bieg 6 km', 'sport']],
      11: [[9, 3, 'Strona Fanaberia', 'work'], [15, 1.5, 'C# — ćwiczenia', 'uni'], [19, 1, 'Angielski', 'life']],
      12: [[7, 0.5, 'Poranna rutyna', 'life'], [10, 2, 'rhytm — kod', 'own'], [18, 1.5, 'Siłownia — Pull', 'sport']],
      13: [[10, 1.5, 'Wstęp do cyberbezpieczeństwa', 'uni'], [13, 2, 'NetScope — research', 'own'], [17, 1, 'Bieg interwały', 'sport']],
      14: [[9, 1, 'Zakupy', 'life'], [11, 3, 'Strona Fanaberia — klient', 'work'], [16, 2, 'Długi bieg 14 km', 'sport']],
      15: [[8, 0.5, 'Poranna rutyna', 'life'], [10.5, 2, 'rhytm — kod', 'own'], [16, 1, 'Bieg 10 km', 'sport'], [19, 1, 'Bazy danych — projekt', 'uni']]
    };
    const sel = (this.state && this.state.d) || 15;
    const WD = ['pn', 'wt', 'śr', 'cz', 'pt', 'sb', 'nd'];
    const FULL = ['Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek', 'Sobota', 'Niedziela'];
    const fmt = (h) => String(Math.floor(h)).padStart(2, '0') + ':' + (h % 1 ? '30' : '00');
    const list = DAYS[sel] || [];
    return {
      week: [9, 10, 11, 12, 13, 14, 15].map((n, i) => ({
        n, wd: WD[i], p: n === sel ? 'true' : 'false', label: FULL[i] + ' ' + n + ' listopada', pick: () => this.setState({ d: n }),
        s: 'display:flex;flex-direction:column;align-items:center;gap:2px;height:62px;border:0;border-radius:12px;cursor:pointer;font:inherit;padding:6px 0;' + (n === sel ? 'background:#171717;color:#ffffff' : n === 15 ? 'background:#f5f5f5;color:#171717' : 'background:transparent;color:#171717'),
        dot: 'width:4px;height:4px;border-radius:50%;background:' + (n === sel ? '#ffffff' : (DAYS[n] || []).length ? '#15803d' : 'transparent')
      })),
      dayTitle: FULL[[9, 10, 11, 12, 13, 14, 15].indexOf(sel)] + ', ' + sel + ' listopada',
      count: list.length + (list.length === 1 ? ' blok' : list.length < 5 ? ' bloki' : ' bloków'),
      isToday: sel === 15,
      blocks: list.map((b) => {
        const c = CAT[b[3]];
        return { t: b[2], time: fmt(b[0]) + '–' + fmt(b[0] + b[1]) + ' · ' + c[2],
          s: 'position:absolute;left:52px;right:4px;top:' + ((b[0] - 7) * 56 + 1) + 'px;height:' + (b[1] * 56 - 4) + 'px;box-sizing:border-box;border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px;overflow:hidden;z-index:2;background:' + c[1] + ';border-left:3px solid ' + c[0] };
      })
    };
  }
}
</script>
</body>
</html>
