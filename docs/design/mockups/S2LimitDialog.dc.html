<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Limit planu Free</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#ffffff}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none;color:#262626}
.av.lg{width:44px;height:44px;font-size:15px}
.av.sm{width:22px;height:22px;font-size:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;font-size:12px;color:#686868;padding:10px 12px;border-bottom:1px solid rgba(0,0,0,.08);white-space:nowrap}
.tbl td{padding:0 12px;height:52px;border-bottom:1px solid rgba(0,0,0,.06);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:rgba(0,0,0,.02)}
.tabs{display:flex;gap:20px;border-bottom:1px solid rgba(0,0,0,.08)}
.tabs a,.tabs button{height:40px;display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;font:inherit;font-weight:500;color:#686868;text-decoration:none;cursor:pointer;box-shadow:inset 0 -2px 0 transparent;white-space:nowrap}
.tabs [aria-current="page"],.tabs [aria-selected="true"]{color:#262626;box-shadow:inset 0 -2px 0 #262626}
.pbar{height:6px;border-radius:999px;background:rgba(0,0,0,.06);overflow:hidden;min-width:60px}
.pbar>span{display:block;height:100%;border-radius:999px;background:#262626}
.nw{white-space:nowrap}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.aic{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.row{display:flex;align-items:center;gap:12px}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid rgba(0,0,0,.06);text-decoration:none;color:inherit}
.lrow:first-child{border-top:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{border:1px solid rgba(0,0,0,.08);border-radius:12px;background:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi b{font-size:24px;font-weight:600;letter-spacing:-.02em}
.ch{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;min-height:52px;box-sizing:border-box}
.ch .card-t{margin:0}
.ch .card-d{margin:2px 0 0}
.coach-b{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:#f0fdf4;color:#15803d;font-size:11px;font-weight:600;white-space:nowrap}

</style>
</helmet>
<div style="display: contents" onClick="{{navRoute}}">
<div style="position: relative; height: 900px; overflow: hidden; font-family: 'Inter', system-ui, sans-serif">
  <div style="position: absolute; inset: 0; pointer-events: none" aria-hidden="true"><dc-import name="S2WorkoutTemplates" hint-size="100%,900px"></dc-import></div>
  <a href="S2WorkoutTemplates.dc.html" class="backdrop" aria-label="Zamknij" style="z-index: 40"></a>
  <div role="dialog" aria-modal="true" aria-labelledby="lim-t" class="dlg" style="position: absolute; z-index: 50; left: 50%; top: 120px; transform: translateX(-50%); width: 480px">
    <div class="dlg-h"><div><h2 class="dlg-t" id="lim-t">{{t}}</h2><p class="dlg-d">{{d}}</p></div><a href="S2WorkoutTemplates.dc.html" class="btng ic sm" aria-label="Zamknij"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></a></div>
    <div class="dlg-b" style="display: flex; flex-direction: column; gap: 12px">
      <div class="seg" role="group" aria-label="Który limit" style="align-self: flex-start"><sc-for list="{{kinds}}" as="k" hint-placeholder-count="3"><button type="button" aria-pressed="{{k.p}}" onClick="{{k.pick}}">{{k.t}}</button></sc-for></div>
      <div class="frame"><div class="inner" style="padding: 4px 0">
        <div class="row" style="padding: 8px 14px; font-size: 12px; color: #686868"><span style="flex: 1"></span><span style="width: 90px; text-align: right">Free</span><span style="width: 90px; text-align: right">Pro</span></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="3"><div class="row" style="{{r.s}}"><span style="flex: 1">{{r.n}}</span><span class="num" style="width: 90px; text-align: right">{{r.f}}</span><span class="num" style="width: 90px; text-align: right; font-weight: 500">{{r.p}}</span></div></sc-for>
      </div></div>
      <p class="hint" style="margin: 0">Możesz też usunąć albo zarchiwizować coś, czego nie używasz — wtedy zwolni się miejsce.</p>
    </div>
    <div class="dlg-f" style="justify-content: space-between"><a href="S2WorkoutTemplates.dc.html" class="btng">Nie teraz</a><a href="S2SettingsPlan.dc.html" class="btnp">Przejdź na Pro · [CENA] zł / mies.</a></div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 900}, "kind": {"editor": "enum", "options": ["tpl", "page", "habit"], "default": "tpl"}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const k = st.k || this.props.kind || 'tpl';
    const T = { tpl: ['Masz już 3 z 3 szablonów', 'Na planie Free możesz mieć 3 szablony treningów. Pro nie ma limitu.'], page: ['Masz już 5 z 5 stron', 'Na planie Free możesz mieć 5 stron. Pro nie ma limitu.'], habit: ['Masz już 10 z 10 nawyków', 'Na planie Free możesz śledzić 10 nawyków. Pro nie ma limitu.'] };
    const R = [['tpl', 'Szablony treningów', '3', 'bez limitu'], ['page', 'Strony', '5', 'bez limitu'], ['habit', 'Nawyki', '10', 'bez limitu'], ['x', 'Historia statystyk', '6 mies.', 'pełna'], ['y', 'Import z Garmin / Amazfit', '—', '✓']];
    return {
      t: T[k][0], d: T[k][1],
      kinds: [['tpl', 'Szablony'], ['page', 'Strony'], ['habit', 'Nawyki']].map((x) => ({ t: x[1], p: x[0] === k ? 'true' : 'false', pick: () => this.setState({ k: x[0] }) })),
      rows: R.map((r, i) => ({ n: r[1], f: r[2], p: r[3], s: 'gap:0;padding:9px 14px;border-top:1px solid rgba(0,0,0,.06);' + (r[0] === k ? 'background:#fff7ed;font-weight:500' : '') }))
    };
  }
}
// W interaktywnym pulpicie trenera linki przełączają widok zamiast skakać do innej makiety.
(() => {
  const rv = Component.prototype.renderVals;
  Component.prototype.renderVals = function () {
    const o = rv.call(this) || {};
    const nav = this.props.onNav;
    o.onNav = typeof nav === 'function' ? nav : null;
    o.navRoute = (e) => {
      if (typeof nav !== 'function' || e.defaultPrevented) return;
      let a = e.target;
      while (a && a.tagName !== 'A') a = a.parentElement;
      if (!a || !a.getAttribute('href')) return;
      if (a.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
      const name = a.getAttribute('href').split('/').pop().replace('.dc.html', '');
      if (nav(name)) { e.preventDefault(); e.stopPropagation(); }
    };
    return o;
  };
})();
</script>
</body>
</html>
