<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon — Wpis snu (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
/* CM-BASE — wspólne dodatki mobilne COSS. Ten blok ma być IDENTYCZNY w każdym pliku CM*.
   Wszystko inne bierzemy z arkusza coss/coss.css (klasy .btn/.btnp/.btng/.btns/.btnd/.btndo,
   .inp/.igroup/.dd, .fld/.lbl/.hint/.err, .cbx/.sw/input[type=checkbox|radio], .seg/.tabs/.chip/.dot, .bdg.*,
   .card/.card-h/.card-t/.card-d/.card-p/.foot, .frame>.inner, .sep, .pop/.mi/.mi-sep/.mi-lbl, .backdrop, .dlg*,
   .toast, .alert.*, .kbd, .prog, .avatar, .empty/.empty-ic, .num, .muted, .h-title). */

/* Ekran telefonu */
html body .m-screen{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:var(--foreground);font-size:14px}
html body .m-status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600}
html body .m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);background:#fff}
html body .m-title{margin:0;font-size:18px;font-weight:600;letter-spacing:-.011em}
html body .m-body{padding:16px}

/* Cele dotykowe ≥44 px na telefonie (nadpisują rozmiary webowe arkusza) */
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo){height:44px}
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo).ic{width:44px}
html body .m-screen :is(.inp,.dd,.igroup){height:44px;font-size:16px}
html body .m-screen textarea.inp{height:auto}
html body .m-screen .seg :is(a,button){height:40px}
html body .m-screen .chip{height:36px}
html body .m-screen .mi{min-height:44px}
html body .m-hit{position:relative}
html body .m-hit::before{content:"";position:absolute;inset:-14px}

/* Wiersz listy (ustawienia, strony, wyniki wyszukiwania) */
html body .m-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
html body .m-row:last-child{border-bottom:0}

/* Arkusz od dołu = .dlg przyklejony do dołu */
html body .m-sheet{position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;max-height:88%;overflow:auto}
html body .m-grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:8px auto 0}

/* Krok +/− */
html body .m-step{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:var(--radius);box-shadow:var(--shadow-xs5);overflow:hidden}
html body .m-step button{width:44px;height:44px;padding:0;border:0;background:#fff;font:inherit;font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer;color:var(--foreground)}
html body .m-step span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}

/* Przycisk pływający (FAB) — nad paskiem zakładek */
html body .m-fab{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:16px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px -4px rgba(38,38,38,.32);cursor:pointer}

body{margin:0;background:#ffffff}
html body .quality-opt{height:60px;border-radius:12px;border:1px solid var(--input);background:#fff;box-shadow:var(--shadow-xs5);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;color:var(--foreground)}
html body .quality-opt[aria-pressed="true"]{border-color:rgba(21,128,61,.4);background:rgba(21,128,61,.08);color:var(--success-foreground);box-shadow:none}
</style>
</helmet>
<div class="m-screen" style="display: flex; flex-direction: column">

  <header class="m-head" style="flex: none; padding: 0 8px"><a href="CMHabits.dc.html" class="btng" style="color: var(--muted-foreground)">Anuluj</a><h1 class="m-title" style="flex: 1; text-align: center; font-size: 16px">Wpis snu</h1><a href="CMHabits.dc.html" class="btnp">Zapisz</a></header>
  <div style="flex: 1; overflow-y: auto; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 20px">
    <div style="text-align: center"><div class="lbl">Noc 14 → 15 listopada</div><div class="num" style="font-size: 48px; font-weight: 600; letter-spacing: -.02em; margin-top: 6px">{{dur}}</div><div class="hint" style="font-size: 13px">{{verdict}}</div></div>
    <div class="card">
      <div class="m-row"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg><span style="flex: 1">Zasnąłem</span><span class="m-step"><button type="button" aria-label="Wcześniej" onClick="{{aM}}">−</button><span>{{a}}</span><button type="button" aria-label="Później" onClick="{{aP}}">+</button></span></div>
      <div class="m-row"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg><span style="flex: 1">Wstałem</span><span class="m-step"><button type="button" aria-label="Wcześniej" onClick="{{bM}}">−</button><span>{{b}}</span><button type="button" aria-label="Później" onClick="{{bP}}">+</button></span></div>
    </div>
    <div class="fld"><span class="lbl">Jak się wyspałeś?</span><div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px"><sc-for list="{{q}}" as="x" hint-placeholder-count="5"><button type="button" class="quality-opt" aria-pressed="{{x.p}}" aria-label="{{x.label}}" onClick="{{x.pick}}"><span class="num" style="font-size: 18px; font-weight: 600">{{x.n}}</span><span style="font-size: 11px">{{x.t}}</span></button></sc-for></div></div>
    <div class="fld"><span class="lbl">Co mogło wpłynąć</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{tags}}" as="t" hint-placeholder-count="5"><button type="button" class="chip m-hit" aria-pressed="{{t.p}}" onClick="{{t.pick}}">{{t.t}}</button></sc-for></div></div>
    <label class="fld">Notatka<textarea class="inp" rows="3" placeholder="Opcjonalnie" style="resize: none"></textarea></label>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const a = S.a ?? (23 * 60 + 45), b = S.b ?? (7 * 60);
    const hm = (m) => { const x = ((m % 1440) + 1440) % 1440; return String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0'); };
    const d = ((b - a) % 1440 + 1440) % 1440;
    const q = S.q || 4, tags = S.tags || ['Trening'];
    const Q = ['Źle', 'Słabo', 'OK', 'Dobrze', 'Super'];
    return {
      a: hm(a), b: hm(b), dur: Math.floor(d / 60) + ':' + String(d % 60).padStart(2, '0'),
      verdict: d >= 450 ? 'Powyżej celu 7:30' : 'Brakuje ' + (450 - d) + ' min do celu 7:30',
      aM: () => this.setState({ a: a - 15 }), aP: () => this.setState({ a: a + 15 }), bM: () => this.setState({ b: b - 15 }), bP: () => this.setState({ b: b + 15 }),
      q: Q.map((t, i) => ({ n: i + 1, t, label: 'Jakość ' + (i + 1) + ' — ' + t, p: q === i + 1 ? 'true' : 'false', pick: () => this.setState({ q: i + 1 }) })),
      tags: ['Kawa po 16', 'Ekran w łóżku', 'Trening', 'Alkohol', 'Stres'].map((t) => { const on = tags.indexOf(t) >= 0; return { t, p: on ? 'true' : 'false', pick: () => this.setState({ tags: on ? tags.filter((x) => x !== t) : tags.concat([t]) }) }; })
    };
  }
}
</script>
</body>
</html>
