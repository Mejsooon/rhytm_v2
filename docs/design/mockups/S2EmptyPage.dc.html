<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Pusta strona</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#ffffff}
.ttl{width:100%;border:0;outline:none;background:transparent;font:inherit;font-size:32px;font-weight:600;letter-spacing:-.02em;color:#262626;padding:0}
.ttl::placeholder{color:#d4d4d4}
.blk{position:relative;display:flex;align-items:flex-start;gap:6px;margin:0 -36px;padding:2px 0 2px 36px;border-radius:8px}
.blk .bact{position:absolute;left:4px;top:4px;opacity:0}
.blk:hover .bact,.blk .bact:focus-visible{opacity:1}
.bin{flex:1;border:0;outline:none;background:transparent;font:inherit;color:#262626;padding:4px 0;min-width:0}
.bin::placeholder{color:#c4c4c4}
.bin.h{font-size:22px;font-weight:600;letter-spacing:-.01em}
.bin.p{font-size:15px;line-height:1.6}
.cmd{width:100%;border:0;outline:none;background:transparent;font:inherit;font-size:15px;color:#262626;padding:6px 0}
.cmd::placeholder{color:#b4b4b4}
.slash{position:absolute;left:0;top:calc(100% + 4px);width:320px;padding:4px;z-index:20;display:flex;flex-direction:column}
.sitem{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:14px;color:#262626;text-align:left;cursor:pointer}
.sitem[aria-selected="true"]{background:rgba(0,0,0,.05)}
.sic{width:30px;height:30px;border-radius:8px;border:1px solid rgba(0,0,0,.1);background:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;color:#404040;flex:none}
.qchip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(0,0,0,.12);background:#fff;font:inherit;font-size:14px;font-weight:500;color:#262626;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.qchip:hover{background:#fafafa}
.todo input{width:16px;height:16px;margin:8px 2px 0 0;accent-color:#262626}
</style>
</helmet>
<div class="shell" style="min-height: 1000px; font-family: 'Inter', system-ui, sans-serif">
  <div class="sb-col"><dc-import name="S2Sidebar" active="empty" min-height="1000" hint-size="100%,1000px"></dc-import></div>
  <main class="main" style="position: relative">
    <header class="topbar">
      <div class="crumb">Strony<span aria-hidden="true">/</span><b>{{crumb}}</b></div>
      <a href="S2NewPage.dc.html" class="btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>Szablony</a>
    </header>

    <div style="padding: 48px 24px 64px 72px; max-width: 1080px; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 6px">
      <div style="position: relative; display: flex; align-items: center; gap: 8px; margin-bottom: 8px">
        <sc-if value="{{hasIcon}}" hint-placeholder-val="{{false}}"><button type="button" class="btng" aria-label="Zmień ikonę strony" onClick="{{toggleIcons}}" style="width: 44px; height: 44px; padding: 0; display: grid; place-items: center"><dc-import name="S2PageIcon" icon="{{icon}}" size="28" fallback="table" hint-size="28px,28px"></dc-import></button></sc-if>
        <sc-if value="{{noIcon}}" hint-placeholder-val="{{true}}"><button type="button" class="btng xs" onClick="{{toggleIcons}}" style="color: #686868"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"></path></svg>Dodaj ikonę</button></sc-if>
        <sc-if value="{{iconsOpen}}" hint-placeholder-val="{{false}}">
          <div class="pop" style="position: absolute; left: 0; top: calc(100% + 6px); width: 300px; padding: 8px; z-index: 30">
            <dc-import name="S2IconPicker" value="{{icon}}" on-pick="{{pickIcon}}" hint-size="100%,340px"></dc-import>
            <sc-if value="{{hasIcon}}" hint-placeholder-val="{{false}}"><button type="button" class="btng xs" onClick="{{removeIcon}}" style="margin-top: 6px; color: #686868">Usuń ikonę</button></sc-if>
          </div>
        </sc-if>
      </div>
      <input class="ttl" type="text" aria-label="Tytuł strony" placeholder="Bez tytułu" value="{{title}}" onChange="{{onTitle}}">

      <div style="display: flex; flex-direction: column; gap: 2px; margin-top: 16px">
        <sc-for list="{{blocks}}" as="b" hint-placeholder-count="0">
          <div class="blk">
            <button type="button" class="btng ic xs bact" aria-label="{{b.delLbl}}" title="Usuń blok" onClick="{{b.del}}" style="color: #a3a3a3"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
            <sc-if value="{{b.isH}}" hint-placeholder-val="{{false}}"><input class="bin h" type="text" aria-label="Nagłówek" placeholder="Nagłówek" value="{{b.text}}" onChange="{{b.onText}}"></sc-if>
            <sc-if value="{{b.isP}}" hint-placeholder-val="{{false}}"><input class="bin p" type="text" aria-label="Tekst" placeholder="Pisz…" value="{{b.text}}" onChange="{{b.onText}}"></sc-if>
            <sc-if value="{{b.isTodo}}" hint-placeholder-val="{{false}}"><label class="todo" style="display: flex; align-items: flex-start; gap: 8px; flex: 1"><input type="checkbox" checked="{{b.done}}" onChange="{{b.toggle}}" aria-label="Zrobione"><input class="bin p" type="text" aria-label="Zadanie" placeholder="Zadanie" value="{{b.text}}" onChange="{{b.onText}}" style="{{b.textS}}"></label></sc-if>
            <sc-if value="{{b.isDiv}}" hint-placeholder-val="{{false}}"><hr style="flex: 1; border: 0; border-top: 1px solid rgba(0,0,0,.12); margin: 14px 0"></sc-if>
            <sc-if value="{{b.isTable}}" hint-placeholder-val="{{false}}">
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px 0 12px">
                <input class="bin" type="text" aria-label="Nazwa tabeli" placeholder="Bez nazwy tabeli" value="{{b.text}}" onChange="{{b.onText}}" style="font-size: 16px; font-weight: 600; padding: 2px 0">
                <dc-import name="S2Table" kind="blank" embed="{{true}}" card-req="{{b.cardReq}}" hint-size="100%,260px"></dc-import>
              </div>
            </sc-if>
          </div>
        </sc-for>

        <div style="position: relative">
          <input class="cmd" type="text" aria-label="Nowy blok" placeholder="Wpisz „/”, aby wstawić blok — tabelę, listę, nagłówek…" value="{{cmd}}" onChange="{{onCmd}}" onKeyDown="{{onCmdKey}}" aria-expanded="{{slashOpen}}" aria-controls="slash-menu">
          <sc-if value="{{slashOn}}" hint-placeholder-val="{{false}}">
            <div id="slash-menu" role="listbox" aria-label="Bloki" class="pop slash">
              <div class="mi-lbl" style="padding: 6px 8px 4px">Bloki</div>
              <sc-for list="{{found}}" as="m" hint-placeholder-count="5">
                <button type="button" role="option" aria-selected="{{m.hi}}" class="sitem" onClick="{{m.pick}}" onMouseEnter="{{m.hover}}"><span class="sic">{{m.icon}}</span><span style="display: flex; flex-direction: column"><span style="font-weight: 500">{{m.label}}</span><span class="hint">{{m.desc}}</span></span></button>
              </sc-for>
              <sc-if value="{{noneFound}}" hint-placeholder-val="{{false}}"><div style="padding: 10px 8px; color: #686868">Brak bloku „{{q}}”</div></sc-if>
              <div class="mi-sep"></div>
              <div class="hint" style="display: flex; gap: 12px; padding: 4px 8px 6px; font-size: 12px"><span><span class="kbd">↑</span> <span class="kbd">↓</span> wybór</span><span><span class="kbd">Enter</span> wstaw</span><span><span class="kbd">Esc</span> zamknij</span></div>
            </div>
          </sc-if>
        </div>

        <sc-if value="{{isEmpty}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 20px">
            <span class="hint">albo zacznij od:</span>
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{quick}}" as="qk" hint-placeholder-count="4"><button type="button" class="qchip" onClick="{{qk.pick}}"><span class="sic" style="width: 22px; height: 22px; font-size: 11px; border-radius: 6px">{{qk.icon}}</span>{{qk.label}}</button></sc-for>
            </div>
            <div style="margin-top: 16px; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1px dashed rgba(0,0,0,.16); border-radius: 12px; max-width: 560px">
              <span style="flex: 1"><b style="font-weight: 500; display: block">Wolisz gotowca?</b><span class="hint">Subskrypcje, Książki, Projekty albo Strony WWW z gotową tabelą i widokami.</span></span>
              <a href="S2NewPage.dc.html" class="btn xs" style="text-decoration: none">Użyj szablonu →</a>
            </div>
          </div>
        </sc-if>
      </div>
    </div>

    <sc-if value="{{toastOn}}" hint-placeholder-val="{{false}}">
      <div role="status" class="toast" style="position: absolute; right: 24px; bottom: 24px; z-index: 30"><span>{{toastTxt}}</span><button type="button" class="btn xs" onClick="{{undo}}">Cofnij</button></div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const B = S.blocks || [];
    const cmd = S.cmd || '';
    const title = S.title || '';
    const DEFS = [
      { k: 'table', icon: '▦', label: 'Tabela', desc: 'Wiersze i kolumny z typami pól', kw: 'tabela table baza' },
      { k: 'todo', icon: '✓', label: 'Lista zadań', desc: 'Punkty do odhaczenia', kw: 'lista zadania todo checkbox' },
      { k: 'h', icon: 'H', label: 'Nagłówek', desc: 'Tytuł sekcji', kw: 'naglowek nagłówek heading tytul' },
      { k: 'p', icon: '¶', label: 'Tekst', desc: 'Zwykły akapit', kw: 'tekst text akapit' },
      { k: 'div', icon: '—', label: 'Separator', desc: 'Pozioma linia', kw: 'separator linia divider' },
      { k: 'card', icon: 'Σ', label: 'Karta podsumowania', desc: 'Suma, średnia lub liczba z kolumny tabeli', kw: 'karta podsumowanie statystyka suma srednia średnia liczba card stat' }
    ];
    const q = cmd.charAt(0) === '/' ? cmd.slice(1).trim().toLowerCase() : null;
    const found = q === null ? [] : DEFS.filter((d) => !q || (d.label.toLowerCase() + ' ' + d.kw).includes(q));
    const hi = Math.min(S.hi || 0, Math.max(0, found.length - 1));
    const nid = () => 'b' + Date.now() + Math.floor(Math.random() * 1000);
    const insert = (k, text) => {
      if (k === 'card') {
        const req = nid();
        const t = B.filter((b) => b.k === 'table').pop();
        if (t) this.setState({ blocks: B.map((b) => b.id === t.id ? Object.assign({}, b, { cardReq: req }) : b), cmd: '', hi: 0, toast: { txt: 'Karta trafi nad tabelę „' + (t.text || 'Bez nazwy tabeli') + '”', prev: B } });
        else this.setState({ blocks: B.concat([{ id: nid(), k: 'table', text: '', done: false, cardReq: req }]), cmd: '', hi: 0, toast: { txt: 'Karta liczy z tabeli — dodałem pustą tabelę', prev: B } });
        return;
      }
      this.setState({ blocks: B.concat([{ id: nid(), k, text: text || '', done: false }]), cmd: '', hi: 0 });
    };
    const upd = (id, o) => this.setState({ blocks: B.map((b) => b.id === id ? Object.assign({}, b, o) : b) });
    const icon = S.icon || null;
    return {
      crumb: title.trim() || 'Bez tytułu',
      title, onTitle: (e) => this.setState({ title: e.target.value }),
      icon, hasIcon: !!icon, noIcon: !icon, iconsOpen: !!S.icons,
      toggleIcons: () => this.setState({ icons: !S.icons }),
      pickIcon: (v) => this.setState({ icon: v, icons: false }),
      removeIcon: () => this.setState({ icon: null, icons: false }),
      blocks: B.map((b) => ({
        text: b.text, done: b.done, cardReq: b.cardReq || '',
        isH: b.k === 'h', isP: b.k === 'p', isTodo: b.k === 'todo', isDiv: b.k === 'div', isTable: b.k === 'table',
        textS: b.done ? 'color:#a3a3a3;text-decoration:line-through' : '',
        onText: (e) => upd(b.id, { text: e.target.value }),
        toggle: () => upd(b.id, { done: !b.done }),
        delLbl: 'Usuń blok: ' + (DEFS.find((d) => d.k === b.k) || {}).label,
        del: () => this.setState({ blocks: B.filter((x) => x.id !== b.id), toast: { txt: 'Usunięto blok', prev: B } })
      })),
      cmd, q: q || '',
      slashOn: q !== null, slashOpen: q !== null ? 'true' : 'false', noneFound: q !== null && found.length === 0,
      found: found.map((d, i) => ({ icon: d.icon, label: d.label, desc: d.k === 'card' && !B.some((b) => b.k === 'table') ? 'Doda też tabelę, z której karta liczy' : d.desc, hi: i === hi ? 'true' : 'false', pick: () => insert(d.k), hover: () => { if (S.hi !== i) this.setState({ hi: i }); } })),
      onCmd: (e) => this.setState({ cmd: e.target.value, hi: 0 }),
      onCmdKey: (e) => {
        if (q !== null) {
          if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ hi: Math.min(found.length - 1, hi + 1) }); }
          if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ hi: Math.max(0, hi - 1) }); }
          if (e.key === 'Enter' && found[hi]) { e.preventDefault(); insert(found[hi].k); }
          if (e.key === 'Escape') this.setState({ cmd: '' });
        } else if (e.key === 'Enter' && cmd.trim()) {
          insert('p', cmd.trim());
        }
      },
      isEmpty: B.length === 0,
      quick: [DEFS[0], DEFS[1], DEFS[2], DEFS[3]].map((d) => ({ icon: d.icon, label: d.label, pick: () => insert(d.k) })),
      toastOn: !!S.toast, toastTxt: S.toast ? S.toast.txt : '',
      undo: () => this.setState({ blocks: S.toast.prev, toast: null })
    };
  }
}
</script>
</body>
</html>
