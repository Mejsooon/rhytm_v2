<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon — Archiwum nawyków (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
/* CM-BASE — wspólne dodatki mobilne COSS. Ten blok ma być IDENTYCZNY w każdym pliku CM*.
   Wszystko inne bierzemy z arkusza coss/coss.css (klasy .btn/.btnp/.btng/.btns/.btnd/.btndo,
   .inp/.igroup/.dd, .fld/.lbl/.hint/.err, .cbx/.sw/input[type=checkbox|radio], .seg/.tabs/.chip/.dot, .bdg.*,
   .card/.card-h/.card-t/.card-d/.card-p/.foot, .frame>.inner, .sep, .pop/.mi/.mi-sep/.mi-lbl, .backdrop, .dlg*,
   .toast, .alert.*, .kbd, .prog, .avatar, .empty/.empty-ic, .num, .muted, .h-title). */

/* Ekran telefonu */
html body .m-screen{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:var(--foreground);font-size:14px}
html body .m-status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600}
html body .m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);background:#fff}
html body .m-title{margin:0;font-size:18px;font-weight:600;letter-spacing:-.011em}
html body .m-body{padding:16px}

/* Cele dotykowe ≥44 px na telefonie (nadpisują rozmiary webowe arkusza) */
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo){height:44px}
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo).ic{width:44px}
html body .m-screen :is(.inp,.dd,.igroup){height:44px;font-size:16px}
html body .m-screen textarea.inp{height:auto}
html body .m-screen .seg :is(a,button){height:40px}
html body .m-screen .chip{height:36px}
html body .m-screen .mi{min-height:44px}
html body .m-hit{position:relative}
html body .m-hit::before{content:"";position:absolute;inset:-14px}

/* Wiersz listy (ustawienia, strony, wyniki wyszukiwania) */
html body .m-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
html body .m-row:last-child{border-bottom:0}

/* Arkusz od dołu = .dlg przyklejony do dołu */
html body .m-sheet{position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;max-height:88%;overflow:auto}
html body .m-grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:8px auto 0}

/* Krok +/− */
html body .m-step{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:var(--radius);box-shadow:var(--shadow-xs5);overflow:hidden}
html body .m-step button{width:44px;height:44px;padding:0;border:0;background:#fff;font:inherit;font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer;color:var(--foreground)}
html body .m-step span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}

/* Przycisk pływający (FAB) — nad paskiem zakładek */
html body .m-fab{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:16px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px -4px rgba(38,38,38,.32);cursor:pointer}

body{margin:0;background:#ffffff}
</style>
</helmet>
<div class="m-screen" style="display: flex; flex-direction: column">
  <div class="m-status"><span>9:41</span><span></span></div>
  <header class="m-head" style="flex: none; padding: 0 8px"><a href="CMHabits.dc.html" class="btng ic" aria-label="Wstecz"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><h1 class="m-title" style="flex: 1; text-align: center">Archiwum</h1><span style="width: 44px"></span></header>
  <div style="flex: 1; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <p class="muted" style="margin: 0; line-height: 1.5">Nie liczą się do limitu i nie przypominają. Historia zostaje — po przywróceniu seria liczy się dalej.</p>
    <div class="card" style="padding: 4px 0">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3"><div class="m-row" style="min-height: 72px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px"><span style="flex: 1 1 100%; min-width: 0"><span style="display: block; font-weight: 500">{{r.n}}</span><span class="hint num">{{r.d}}</span></span><span style="display: flex; gap: 8px; width: 100%; margin-top: 8px"><button type="button" class="btn" style="flex: 1" onClick="{{r.restore}}">Przywróć</button><button type="button" class="btndo" style="flex: 1" onClick="{{r.ask}}">Usuń na zawsze</button></span></div></sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div class="hint" style="padding: 32px; text-align: center">Archiwum jest puste.</div></sc-if>
    </div>
  </div>
  <sc-if value="{{toastOn}}" hint-placeholder-val="{{false}}"><div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; gap: 12px; align-items: center; padding: 8px 8px 8px 14px; border-radius: 12px; background: #262626; color: #fff; font-size: 13px"><span style="flex: 1">{{toast}}</span><button type="button" class="btng" style="color: #fff; height: 36px" onClick="{{undo}}">Cofnij</button></div></sc-if>
  <sc-if value="{{askOn}}" hint-placeholder-val="{{false}}"><div class="backdrop" style="position: absolute" onClick="{{noAsk}}"></div><div role="alertdialog" aria-label="Usuń na zawsze" class="dlg m-sheet"><div class="m-grab"></div><div style="padding: 16px"><h2 class="m-title" style="font-size: 18px">Usunąć „{{askN}}” na zawsze?</h2><p class="muted" style="margin: 6px 0 16px; line-height: 1.5">Zniknie razem z całą historią odhaczeń. Tego nie da się cofnąć.</p><div style="display: flex; flex-direction: column; gap: 8px"><button type="button" class="btnd" style="width: 100%" onClick="{{doDel}}">Usuń na zawsze</button><button type="button" class="btng" style="width: 100%; justify-content: center" onClick="{{noAsk}}">Anuluj</button></div></div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const H = [['med', 'Medytacja 10 min', 'zarchiwizowany 02.11 · najdłuższa seria 21 dni'], ['ang', 'Angielski 15 min', 'zarchiwizowany 18.10 · najdłuższa seria 9 dni'], ['zim', 'Zimny prysznic', 'zarchiwizowany 01.09 · najdłuższa seria 14 dni']];
    const gone = st.gone || {};
    const left = H.filter((h) => !gone[h[0]]);
    const ask = H.find((h) => h[0] === st.ask);
    return {
      rows: left.map((h) => ({ n: h[1], d: h[2], restore: () => this.setState({ gone: Object.assign({}, gone, { [h[0]]: 1 }), last: h[0], toast: 'Przywrócono „' + h[1] + '”' }), ask: () => this.setState({ ask: h[0] }) })),
      empty: !left.length, toastOn: !!st.toast, toast: st.toast || '',
      undo: () => { const g = Object.assign({}, gone); delete g[st.last]; this.setState({ gone: g, toast: '' }); },
      askOn: !!ask, askN: ask ? ask[1] : '', noAsk: () => this.setState({ ask: null }),
      doDel: () => this.setState({ gone: Object.assign({}, gone, { [st.ask]: 1 }), last: st.ask, ask: null, toast: 'Usunięto na zawsze' })
    };
  }
}
</script>
</body>
</html>
