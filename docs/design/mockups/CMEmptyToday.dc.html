<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon — Dziś, nowe konto (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#fafafa}
/* CM-BASE — wspólne dodatki mobilne COSS. Ten blok ma być IDENTYCZNY w każdym pliku CM*.
   Wszystko inne bierzemy z arkusza coss/coss.css (klasy .btn/.btnp/.btng/.btns/.btnd/.btndo,
   .inp/.igroup/.dd, .fld/.lbl/.hint/.err, .cbx/.sw/input[type=checkbox|radio], .seg/.tabs/.chip/.dot, .bdg.*,
   .card/.card-h/.card-t/.card-d/.card-p/.foot, .frame>.inner, .sep, .pop/.mi/.mi-sep/.mi-lbl, .backdrop, .dlg*,
   .toast, .alert.*, .kbd, .prog, .avatar, .empty/.empty-ic, .num, .muted, .h-title). */

/* Ekran telefonu */
html body .m-screen{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:var(--foreground);font-size:14px}
html body .m-status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600}
html body .m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);background:#fff}
html body .m-title{margin:0;font-size:18px;font-weight:600;letter-spacing:-.011em}
html body .m-body{padding:16px}

/* Cele dotykowe ≥44 px na telefonie (nadpisują rozmiary webowe arkusza) */
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo){height:44px}
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo).ic{width:44px}
html body .m-screen :is(.inp,.dd,.igroup){height:44px;font-size:16px}
html body .m-screen textarea.inp{height:auto}
html body .m-screen .seg :is(a,button){height:40px}
html body .m-screen .chip{height:36px}
html body .m-screen .mi{min-height:44px}
html body .m-hit{position:relative}
html body .m-hit::before{content:"";position:absolute;inset:-14px}

/* Wiersz listy (ustawienia, strony, wyniki wyszukiwania) */
html body .m-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
html body .m-row:last-child{border-bottom:0}

/* Arkusz od dołu = .dlg przyklejony do dołu */
html body .m-sheet{position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;max-height:88%;overflow:auto}
html body .m-grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:8px auto 0}

/* Krok +/− */
html body .m-step{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:var(--radius);box-shadow:var(--shadow-xs5);overflow:hidden}
html body .m-step button{width:44px;height:44px;padding:0;border:0;background:#fff;font:inherit;font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer;color:var(--foreground)}
html body .m-step span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}

/* Przycisk pływający (FAB) — nad paskiem zakładek */
html body .m-fab{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:16px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px -4px rgba(38,38,38,.32);cursor:pointer}
html body .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-xs5)}
html body .stat{display:block;background:#fff;padding:12px 14px;color:var(--foreground);text-decoration:none;min-height:44px;box-sizing:border-box}
html body .stat:hover{background:#fafafa}
html body .stat-v{font-size:22px;font-weight:600;margin-top:4px}
html body .stat-v span{font-size:14px;font-weight:400}
html body .sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
html body .sec-h .card-t{margin:0}
html body .plan-block{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 12px;border-radius:12px;box-sizing:border-box;color:inherit;text-decoration:none}
.bar{height:8px;border-radius:999px;background:rgba(0,0,0,.06);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;background:#262626}
.wrow{display:flex;flex-direction:column;gap:6px;padding:10px 0}
.wrow+.wrow{border-top:1px solid rgba(0,0,0,.06)}
.htile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px 14px;min-height:72px;border-radius:12px;border:1px solid rgba(0,0,0,.1);background:#fff;font:inherit;font-size:14px;color:#262626;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.04);box-sizing:border-box}
.hcbx{width:18px;height:18px;border-radius:6px;border:1.5px solid rgba(0,0,0,.3);display:grid;place-items:center;box-sizing:border-box;flex:none}
.hr-row{display:grid;grid-template-columns:48px 1fr;min-height:48px;border-top:1px solid rgba(0,0,0,.06)}
.blk{border-radius:8px;padding:8px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin:4px 0;color:inherit;text-decoration:none;min-height:44px;box-sizing:border-box}
.gap{display:grid;grid-template-columns:48px 1fr;align-items:center;min-height:30px;border-top:1px solid rgba(0,0,0,.06)}.gap:first-child{border-top:0}.gap-big{min-height:72px;align-items:stretch}.gap-big>span:first-child{padding-top:8px}.gap-big>span:last-child{align-self:center}
.gap>span:last-child{display:flex;align-items:center;gap:8px;color:#686868;font-size:12px}
.gap>span:last-child::before,.gap>span:last-child::after{content:"";flex:1;border-top:1px dashed rgba(0,0,0,.14)}
</style>
</helmet>
<div class="m-screen" style="background:#fafafa">
  <div class="m-status"><span>9:41</span><span></span></div>
  <header class="m-head" style="background:transparent;border-bottom:0;padding-top:4px">
    <div style="flex:1;min-width:0"><div class="hint num">Niedziela · 15 listopada</div><h1 class="m-title">Dziś</h1></div>
    <a href="CMSearch.dc.html" class="btng ic" aria-label="Szukaj"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a>
    <a href="CMSettings.dc.html" class="btng ic" aria-label="Konto i ustawienia"><span class="avatar">M</span></a>
  </header>
  <div class="scroll" style="height:696px;overflow-y:auto;padding:12px 16px 120px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box">
    <section aria-labelledby="week-title" style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:baseline;justify-content:space-between"><h2 id="week-title" class="card-t">Ten tydzień</h2><span class="hint num">pn 16 – nd 22.11</span></div>
      <div class="card" style="padding:4px 16px">
        <sc-for list="{{week}}" as="w" hint-placeholder-count="4"><div class="wrow">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px"><span style="font-weight:500">{{w.label}}</span><span class="num"><b style="font-size:16px;font-weight:600">{{w.value}}</b> <span class="hint">{{w.unit}}</span></span></div>
          <div class="bar"><span style="{{w.barS}}"></span></div>
          <span class="hint num" style="font-size:12px">{{w.right}}</span>
        </div></sc-for>
      </div>
    </section>

    <section aria-labelledby="hab-title" style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:baseline;justify-content:space-between"><h2 id="hab-title" class="card-t">Nawyki na dziś</h2><span class="hint num">0 / 0</span></div>
      <a href="CMHabitNew.dc.html" class="btn" style="width:100%;height:56px;border-style:dashed;box-shadow:none;color:var(--muted-foreground)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Utwórz nowy nawyk</a>
    </section>

    <section aria-labelledby="plan-title" style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:baseline;justify-content:space-between"><h2 id="plan-title" class="card-t">Plan dnia</h2><span class="hint num">00:00–24:00 · 0 bloków</span></div>
      <div class="card"><div class="empty" style="padding:28px 16px"><span class="empty-ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></span><p class="muted" style="margin:0">Nie masz jeszcze bloków na dziś.</p><span class="hint num">00:00–24:00 · 24 h wolne</span><a href="CMBlockSheet.dc.html" class="btnp" style="margin-top:6px">Dodaj pierwszy blok</a></div></div>
    </section>
  </div>
  <a href="CMQuickAdd.dc.html" class="m-fab" aria-label="Szybko dodaj"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
  <div style="position:absolute;left:0;right:0;bottom:0"><dc-import name="CMTabBar" active="today" hint-size="390px,64px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const H = S.h || { w: true, r: true, e: false, m: false, s: false };
    // Nazwa, passa (liczba, jednostka): jak „Nawyki na dziś” na webie (S2Today).
    const HAB = [['w', 'Woda 2 l', 6, 'd'], ['r', 'Czytanie 20 min', 3, 'd'], ['e', 'Angielski', 2, 't'], ['m', 'Medytacja', 0, 'd'], ['s', 'Rozciąganie', 2, 'd']];
    const passa = (n, u) => n === 0 ? 'zacznij passę' : u === 't' ? n + ' tyg. z rzędu' : n === 1 ? '1 dzień z rzędu' : n + ' dni z rzędu';
    return {
      week: [
        { label: 'Treningi', value: '0', unit: '/ 4', barS: 'width:0%', right: 'jeszcze 4' },
        { label: 'Bieg', value: '0', unit: '/ 25 km', barS: 'width:0%', right: 'jeszcze 25 km' },
        { label: 'Nawyki', value: '—', unit: 'dni z celem', barS: 'width:0%', right: 'brak nawyków' },
        { label: 'Sen', value: '—', unit: '/ 8:00 śr.', barS: 'width:0%', right: 'brak wpisów' }
      ],
      habits: HAB.map((x) => {
        const on = !!H[x[0]];
        return { t: x[1], on: on ? 'true' : 'false', streak: passa(x[2], x[3]), hasStreak: x[2] > 0,
          streakC: x[2] >= 3 ? '#c2410c' : '#686868',
          tileS: on ? 'border-color:rgba(0,0,0,.24);background:rgba(0,0,0,.02)' : '',
          cbxS: on ? 'background:#262626;border-color:#262626;color:#fafafa' : 'color:transparent',
          toggle: () => this.setState({ h: Object.assign({}, H, { [x[0]]: !on }) }) };
      }),
      habDone: HAB.filter((x) => H[x[0]]).length, habAll: HAB.length
    };
  }
}
</script>
</body>
</html>
