<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Kalendarz — tydzień (pełne okno, jak Notion Calendar)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#171717}a:hover{color:#000000}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.btn{background:#ffffff;color:#171717;border:1px solid #e0e0e0;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer;text-decoration:none}
.btnp{background:#171717;color:#ffffff;border:1px solid #171717;border-radius:6px;padding:6px 12px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
a.btnp,a.btnp:hover{color:#ffffff}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #e0e0e0;border-radius:999px;padding:3px 9px;font:inherit;font-size:12px;background:#ffffff;color:#404040;cursor:pointer}
.sb-col{height:100vh;overflow-y:auto}
</style>
</helmet>
<div style="height: 100vh; min-height: 640px; display: flex; background: #ffffff; color: #171717; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; overflow: hidden">
  <div class="sb-col" style="flex: 0 0 232px; background: #fafafa; border-right: 1px solid #eaeaea"><dc-import name="Sidebar" active="kalendarz" min-height="900" hint-size="100%,900px"></dc-import></div>

  <main style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0">
    <!-- JEDEN cienki pasek: nawigacja, filtry kategorii, widok, nowy blok -->
    <header style="flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 16px; border-bottom: 1px solid #eaeaea">
      <div style="display: flex; align-items: center; gap: 6px">
        <button type="button" class="btn" aria-label="Poprzedni tydzień" style="padding: 5px 8px">‹</button>
        <button type="button" class="btn">Dziś</button>
        <button type="button" class="btn" aria-label="Następny tydzień" style="padding: 5px 8px">›</button>
        <h1 style="margin: 0 0 0 8px; font-size: 16px; font-weight: 600">Listopad 2026</h1>
        <span class="mono" style="font-size: 12px; color: #6b6b6b">tydz. 47</span>
      </div>
      <div style="margin-left: auto; display: flex; gap: 8px; align-items: center">
        <!-- filtry kategorii schowane w jednym przycisku z listą -->
        <div style="position: relative">
          <button type="button" class="btn" aria-expanded="{{catsOpen}}" aria-haspopup="true" onClick="{{toggleCats}}" style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px">
            <span aria-hidden="true" style="display: inline-flex"><sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><span style="{{d}}"></span></sc-for></span>
            Kategorie <span class="mono" style="font-size: 11px; color: #6b6b6b">{{catsCount}}</span> <span aria-hidden="true" style="color: #6b6b6b">▾</span>
          </button>
          <sc-if value="{{catsOpenB}}" hint-placeholder-val="{{false}}">
            <div role="menu" aria-label="Kategorie" style="position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; width: 220px; box-sizing: border-box; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.06); padding: 6px; display: flex; flex-direction: column; gap: 2px">
              <sc-for list="{{cats}}" as="c" hint-placeholder-count="6"><button type="button" role="menuitemcheckbox" aria-checked="{{c.pressed}}" onClick="{{c.toggle}}" style="display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; font: inherit; font-size: 13px; cursor: pointer; text-align: left; color: #171717"><span style="{{c.box}}">{{c.check}}</span><span style="{{c.dot}}"></span><span style="{{c.nameS}}">{{c.name}}</span></button></sc-for>
              <a href="CategoryDialog.dc.html" style="display: flex; align-items: center; min-height: 34px; padding: 0 8px; border-top: 1px solid #f0f0f0; margin-top: 4px; font-size: 13px; color: #666666; text-decoration: none">+ Kategoria</a>
            </div>
          </sc-if>
        </div>
        <div role="group" aria-label="Widok" style="display: flex; border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden; font-size: 13px">
          <a href="CalendarNotionDay.dc.html" style="background: #ffffff; color: #666666; padding: 5px 11px; text-decoration: none">Dzień</a>
          <span aria-current="page" style="background: #f0f0f0; color: #171717; border-left: 1px solid #e0e0e0; border-right: 1px solid #e0e0e0; padding: 5px 11px; font-weight: 500">Tydzień</span>
          <a href="CalendarMonth.dc.html" style="background: #ffffff; color: #666666; padding: 5px 11px; text-decoration: none">Miesiąc</a>
        </div>
        <a href="BlockDialog.dc.html" class="btnp">Nowy blok</a>
      </div>
    </header>

    <!-- SIATKA wypełnia resztę okna; przewija się tylko ona -->
    <div id="rh-siatka-tydzien" style="flex: 1 1 auto; min-height: 0; overflow: auto">
      <div style="min-width: 760px">
        <!-- nagłówek dni przyklejony u góry siatki -->
        <div style="position: sticky; top: 0; z-index: 4; background: #ffffff; border-bottom: 1px solid #eaeaea">
          <div style="display: grid; grid-template-columns: 56px repeat(7, minmax(0, 1fr))">
            <div></div>
            <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
              <div style="padding: 8px 10px 6px; border-left: 1px solid #eaeaea; display: flex; align-items: center; gap: 6px"><span class="mono" style="font-size: 11px; color: #6b6b6b; text-transform: uppercase">{{d.dow}}</span><span style="{{d.numS}}">{{d.num}}</span></div>
            </sc-for>
          </div>
          <div style="display: grid; grid-template-columns: 56px repeat(7, minmax(0, 1fr)); border-top: 1px solid #f0f0f0">
            <div class="mono" style="font-size: 10px; color: #6b6b6b; padding: 6px; text-align: right">cały<br>dzień</div>
            <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
              <div style="padding: 4px; border-left: 1px solid #eaeaea; min-height: 26px">
                <sc-if value="{{d.renewal}}" hint-placeholder-val="{{false}}">
                  <a href="CalendarRenewal.dc.html" class="mono" style="display: block; font-size: 11px; border: 1px dashed #a3a3a3; border-radius: 5px; padding: 3px 6px; color: #404040; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none">↻ {{d.renewal}}</a>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </div>
        <!-- doba 00–24, start przewinięty do 06:00 -->
        <div style="display: grid; grid-template-columns: 56px repeat(7, minmax(0, 1fr)); position: relative">
          <div>
            <sc-for list="{{hours}}" as="h" hint-placeholder-count="24">
              <div class="mono" style="height: 48px; box-sizing: border-box; font-size: 10px; color: #6b6b6b; padding: 0 8px; text-align: right; transform: translateY(-6px)">{{h}}</div>
            </sc-for>
          </div>
          <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
            <div style="{{d.colS}}">
              <sc-for list="{{d.blocks}}" as="b" hint-placeholder-count="1">
                <button type="button" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}" style="{{b.style}}">
                  <span style="display: block; line-height: 1.3; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.title}}</span>
                  <span class="mono" style="display: block; font-size: 10px; color: #404040; margin-top: 2px">{{b.time}} {{b.count}}</span>
                </button>
              </sc-for>
              <sc-if value="{{d.today}}" hint-placeholder-val="{{false}}"><div aria-hidden="true" style="{{nowLine}}"><span style="position: absolute; left: -5px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: #b91c1c"></span></div></sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'kod', hidden: { Dom: true } }; }
  componentDidMount() {
    // start widoku na 06:00, jak w aplikacji
    const el = document.getElementById('rh-siatka-tydzien');
    if (el) el.scrollTop = 6 * 48;
  }
  renderVals() {
    const CATDEF = [['Studia', '#0070f3'], ['Projekty', '#15803d'], ['Praca', '#7c3aed'], ['Sport', '#c2410c'], ['Subscriptions', ''], ['Dom', '#a16207']];
    const hidden = this.state.hidden;
    const cats = CATDEF.map((c) => {
      const on = !hidden[c[0]];
      return {
        name: c[0], pressed: on ? 'true' : 'false',
        toggle: () => this.setState({ hidden: Object.assign({}, hidden, { [c[0]]: on }) }),
        box: 'width:16px;height:16px;flex:none;box-sizing:border-box;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#ffffff;' + (on ? 'background:#171717;border:1px solid #171717' : 'background:#ffffff;border:1px solid #c4c4c4'),
        check: on ? '✓' : '',
        nameS: on ? '' : 'color:#6b6b6b',
        on,
        color: c[1],
        dot: c[1] ? 'width:8px;height:8px;border-radius:50%;box-sizing:border-box;' + (on ? 'background:' + c[1] : 'border:1.5px solid ' + c[1]) : 'width:10px;height:8px;border-radius:2px;box-sizing:border-box;border:1px dashed ' + (on ? '#404040' : '#a3a3a3')
      };
    });
    const H = 48;
    const fmt = (x) => String(Math.floor(x)).padStart(2, '0') + ':' + (x % 1 ? '30' : '00');
    const block = (id, start, end, title, cat, color, opts) => {
      const o = opts || {};
      const sel = this.state.sel === id;
      return {
        id, cat, title,
        time: fmt(start) + '–' + fmt(end),
        count: o.count ? '· ' + o.count : '',
        pressed: sel ? 'true' : 'false',
        pick: () => this.setState({ sel: sel ? null : id }),
        style: 'position:absolute;left:3px;right:3px;top:' + (start * H + 1) + 'px;height:' + ((end - start) * H - 3) + 'px;box-sizing:border-box;display:flex;flex-direction:column;align-items:stretch;text-align:left;font:inherit;cursor:pointer;border-radius:6px;padding:4px 7px;overflow:hidden;color:#171717;background:' + (o.planned ? '#ffffff' : color + '1f') + ';border:' + (o.planned ? '1px dashed ' + color : '0') + ';border-left:3px solid ' + color + (sel ? ';box-shadow:0 0 0 2px ' + color : '')
      };
    };
    const days = [
      { dow: 'pon', num: '16', renewal: '', blocks: [block('m1', 8, 10, 'Matematyka — ćwiczenia', 'Studia', '#0070f3', { count: '0/3' }), block('so', 13, 15, 'Systemy operacyjne', 'Studia', '#0070f3')] },
      { dow: 'wt', num: '17', today: true, renewal: '', blocks: [block('kod', 10, 12.5, 'rhytm — kod', 'Projekty', '#15803d', { count: '2/4' }), block('bieg', 16, 17, 'Bieg 10 km', 'Sport', '#c2410c')] },
      { dow: 'śr', num: '18', renewal: '', blocks: [block('kl1', 9, 11, 'Strona klienta', 'Praca', '#7c3aed', { count: '1/2' }), block('bd1', 18, 19.5, 'Bazy danych', 'Studia', '#0070f3')] },
      { dow: 'czw', num: '19', renewal: '', blocks: [block('bd2', 8, 9.5, 'Bazy danych', 'Studia', '#0070f3'), block('sil', 15, 16.5, 'Siłownia — push', 'Sport', '#c2410c')] },
      { dow: 'pt', num: '20', renewal: '', blocks: [block('ns', 10, 12, 'NetScope — research', 'Projekty', '#15803d', { count: '0/2' }), block('kl2', 14, 15, 'Strona klienta', 'Praca', '#7c3aed')] },
      { dow: 'sob', num: '21', renewal: 'Netflix · 43,00 zł', blocks: [block('lb', 10, 11.5, 'Długi bieg (plan)', 'Sport', '#c2410c', { planned: true })] },
      { dow: 'nd', num: '22', renewal: '', blocks: [block('plan', 18, 19, 'Plan tygodnia', 'Projekty', '#15803d')] }
    ];
    days.forEach((d) => {
      d.blocks = d.blocks.filter((b) => !hidden[b.cat]);
      if (hidden.Subscriptions) d.renewal = '';
      d.today = !!d.today;
      d.numS = d.today
        ? 'display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:12px;background:#15803d;color:#ffffff;font-weight:600;font-size:13px'
        : 'font-weight:500;font-size:13px';
      d.colS = 'position:relative;height:' + (24 * H) + 'px;border-left:1px solid #eaeaea;background-image:repeating-linear-gradient(to bottom,#f0f0f0 0,#f0f0f0 1px,transparent 1px,transparent ' + H + 'px)' + (d.today ? ';background-color:#fbfdfb' : '');
    });
    const now = 11 + 20 / 60;
    const visibleCats = cats.filter((c) => c.on);
    const open = !!this.state.catsOpen;
    return {
      cats,
      catsOpen: open ? 'true' : 'false',
      catsOpenB: open,
      toggleCats: () => this.setState({ catsOpen: !open }),
      catsCount: visibleCats.length + '/' + cats.length,
      dots: visibleCats.filter((c) => c.color).slice(0, 4).map((c, i) => 'width:9px;height:9px;border-radius:50%;border:1.5px solid #ffffff;background:' + c.color + (i ? ';margin-left:-4px' : '')),
      days,
      hours: Array.from({ length: 24 }, (_, i) => (i === 0 ? '' : String(i).padStart(2, '0') + ':00')),
      nowLine: 'position:absolute;left:0;right:0;top:' + Math.round(now * H) + 'px;border-top:2px solid #b91c1c;z-index:3;pointer-events:none'
    };
  }
}
</script>
</body>
</html>
