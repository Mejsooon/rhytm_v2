<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon — Nowa strona (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#fafafa}
/* CM-BASE — wspólne dodatki mobilne COSS. Ten blok ma być IDENTYCZNY w każdym pliku CM*.
   Wszystko inne bierzemy z arkusza coss/coss.css (klasy .btn/.btnp/.btng/.btns/.btnd/.btndo,
   .inp/.igroup/.dd, .fld/.lbl/.hint/.err, .cbx/.sw/input[type=checkbox|radio], .seg/.tabs/.chip/.dot, .bdg.*,
   .card/.card-h/.card-t/.card-d/.card-p/.foot, .frame>.inner, .sep, .pop/.mi/.mi-sep/.mi-lbl, .backdrop, .dlg*,
   .toast, .alert.*, .kbd, .prog, .avatar, .empty/.empty-ic, .num, .muted, .h-title). */

/* Ekran telefonu */
html body .m-screen{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:var(--foreground);font-size:14px}
html body .m-status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600}
html body .m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);background:#fff}
html body .m-title{margin:0;font-size:18px;font-weight:600;letter-spacing:-.011em}
html body .m-body{padding:16px}

/* Cele dotykowe ≥44 px na telefonie (nadpisują rozmiary webowe arkusza) */
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo){height:44px}
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo).ic{width:44px}
html body .m-screen :is(.inp,.dd,.igroup){height:44px;font-size:16px}
html body .m-screen textarea.inp{height:auto}
html body .m-screen .seg :is(a,button){height:40px}
html body .m-screen .chip{height:36px}
html body .m-screen .mi{min-height:44px}
html body .m-hit{position:relative}
html body .m-hit::before{content:"";position:absolute;inset:-14px}

/* Wiersz listy (ustawienia, strony, wyniki wyszukiwania) */
html body .m-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
html body .m-row:last-child{border-bottom:0}

/* Arkusz od dołu = .dlg przyklejony do dołu */
html body .m-sheet{position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;max-height:88%;overflow:auto}
html body .m-grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:8px auto 0}

/* Krok +/− */
html body .m-step{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:var(--radius);box-shadow:var(--shadow-xs5);overflow:hidden}
html body .m-step button{width:44px;height:44px;padding:0;border:0;background:#fff;font:inherit;font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer;color:var(--foreground)}
html body .m-step span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}

/* Przycisk pływający (FAB) — nad paskiem zakładek */
html body .m-fab{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:16px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px -4px rgba(38,38,38,.32);cursor:pointer}
html body button.m-row.row-btn{width:100%;border:0;background:none;font:inherit;text-align:left;cursor:pointer}
</style>
</helmet>
<div class="m-screen">
  <header class="m-head"><div style="flex:1"><div class="lbl">Twoje tabele i notatki</div><h1 class="m-title">Strony</h1></div></header>
  <div class="m-body" style="opacity:.45" aria-hidden="true"><div class="card" style="height:420px"></div></div>
  <a href="CMPages.dc.html" class="backdrop" aria-label="Zamknij"></a>
  <div class="dlg m-sheet" role="dialog" aria-label="Nowa strona" style="height:88%">
    <div class="m-grab" aria-hidden="true"></div>
    <div class="dlg-h" style="align-items:center;padding:4px 12px 8px;border-bottom:1px solid var(--border)"><a href="CMPages.dc.html" class="btng" style="color:var(--muted-foreground)">Anuluj</a><h2 class="dlg-t" style="flex:1;text-align:center">Nowa strona</h2><a href="CMEditor.dc.html" class="btnp">Utwórz</a></div>
    <div class="dlg-b" style="flex:1;overflow-y:auto;padding-top:16px;gap:16px">
      <label class="fld">Nazwa strony<input class="inp" type="text" value="{{name}}" onInput="{{setName}}" placeholder="Bez tytułu"></label>
      <div class="fld"><span class="lbl">Szablon</span><span class="hint" style="margin-top:-2px">Szablon wstawia zwykłą stronę z gotową tabelą i kartami. Wszystko zmienisz później.</span>
        <div class="card" style="margin-top:6px" role="radiogroup" aria-label="Szablon"><sc-for list="{{tpls}}" as="t" hint-placeholder-count="5"><button type="button" class="m-row row-btn" role="radio" aria-checked="{{t.p}}" onClick="{{t.pick}}" style="{{t.s}}"><span style="flex:1;min-width:0;padding:10px 0"><span style="display:block;font-weight:500">{{t.t}}</span><span class="hint">{{t.d}}</span></span><sc-if value="{{t.on}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></button></sc-for></div>
      </div>
      <div class="fld"><span class="lbl">Pola, które powstaną</span><div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{fields}}" as="f" hint-placeholder-count="4"><span class="bdg sec">{{f.t}}</span></sc-for></div><span class="hint">{{extra}}</span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const T = [['empty', 'Pusta strona', 'Bez tabeli. Tabelę, listę albo nagłówek wstawisz, wpisując „/”.', [], ''], ['subs', 'Subskrypcje', 'Twoje subskrypcje i ich odnowienia.', ['Nazwa', 'Kwota cykliczna', 'Data odnowienia', 'Kategoria', 'Aktywna'], 'Terminy trafią do kalendarza głównego. Karty: Σ miesięcznie, Σ rocznie, najbliższe odnowienie.'], ['proj', 'Projekty', 'Projekty na studia, własne i dla klientów.', ['Nazwa', 'Status', 'Termin', 'Repo', 'Obszar'], 'Terminy trafią do kalendarza głównego.'], ['books', 'Książki', 'Co czytam, co przeczytałem i co chcę przeczytać.', ['Tytuł', 'Autor', 'Status', 'Ocena', 'Przeczytana'], 'Karta: liczba przeczytanych w tym roku.'], ['web', 'Strony WWW', 'Strony klientów: URL, klient, status.', ['Nazwa', 'URL', 'Klient', 'Status', 'Hosting'], '']];
    const tp = S.tp || 'subs', cur = T.find((t) => t[0] === tp);
    return {
      name: S.name ?? cur[1], setName: (e) => this.setState({ name: e.target.value }),
      tpls: T.map((t) => ({ t: t[1], d: t[2], on: t[0] === tp, p: t[0] === tp ? 'true' : 'false', s: t[0] === tp ? 'background:rgba(0,0,0,.03)' : '', pick: () => this.setState({ tp: t[0], name: t[0] === 'empty' ? '' : t[1] }) })),
      fields: cur[3].length ? cur[3].map((f) => ({ t: f })) : [{ t: 'bez pól' }], extra: cur[4]
    };
  }
}
</script>
</body>
</html>
