<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Zmiana bloku cyklicznego (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#ffffff}

</style>
</helmet>
<div class="shell" style="min-height: 900px; position: relative; font-family: 'Inter', system-ui, sans-serif">
  <div class="sb-col"><dc-import name="S2Sidebar" active="kalendarz" min-height="900" hint-size="100%,900px"></dc-import></div>
  <main class="main">
    <header class="topbar">
      <h1 class="h-title">Kalendarz</h1>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center"><nav class="seg" aria-label="Widok"><a href="S2CalendarDay.dc.html">Dzień</a><a href="S2Calendar.dc.html" aria-current="page">Tydzień</a><a href="S2CalendarMonth.dc.html">Miesiąc</a></nav><a href="S2BlockDialog.dc.html" class="btnp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nowy blok</a></div>
    </header>
    <div aria-hidden="true" style="padding: 24px; opacity: .6">
      <div style="height: 32px; width: 520px; max-width: 100%; background: rgba(0,0,0,.04); border-radius: 10px"></div>
      <div style="margin-top: 16px; height: 640px; border: 1px solid rgba(0,0,0,.08); border-radius: 16px; display: grid; grid-template-columns: 56px repeat(7, minmax(0, 1fr)); background-image: repeating-linear-gradient(to bottom, #ffffff 0, #ffffff 47px, rgba(0,0,0,.05) 47px, rgba(0,0,0,.05) 48px)"><div></div><div style="border-left: 1px solid rgba(0,0,0,.06)"></div><div style="border-left: 1px solid rgba(0,0,0,.06)"></div><div style="border-left: 1px solid rgba(0,0,0,.06)"></div><div style="border-left: 1px solid rgba(0,0,0,.06)"></div><div style="border-left: 1px solid rgba(0,0,0,.06)"></div><div style="border-left: 1px solid rgba(0,0,0,.06)"></div><div style="border-left: 1px solid rgba(0,0,0,.06)"></div></div>
    </div>
  </main>
  <div aria-hidden="true" class="backdrop"></div>
  <div role="dialog" aria-modal="true" aria-labelledby="sc-t" class="dlg" style="position: absolute; left: 50%; top: 150px; transform: translateX(-50%); width: min(480px, calc(100% - 32px))">
    <div class="dlg-h"><div><h2 id="sc-t" class="dlg-t">Zmieniasz blok, który się powtarza</h2><p class="dlg-d">„rhytm — kod” · co tydzień we wtorki · przesunięcie na 11:00–13:30</p></div><a href="{{back}}" class="btng ic sm" aria-label="Zamknij"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a></div>
    <div class="dlg-b">
      <div role="radiogroup" aria-label="Zakres zmiany" style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><label style="{{o.s}}"><input type="radio" name="scope" checked="{{o.on}}" onChange="{{o.pick}}" style="margin-top: 2px"><span><span style="display: block; font-weight: 500">{{o.t}}</span><span class="hint" style="font-size: 13px">{{o.d}}</span></span></label></sc-for>
      </div>
      <div class="alert info" style="font-size: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #3b82f6; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg>Zadania z odhaczonych wystąpień nie przepadają.</div>
    </div>
    <div class="dlg-f"><a href="{{back}}" class="btng">Anuluj</a><a href="{{back}}" class="btnp">Zapisz zmianę</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { v: 'one' }; }
  renderVals() {
    const v = this.state.v;
    // powrót tylko do ekranów COSS (C…), nigdy do starego wyglądu
    let back = 'S2Calendar.dc.html';
    try { const f = sessionStorage.getItem('rh-from'); if (f && /^S2[A-Za-z]+\.dc\.html$/.test(f)) back = f; } catch (e) {}
    const o = [['one','Tylko to wystąpienie','wt 17.11 · 10:00–12:30. Inne tygodnie zostają bez zmian.'],['next','To i następne','Od 17.11 w przód. Wcześniejsze wystąpienia zostają.'],['all','Wszystkie wystąpienia','Zmieni całą serię, także przeszłe tygodnie.']];
    return { back, opts: o.map((x) => ({ t: x[1], d: x[2], on: v === x[0], pick: () => this.setState({ v: x[0] }),
      s: 'display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;cursor:pointer;background-clip:padding-box;' + (v === x[0] ? 'border:1px solid rgba(0,0,0,.24);background:rgba(0,0,0,.025);box-shadow:0 0 0 1px rgba(0,0,0,.12)' : 'border:1px solid rgba(0,0,0,.1);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)') })) };
  }
}
</script>
</body>
</html>
