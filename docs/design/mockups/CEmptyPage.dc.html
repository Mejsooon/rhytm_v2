<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Pusta strona (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#ffffff}
.ed-in{border:0;outline:none;font:inherit;color:#262626;background:transparent;width:100%;min-width:0;box-sizing:border-box;border-radius:6px}
.ed-in:focus{background:rgba(0,0,0,.02);box-shadow:0 0 0 2px rgba(38,38,38,.08)}
.epop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;font-weight:400;text-align:left;white-space:normal}
.trow{display:grid;align-items:center;border-bottom:1px solid rgba(0,0,0,.06)}
.trow.thead{background:rgba(0,0,0,.02);border-bottom:1px solid rgba(0,0,0,.08)}
.trow.tfoot{background:rgba(0,0,0,.02);border-bottom:0}
.trow:not(.thead):not(.tfoot):hover{background:rgba(0,0,0,.02)}
.gth{padding:8px 12px;font-size:14px;font-weight:500;color:#686868;white-space:nowrap}
.gtd{padding:8px 12px;min-height:22px}
.colbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;border-radius:6px;padding:3px 6px;margin:-3px -6px;font:inherit;font-weight:500;color:#686868;cursor:pointer;white-space:nowrap}
.colbtn:hover,.colbtn[aria-expanded="true"]{background:rgba(0,0,0,.05);color:#262626}
.addcol{width:100%;height:100%;min-height:38px;background:none;border:0;color:#a3a3a3;cursor:pointer;display:grid;place-items:center}
.addcol:hover{background:rgba(0,0,0,.04);color:#262626}
.cellbtn{background:none;border:0;padding:0;font:inherit;cursor:pointer;min-height:22px;display:inline-flex;align-items:center;color:#404040}
.cday{height:30px;padding:0;border:0;border-radius:8px;font:inherit;font-size:13px;cursor:pointer;background:transparent;color:#262626}
.cday:hover{background:rgba(0,0,0,.04)}
.ico{width:32px;height:32px;flex:0 0 32px;border:1px solid rgba(0,0,0,.08);border-radius:8px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#525252;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.blk{position:relative;padding-right:36px}
.blk-act{position:absolute;top:4px;right:0;opacity:0;transition:opacity 120ms ease;color:#b91c1c}
.blk:hover .blk-act,.blk-act:focus-visible{opacity:1}
.row-del{opacity:0;transition:opacity 120ms ease}
.trow:hover .row-del,.row-del:focus-visible{opacity:1}
button[aria-disabled="true"]{opacity:.4;pointer-events:none}
@media (max-width: 1100px){.tbl-wrap{overflow-x:auto}}
</style>
</helmet>
<div class="shell" style="min-height: 900px; font-family: 'Inter', system-ui, sans-serif">
  <div class="sb-col"><dc-import name="CSidebar" active="empty" min-height="900" hint-size="100%,900px"></dc-import></div>
  <main class="main">
    <header class="topbar">
      <nav class="crumb" aria-label="Okruszki"><span>Strony</span><span aria-hidden="true">/</span><b>{{crumb}}</b></nav>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center"><a href="CNewPage.dc.html" class="btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>Szablony</a></div>
    </header>
    <div style="padding: 28px 24px 160px; max-width: 1160px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px">
        <div style="position: relative; flex: none">
          <button type="button" aria-label="Zmień ikonę" aria-haspopup="dialog" aria-expanded="{{iconExp}}" onClick="{{toggleIcons}}" style="{{iconBtnS}}"><dc-import name="PageIcon" icon="{{pageIconVal}}" size="22" hint-size="22px,22px"></dc-import></button>
          <sc-if value="{{iconOpen}}" hint-placeholder-val="{{false}}">
            <button type="button" aria-label="Zamknij wybór ikony" tabindex="-1" onClick="{{toggleIcons}}" style="position: fixed; inset: 0; z-index: 25; border: 0; padding: 0; margin: 0; background: transparent; cursor: default"></button>
            <div class="pop" style="position: absolute; left: 0; top: calc(100% + 6px); z-index: 30; width: 300px; padding: 6px 10px 10px">
              <dc-import name="CIconPicker" value="{{pageIconVal}}" on-pick="{{pickIcon}}" hint-size="100%,340px"></dc-import>
            </div>
          </sc-if>
        </div>
        <input type="text" value="{{title}}" onChange="{{onTitle}}" placeholder="Bez tytułu" aria-label="Nazwa strony" style="border: 0; outline: none; font: inherit; font-size: 24px; font-weight: 600; letter-spacing: -.02em; color: #262626; flex: 1; min-width: 0; background: transparent">
      </div>

      <sc-for list="{{blocks}}" as="b" hint-placeholder-count="0">
        <div class="blk">
          <sc-if value="{{b.isH}}" hint-placeholder-val="{{false}}"><input type="text" class="ed-in" value="{{b.text}}" onChange="{{b.onText}}" placeholder="Nagłówek" aria-label="Nagłówek" style="font-size: 20px; font-weight: 600; letter-spacing: -.01em; padding: 6px 0"></sc-if>
          <sc-if value="{{b.isText}}" hint-placeholder-val="{{false}}"><input type="text" class="ed-in" value="{{b.text}}" onChange="{{b.onText}}" placeholder="Pusty akapit" aria-label="Akapit" style="line-height: 1.6; padding: 3px 0"></sc-if>
          <sc-if value="{{b.isTodo}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; gap: 10px; padding: 3px 0"><button type="button" class="cbx" role="checkbox" aria-checked="{{b.ac}}" aria-label="Zrobione" onClick="{{b.toggle}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button><input type="text" class="ed-in" value="{{b.text}}" onChange="{{b.onText}}" placeholder="Zadanie" aria-label="Zadanie" style="{{b.todoS}}"></div></sc-if>
          <sc-if value="{{b.isDiv}}" hint-placeholder-val="{{false}}"><div class="sep" style="margin: 12px 0"></div></sc-if>
          <sc-if value="{{b.isTable}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; gap: 8px; margin: 6px 0">
              <input type="text" class="ed-in" value="{{b.t.name}}" onChange="{{b.t.onName}}" placeholder="Tabela bez nazwy" aria-label="Nazwa tabeli" style="font-size: 16px; font-weight: 600">
              <div class="frame"><div class="inner tbl-wrap" style="font-size: 14px; overflow: visible">
                <div class="trow thead" role="row" style="{{b.t.gridS}}">
                  <sc-for list="{{b.t.cols}}" as="c" hint-placeholder-count="3"><div class="gth" role="columnheader"><span style="position: relative; display: inline-flex">
                    <button type="button" class="colbtn" onClick="{{c.toggle}}" aria-haspopup="dialog" aria-expanded="{{c.exp}}"><span style="color: #a3a3a3; font-size: 12px; font-weight: 600; min-width: 14px">{{c.icon}}</span>{{c.name}}</button>
                    <sc-if value="{{c.open}}" hint-placeholder-val="{{false}}"><div role="dialog" aria-label="Ustawienia kolumny" class="pop epop" style="width: 268px">
                      <div style="padding: 4px"><input type="text" class="inp" value="{{c.name}}" onChange="{{c.onName}}" placeholder="Nazwa kolumny" aria-label="Nazwa kolumny"></div>
                      <div class="mi-lbl">Typ pola</div>
                      <sc-for list="{{c.types}}" as="ty" hint-placeholder-count="6"><button type="button" class="mi" onClick="{{ty.pick}}" aria-pressed="{{ty.p}}" style="{{ty.s}}"><span style="width: 20px; text-align: center; color: #686868; font-size: 12px; font-weight: 600">{{ty.icon}}</span><span style="flex: 1">{{ty.label}}</span><sc-if value="{{ty.on}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></button></sc-for>
                      <sc-if value="{{c.isSel}}" hint-placeholder-val="{{false}}">
                        <div class="mi-lbl" style="padding-top: 10px">Opcje</div>
                        <div style="display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px"><sc-for list="{{c.opts}}" as="op" hint-placeholder-count="3"><span class="{{op.c}}">{{op.t}}<button type="button" aria-label="Usuń opcję" onClick="{{op.remove}}" style="background: none; border: 0; padding: 0 0 0 2px; cursor: pointer; color: inherit; font: inherit; opacity: .6">×</button></span></sc-for></div>
                        <div style="display: flex; gap: 6px; padding: 8px 8px 4px"><input type="text" class="inp" value="{{c.newOpt}}" onChange="{{c.onNewOpt}}" onKeyDown="{{c.optKey}}" placeholder="Nowa opcja…" aria-label="Nowa opcja" style="height: 32px"><button type="button" class="btn sm" onClick="{{c.addOpt}}">Dodaj</button></div>
                      </sc-if>
                      <div class="mi-sep"></div>
                      <div style="display: flex; justify-content: space-between; padding: 0 2px"><button type="button" class="btng xs" onClick="{{c.moveL}}" aria-disabled="{{c.firstD}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>W lewo</button><button type="button" class="btng xs" onClick="{{c.moveR}}" aria-disabled="{{c.lastD}}">W prawo<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button></div>
                      <div class="mi-sep"></div>
                      <button type="button" class="mi bad" onClick="{{c.remove}}" aria-disabled="{{c.delD}}" style="{{c.delS}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Usuń kolumnę</button>
                    </div></sc-if>
                  </span></div></sc-for>
                  <div class="gth" style="padding: 0"><button type="button" class="addcol" onClick="{{b.t.addCol}}" aria-label="Dodaj kolumnę"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div>
                </div>
                <sc-for list="{{b.t.rows}}" as="row" hint-placeholder-count="2"><div class="trow" role="row" style="{{b.t.gridS}}">
                  <sc-for list="{{row.cells}}" as="cell" hint-placeholder-count="3"><div class="gtd" role="cell" style="{{cell.tdS}}">
                    <sc-if value="{{cell.isText}}" hint-placeholder-val="{{true}}"><input type="text" class="ed-in" value="{{cell.v}}" onChange="{{cell.on}}" placeholder="{{cell.ph}}" aria-label="{{cell.label}}" style="{{cell.inS}}"></sc-if>
                    <sc-if value="{{cell.isCheck}}" hint-placeholder-val="{{false}}"><button type="button" class="cbx" role="checkbox" aria-checked="{{cell.ac}}" aria-label="{{cell.label}}" onClick="{{cell.toggle}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button></sc-if>
                    <sc-if value="{{cell.isDate}}" hint-placeholder-val="{{false}}"><span style="position: relative; display: inline-flex">
                      <button type="button" class="cellbtn num" onClick="{{cell.d.toggle}}" aria-haspopup="dialog" aria-expanded="{{cell.d.exp}}" aria-label="{{cell.label}}" style="{{cell.d.btnS}}">{{cell.d.txt}}</button>
                      <sc-if value="{{cell.d.open}}" hint-placeholder-val="{{false}}"><div role="dialog" aria-label="Wybierz datę" class="pop epop" style="width: 256px; padding: 10px">
                        <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px"><button type="button" class="btn ic sm" aria-label="Poprzedni miesiąc" onClick="{{cell.d.prev}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button><span style="font-size: 14px; font-weight: 600">{{cell.d.label}}</span><button type="button" class="btn ic sm" aria-label="Następny miesiąc" onClick="{{cell.d.next}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button></div>
                        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; font-size: 12px; font-weight: 500; color: #686868; text-align: center; padding-bottom: 4px"><span>pn</span><span>wt</span><span>śr</span><span>cz</span><span>pt</span><span>sb</span><span>nd</span></div>
                        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px"><sc-for list="{{cell.d.cal}}" as="dc" hint-placeholder-count="35"><button type="button" class="cday num" onClick="{{dc.pick}}" style="{{dc.s}}">{{dc.t}}</button></sc-for></div>
                        <div style="display: flex; justify-content: space-between; border-top: 1px solid rgba(0,0,0,.08); margin-top: 8px; padding-top: 8px"><button type="button" class="btng xs" onClick="{{cell.d.today}}">Dziś</button><button type="button" class="btng xs" onClick="{{cell.d.clear}}" style="color: #686868">Wyczyść</button></div>
                      </div></sc-if>
                    </span></sc-if>
                    <sc-if value="{{cell.isSel}}" hint-placeholder-val="{{false}}"><span style="position: relative; display: inline-flex">
                      <button type="button" class="cellbtn" onClick="{{cell.sel.toggle}}" aria-haspopup="listbox" aria-expanded="{{cell.sel.exp}}" aria-label="{{cell.label}}"><span class="{{cell.sel.bc}}">{{cell.sel.txt}}</span></button>
                      <sc-if value="{{cell.sel.open}}" hint-placeholder-val="{{false}}"><div role="listbox" aria-label="{{cell.label}}" class="pop epop" style="width: 210px; padding: 4px; display: flex; flex-direction: column; gap: 1px">
                        <sc-for list="{{cell.sel.opts}}" as="o" hint-placeholder-count="3"><button type="button" role="option" class="ddopt" aria-selected="{{o.p}}" onClick="{{o.pick}}"><span class="{{o.bc}}">{{o.t}}</span><sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></button></sc-for>
                        <div class="mi-sep"></div>
                        <div style="display: flex; justify-content: space-between"><button type="button" class="btng xs" onClick="{{cell.sel.clear}}" style="color: #686868">Wyczyść</button><button type="button" class="btng xs" onClick="{{cell.sel.edit}}">Edytuj opcje</button></div>
                      </div></sc-if>
                    </span></sc-if>
                  </div></sc-for>
                  <div class="gtd" style="padding: 0; display: flex; align-items: center; justify-content: center"><button type="button" class="row-del btng ic xs" aria-label="Usuń wiersz" onClick="{{row.remove}}" style="color: #b91c1c"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button></div>
                </div></sc-for>
                <sc-if value="{{b.t.hasFoot}}" hint-placeholder-val="{{false}}"><div class="trow tfoot" style="{{b.t.gridS}}"><sc-for list="{{b.t.foot}}" as="ft" hint-placeholder-count="3"><div class="num" style="{{ft.s}}">{{ft.t}}</div></sc-for><div></div></div></sc-if>
              </div></div>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><button type="button" class="btng sm" onClick="{{b.t.addRow}}" style="color: #686868"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nowy wiersz</button><span class="bdg sec">{{b.t.meta}}</span></div>
            </div>
          </sc-if>
          <button type="button" class="blk-act btng ic xs" aria-label="Usuń blok" onClick="{{b.remove}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
        </div>
      </sc-for>

      <div style="position: relative; display: flex; align-items: center; gap: 8px">
        <button type="button" class="btn ic sm" aria-label="Wstaw blok" onClick="{{openMenu}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        <input type="text" class="ed-in" value="{{cmd}}" onChange="{{onCmd}}" onKeyDown="{{onKey}}" placeholder="Wpisz „/”, aby wstawić blok — tabelę, listę, nagłówek…" aria-label="Nowy blok" aria-haspopup="listbox" aria-expanded="{{menuExp}}" style="padding: 6px 0; color: #404040">
        <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}"><div role="listbox" aria-label="Bloki" class="pop epop" style="left: 40px; width: 330px; padding: 4px">
          <div class="mi-lbl">Bloki</div>
          <sc-for list="{{menu}}" as="m" hint-placeholder-count="5"><button type="button" role="option" class="mi" aria-selected="{{m.sel}}" onClick="{{m.pick}}" onMouseEnter="{{m.hover}}" style="min-height: 44px; gap: 10px"><span class="ico">{{m.icon}}</span><span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 500">{{m.label}}</span><span style="font-size: 12px; color: #686868">{{m.desc}}</span></span></button></sc-for>
          <sc-if value="{{menuEmpty}}" hint-placeholder-val="{{false}}"><div class="muted" style="padding: 8px; font-size: 13px">Brak bloku „{{q}}”</div></sc-if>
          <div class="mi-sep"></div>
          <div class="muted" style="display: flex; gap: 10px; padding: 4px 8px 2px; font-size: 12px"><span><kbd class="kbd">↑</kbd><kbd class="kbd">↓</kbd> wybór</span><span><kbd class="kbd">Enter</kbd> wstaw</span><span><kbd class="kbd">Esc</kbd> zamknij</span></div>
        </div></sc-if>
      </div>

      <sc-if value="{{isEmpty}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px">
          <span class="muted" style="font-size: 13px; margin-right: 4px">albo zacznij od:</span>
          <sc-for list="{{quick}}" as="qk" hint-placeholder-count="4"><button type="button" class="chip" onClick="{{qk.pick}}"><span style="color: #686868; font-size: 12px; font-weight: 600">{{qk.icon}}</span>{{qk.label}}</button></sc-for>
        </div>
        <p class="muted" style="margin: 24px 0 0; font-size: 13px">Wolisz gotowca? <a href="CNewPage.dc.html" style="color: #262626; font-weight: 500; text-underline-offset: 3px">Użyj szablonu →</a></p>
      </sc-if>
    </div>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  componentDidMount() { try { sessionStorage.setItem('rh-page', 'CEmptyPage.dc.html'); } catch (e) {} }
  renderVals() {
    const S = this.state || {};
    const TODAY = '2026-11-15';
    const B = S.blocks || [];
    const P = S.pick || null;
    const cmd = S.cmd || '';
    const MONF = ['Styczeń', 'Luty', 'Marzec', 'Kwiecień', 'Maj', 'Czerwiec', 'Lipiec', 'Sierpień', 'Wrzesień', 'Październik', 'Listopad', 'Grudzień'];
    const p2 = (x) => String(x).padStart(2, '0');
    const fmt = (iso) => (iso ? iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.' + iso.slice(0, 4) : '');
    const pl = (n, one, few, many) => n + ' ' + (n === 1 ? one : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? few : many);
    const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const PAL = ['bdg sec', 'bdg info', 'bdg ok', 'bdg warn', 'bdg out', 'bdg bad'];
    const TYPES = [
      { k: 'text', icon: 'Aa', label: 'Tekst' }, { k: 'num', icon: '#', label: 'Liczba' }, { k: 'date', icon: '▦', label: 'Data' },
      { k: 'sel', icon: '◐', label: 'Wybór' }, { k: 'check', icon: '✓', label: 'Checkbox' }, { k: 'url', icon: '↗', label: 'Link' }
    ];
    const DEFS = [
      { k: 'table', icon: '▦', label: 'Tabela', desc: 'Wiersze i kolumny z typami pól', kw: 'tabela table baza database' },
      { k: 'todo', icon: '✓', label: 'Lista zadań', desc: 'Punkty do odhaczenia', kw: 'lista zadania todo checkbox' },
      { k: 'h', icon: 'H', label: 'Nagłówek', desc: 'Tytuł sekcji', kw: 'naglowek heading tytul sekcja' },
      { k: 'text', icon: '¶', label: 'Tekst', desc: 'Zwykły akapit', kw: 'tekst text akapit' },
      { k: 'div', icon: '—', label: 'Separator', desc: 'Pozioma linia', kw: 'separator linia divider hr' }
    ];
    const save = (blocks, extra) => this.setState(Object.assign({ blocks }, extra || {}));
    const updB = (id, fn, extra) => save(B.map((b) => (b.id === id ? fn(b) : b)), extra);
    const updT = (id, fn, extra) => updB(id, (b) => Object.assign({}, b, { t: fn(b.t) }), extra);
    const mk = (k, text) => {
      if (k !== 'table') return { id: nid(), type: k, text: text || '', done: false };
      return { id: nid(), type: 'table', t: { name: '', rows: [{ id: nid(), v: {} }, { id: nid() + 'b', v: {} }], cols: [
        { id: 'c1', name: 'Nazwa', type: 'text' },
        { id: 'c2', name: 'Status', type: 'sel', opts: ['Do zrobienia', 'W toku', 'Zrobione'] },
        { id: 'c3', name: 'Data', type: 'date' }
      ] } };
    };
    const insert = (k, text) => save(B.concat([mk(k, text)]), { cmd: '', hi: 0, pick: null });
    const qOf = (val) => (val.charAt(0) === '/' ? val.slice(1).toLowerCase().trim() : null);
    const filt = (q) => DEFS.filter((d) => !q || (d.label.toLowerCase() + ' ' + d.kw).indexOf(q) >= 0);
    const q = qOf(cmd);
    const found = q === null ? [] : filt(q);
    const hi = Math.max(0, Math.min(S.hi || 0, found.length - 1));
    const onKey = (e) => {
      const val = (e.target && e.target.value) || '';
      const qq = qOf(val);
      if (qq !== null) {
        const list = filt(qq);
        const cur = Math.max(0, Math.min(S.hi || 0, list.length - 1));
        if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ cmd: val, hi: list.length ? (cur + 1) % list.length : 0 }); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ cmd: val, hi: list.length ? (cur - 1 + list.length) % list.length : 0 }); }
        else if (e.key === 'Enter') { e.preventDefault(); if (list[cur]) insert(list[cur].k); }
        else if (e.key === 'Escape') { this.setState({ cmd: '', hi: 0 }); }
      } else if (e.key === 'Enter' && val.trim()) { e.preventDefault(); insert('text', val.trim()); }
    };
    const dp = (iso, key, set) => {
      const open = !!(P && P.kind === 'date' && P.key === key);
      const mo = open ? (P.mo || 0) : 0;
      const b = iso || TODAY;
      const first = new Date(Date.UTC(+b.slice(0, 4), +b.slice(5, 7) - 1 + mo, 1));
      const lead = (first.getUTCDay() + 6) % 7;
      const nd = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)).getUTCDate();
      const cal = [];
      if (open) {
        for (let k = 0; k < lead; k++) cal.push({ t: '', s: 'visibility:hidden', pick: () => {} });
        for (let d = 1; d <= nd; d++) {
          const ds = first.getUTCFullYear() + '-' + p2(first.getUTCMonth() + 1) + '-' + p2(d);
          cal.push({ t: String(d), s: ds === iso ? 'background:#262626;color:#fafafa;font-weight:600' : ds === TODAY ? 'background:rgba(0,0,0,.05);font-weight:600' : '', pick: () => set(ds, { pick: null }) });
        }
      }
      return { txt: iso ? fmt(iso) : '—', open, exp: open ? 'true' : 'false', cal, btnS: iso ? '' : 'color:#a3a3a3',
        toggle: () => this.setState({ pick: open ? null : { kind: 'date', key, mo: 0 } }),
        label: MONF[first.getUTCMonth()] + ' ' + first.getUTCFullYear(),
        prev: () => this.setState({ pick: { kind: 'date', key, mo: mo - 1 } }), next: () => this.setState({ pick: { kind: 'date', key, mo: mo + 1 } }),
        today: () => set(TODAY, { pick: null }), clear: () => set('', { pick: null }) };
    };
    const conv = (v, from, to) => {
      if (v === undefined || v === null || v === '' || v === false) return to === 'check' ? false : '';
      if (from === to) return v;
      if (to === 'check') return v === true || /^(tak|true|1|x|✓)$/i.test(String(v).trim());
      if (to === 'num') { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? '' : String(n).replace('.', ','); }
      if (to === 'date') return /^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? v : '';
      if (from === 'check') return v ? 'Tak' : '';
      if (from === 'date') return fmt(v);
      return String(v);
    };
    const table = (blk) => {
      const T = blk.t;
      const n = T.cols.length;
      const cols = T.cols.map((c, ci) => {
        const open = !!(P && P.kind === 'col' && P.b === blk.id && P.c === c.id);
        const ty = TYPES.filter((t) => t.k === c.type)[0] || TYPES[0];
        const setCol = (patch, extra) => updT(blk.id, (t) => Object.assign({}, t, { cols: t.cols.map((x) => (x.id === c.id ? Object.assign({}, x, patch) : x)) }), extra);
        const opts = c.opts || [];
        const addOpt = (raw) => { const v = (raw || '').trim(); if (!v || opts.indexOf(v) >= 0) return; setCol({ opts: opts.concat([v]) }, { newOpt: '' }); };
        const move = (dir) => { const j = ci + dir; if (j < 0 || j >= n) return; updT(blk.id, (t) => { const a = t.cols.slice(); const tmp = a[ci]; a[ci] = a[j]; a[j] = tmp; return Object.assign({}, t, { cols: a }); }); };
        return {
          name: c.name || 'Bez nazwy', icon: ty.icon, open, exp: open ? 'true' : 'false',
          toggle: () => this.setState({ pick: open ? null : { kind: 'col', b: blk.id, c: c.id }, newOpt: '' }),
          onName: (e) => setCol({ name: e.target.value }),
          types: TYPES.map((t) => ({ icon: t.icon, label: t.label, on: t.k === c.type, p: t.k === c.type ? 'true' : 'false', s: t.k === c.type ? 'background:rgba(0,0,0,.04);font-weight:500' : '',
            pick: () => {
              if (t.k === c.type) return;
              updT(blk.id, (tt) => {
                const vals = tt.rows.map((r) => conv(r.v[c.id], c.type, t.k)).filter((v) => typeof v === 'string' && v);
                const nextOpts = t.k === 'sel' ? (opts.length ? opts : (vals.length ? vals.filter((v, i) => vals.indexOf(v) === i) : ['Opcja 1', 'Opcja 2'])) : c.opts;
                return Object.assign({}, tt, {
                  cols: tt.cols.map((x) => (x.id === c.id ? Object.assign({}, x, { type: t.k, opts: nextOpts }) : x)),
                  rows: tt.rows.map((r) => Object.assign({}, r, { v: Object.assign({}, r.v, { [c.id]: conv(r.v[c.id], c.type, t.k) }) }))
                });
              });
            } })),
          isSel: c.type === 'sel',
          opts: opts.map((o, oi) => ({ t: o, c: PAL[oi % PAL.length], remove: () => setCol({ opts: opts.filter((x) => x !== o) }) })),
          newOpt: S.newOpt || '', onNewOpt: (e) => this.setState({ newOpt: e.target.value }),
          optKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); addOpt(e.target.value); } },
          addOpt: () => addOpt(S.newOpt),
          moveL: () => move(-1), moveR: () => move(1),
          firstD: ci === 0 ? 'true' : 'false', lastD: ci === n - 1 ? 'true' : 'false',
          remove: () => { if (n > 1) updT(blk.id, (t) => Object.assign({}, t, { cols: t.cols.filter((x) => x.id !== c.id) }), { pick: null }); },
          delD: n > 1 ? 'false' : 'true', delS: ''
        };
      });
      const rows = T.rows.map((r) => ({
        remove: () => updT(blk.id, (t) => Object.assign({}, t, { rows: t.rows.filter((x) => x.id !== r.id) }), { pick: null }),
        cells: T.cols.map((c, ci) => {
          const v = r.v[c.id];
          const key = blk.id + ':' + r.id + ':' + c.id;
          const set = (val, extra) => updT(blk.id, (t) => Object.assign({}, t, { rows: t.rows.map((x) => (x.id === r.id ? Object.assign({}, x, { v: Object.assign({}, x.v, { [c.id]: val }) }) : x)) }), extra);
          const cell = { isText: c.type === 'text' || c.type === 'num' || c.type === 'url', isCheck: c.type === 'check', isDate: c.type === 'date', isSel: c.type === 'sel',
            label: c.name || 'Pole', tdS: ci === 0 ? 'font-weight:500' : '', d: {}, sel: {},
            v: v || '', on: (e) => set(e.target.value), ph: ci === 0 ? 'Bez nazwy' : '',
            inS: c.type === 'num' ? 'text-align:right;font-variant-numeric:tabular-nums' : c.type === 'url' ? 'color:#404040;text-decoration:underline;text-decoration-color:rgba(0,0,0,.2);text-underline-offset:3px' : '' };
          if (cell.isCheck) { cell.ac = v ? 'true' : 'false'; cell.toggle = () => set(!v); }
          if (cell.isDate) cell.d = dp(v, key, set);
          if (cell.isSel) {
            const opts = c.opts || [];
            const open = !!(P && P.kind === 'sel' && P.key === key);
            cell.sel = { txt: v || '—', bc: v ? PAL[Math.max(0, opts.indexOf(v)) % PAL.length] : 'muted', open, exp: open ? 'true' : 'false',
              toggle: () => this.setState({ pick: open ? null : { kind: 'sel', key } }),
              opts: opts.map((o, oi) => ({ t: o, bc: PAL[oi % PAL.length], p: o === v ? 'true' : 'false', on: o === v, pick: () => set(o, { pick: null }) })),
              clear: () => set('', { pick: null }), edit: () => this.setState({ pick: { kind: 'col', b: blk.id, c: c.id }, newOpt: '' }) };
          }
          return cell;
        })
      }));
      const foot = T.cols.map((c) => {
        const s = 'padding:8px 12px;font-size:13px;color:#686868;' + (c.type === 'num' ? 'text-align:right' : '');
        if (c.type === 'num') { const sum = T.rows.reduce((a, r) => { const x = parseFloat(String(r.v[c.id] || '').replace(',', '.')); return a + (isNaN(x) ? 0 : x); }, 0); return { s, t: 'Suma ' + (Number.isInteger(sum) ? String(sum) : sum.toFixed(2).replace('.', ',')) }; }
        if (c.type === 'check') return { s, t: T.rows.filter((r) => r.v[c.id]).length + ' / ' + T.rows.length };
        return { s, t: '' };
      });
      return { name: T.name, onName: (e) => updT(blk.id, (t) => Object.assign({}, t, { name: e.target.value })), cols, rows, foot,
        gridS: 'grid-template-columns:minmax(200px,2fr)' + (n > 1 ? ' repeat(' + (n - 1) + ',minmax(140px,1fr))' : '') + ' 44px;min-width:' + (244 + 140 * (n - 1)) + 'px',
        hasFoot: T.cols.some((c) => c.type === 'num' || c.type === 'check'),
        meta: pl(T.rows.length, 'wiersz', 'wiersze', 'wierszy') + ' · ' + pl(n, 'kolumna', 'kolumny', 'kolumn'),
        addRow: () => updT(blk.id, (t) => Object.assign({}, t, { rows: t.rows.concat([{ id: nid(), v: {} }]) }), { pick: null }),
        addCol: () => { const id = 'c' + nid(); updT(blk.id, (t) => Object.assign({}, t, { cols: t.cols.concat([{ id, name: 'Kolumna ' + (t.cols.length + 1), type: 'text' }]) }), { pick: { kind: 'col', b: blk.id, c: id }, newOpt: '' }); } };
    };
    const blocks = B.map((b) => ({
      isText: b.type === 'text', isH: b.type === 'h', isTodo: b.type === 'todo', isDiv: b.type === 'div', isTable: b.type === 'table',
      text: b.text || '', onText: (e) => updB(b.id, (x) => Object.assign({}, x, { text: e.target.value })),
      ac: b.done ? 'true' : 'false', todoS: b.done ? 'text-decoration:line-through;color:#a3a3a3' : '',
      toggle: () => updB(b.id, (x) => Object.assign({}, x, { done: !x.done })),
      remove: () => save(B.filter((x) => x.id !== b.id), { pick: null }),
      t: b.type === 'table' ? table(b) : {}
    }));
    return {
      title: S.title || '', crumb: S.title || 'Bez tytułu',
      // Ikona strony: emoji albo ikona liniowa w kolorze (CIconPicker), jak w menu strony w sidebarze.
      pageIconVal: S.icon || null, iconOpen: !!S.iconOpen, iconExp: S.iconOpen ? 'true' : 'false',
      toggleIcons: () => this.setState({ iconOpen: !S.iconOpen }), pickIcon: (v) => this.setState({ icon: v, iconOpen: false }),
      iconBtnS: 'width:40px;height:40px;border-radius:10px;font:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;' + (S.icon ? 'border:1px solid transparent;background:transparent;color:#262626' : 'border:1px dashed rgba(0,0,0,.18);background:#fafafa;color:#686868'),
      onTitle: (e) => this.setState({ title: e.target.value }),
      blocks, isEmpty: !B.length, cmd, q: q || '',
      onCmd: (e) => this.setState({ cmd: e.target.value, hi: 0 }), onKey,
      openMenu: () => this.setState({ cmd: q === null ? '/' : '', hi: 0, pick: null }),
      menuOpen: q !== null, menuExp: q !== null ? 'true' : 'false', menuEmpty: q !== null && !found.length,
      menu: found.map((d, i) => ({ icon: d.icon, label: d.label, desc: d.desc, sel: i === hi ? 'true' : 'false', pick: () => insert(d.k), hover: () => { if ((S.hi || 0) !== i) this.setState({ hi: i }); } })),
      quick: DEFS.slice(0, 4).map((d) => ({ icon: d.icon, label: d.label, pick: () => insert(d.k) }))
    };
  }
}
</script>
