<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon — Rejestracja (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#fafafa}
/* CM-BASE — wspólne dodatki mobilne COSS. Ten blok ma być IDENTYCZNY w każdym pliku CM*.
   Wszystko inne bierzemy z arkusza coss/coss.css (klasy .btn/.btnp/.btng/.btns/.btnd/.btndo,
   .inp/.igroup/.dd, .fld/.lbl/.hint/.err, .cbx/.sw/input[type=checkbox|radio], .seg/.tabs/.chip/.dot, .bdg.*,
   .card/.card-h/.card-t/.card-d/.card-p/.foot, .frame>.inner, .sep, .pop/.mi/.mi-sep/.mi-lbl, .backdrop, .dlg*,
   .toast, .alert.*, .kbd, .prog, .avatar, .empty/.empty-ic, .num, .muted, .h-title). */

/* Ekran telefonu */
html body .m-screen{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:var(--foreground);font-size:14px}
html body .m-status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600}
html body .m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);background:#fff}
html body .m-title{margin:0;font-size:18px;font-weight:600;letter-spacing:-.011em}
html body .m-body{padding:16px}

/* Cele dotykowe ≥44 px na telefonie (nadpisują rozmiary webowe arkusza) */
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo){height:44px}
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo).ic{width:44px}
html body .m-screen :is(.inp,.dd,.igroup){height:44px;font-size:16px}
html body .m-screen textarea.inp{height:auto}
html body .m-screen .seg :is(a,button){height:40px}
html body .m-screen .chip{height:36px}
html body .m-screen .mi{min-height:44px}
html body .m-hit{position:relative}
html body .m-hit::before{content:"";position:absolute;inset:-14px}

/* Wiersz listy (ustawienia, strony, wyniki wyszukiwania) */
html body .m-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
html body .m-row:last-child{border-bottom:0}

/* Arkusz od dołu = .dlg przyklejony do dołu */
html body .m-sheet{position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;max-height:88%;overflow:auto}
html body .m-grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:8px auto 0}

/* Krok +/− */
html body .m-step{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:var(--radius);box-shadow:var(--shadow-xs5);overflow:hidden}
html body .m-step button{width:44px;height:44px;border:0;background:#fff;font:inherit;font-size:18px;cursor:pointer}
html body .m-step span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}

/* Przycisk pływający (FAB) — nad paskiem zakładek */
html body .m-fab{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:16px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px -4px rgba(38,38,38,.32);cursor:pointer}

</style>
</helmet>
<div class="m-screen" style="display:flex;flex-direction:column">
  <div class="m-status"><span>9:41</span><span></span></div>
  <header class="m-head" style="border-bottom:0"><a href="CMLogin.dc.html" class="btng ic" aria-label="Wstecz"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a></header>
  <div style="flex:1;overflow-y:auto;padding:0 20px 24px;display:flex;flex-direction:column;gap:16px">
    <form class="card" onSubmit="{{noop}}">
      <div class="card-h" style="flex-direction:column;align-items:stretch;gap:0;padding-top:24px"><h1 class="h-title" style="font-size:20px">Załóż konto</h1><p class="card-d">Kalendarz, nawyki, sport i strony w jednym miejscu.</p></div>
      <div class="card-p" style="display:flex;flex-direction:column;gap:16px;padding-bottom:24px">
        <label class="fld">Imię<input class="inp" type="text" autocomplete="given-name" placeholder="Jak mamy się do ciebie zwracać?"></label>
        <label class="fld">E-mail<input class="inp" type="email" autocomplete="email" placeholder="ty@example.com"></label>
        <label class="fld">Hasło<input class="inp" type="password" autocomplete="new-password" placeholder="Min. 10 znaków" value="{{pw}}" onChange="{{onPw}}">
          <span style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:4px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="4"><span style="{{b.s}}"></span></sc-for></span>
          <span class="hint">{{pwHint}}</span>
        </label>
        <label style="display:flex;align-items:flex-start;gap:12px;line-height:1.45;min-height:44px"><input type="checkbox" class="m-hit" checked="{{tosOn}}" onChange="{{toggleTos}}" aria-label="Akceptuję regulamin" style="margin-top:2px"><span>Akceptuję <span style="text-decoration:underline">regulamin</span> i <span style="text-decoration:underline">politykę prywatności</span>.</span></label>
        <a href="CMOnboarding.dc.html" class="btnp" style="{{ctaS}}" aria-disabled="{{ctaDis}}">Utwórz konto</a>
      </div>
    </form>
    <p class="muted" style="margin:0;text-align:center">Masz już konto? <a href="CMLogin.dc.html" style="font-weight:500;color:var(--foreground);display:inline-block;padding:12px 0">Zaloguj się</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const pw = S.pw || '';
    const score = (pw.length >= 10 ? 1 : 0) + (/[A-Z]/.test(pw) ? 1 : 0) + (/[0-9]/.test(pw) ? 1 : 0) + (/[^A-Za-z0-9]/.test(pw) ? 1 : 0);
    const col = ['rgba(0,0,0,.08)', '#ef4444', '#f59e0b', '#15803d', '#15803d'][score];
    const tos = !!S.tos;
    return {
      pw, onPw: (e) => this.setState({ pw: e.target.value }),
      noop: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      bars: [0, 1, 2, 3].map((i) => ({ s: 'height:6px;border-radius:999px;background:' + (i < score ? col : 'rgba(0,0,0,.06)') })),
      pwHint: pw ? ['Za krótkie', 'Słabe', 'Średnie', 'Dobre', 'Mocne'][score] + ' hasło' : '10+ znaków, wielka litera, cyfra, znak',
      tosOn: tos, toggleTos: () => this.setState({ tos: !tos }),
      ctaS: tos ? '' : 'pointer-events:none', ctaDis: tos ? 'false' : 'true'
    };
  }
}
</script>
</body>
</html>
