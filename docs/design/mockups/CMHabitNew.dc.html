<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon — Nowy nawyk (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
/* CM-BASE — wspólne dodatki mobilne COSS. Ten blok ma być IDENTYCZNY w każdym pliku CM*.
   Wszystko inne bierzemy z arkusza coss/coss.css (klasy .btn/.btnp/.btng/.btns/.btnd/.btndo,
   .inp/.igroup/.dd, .fld/.lbl/.hint/.err, .cbx/.sw/input[type=checkbox|radio], .seg/.tabs/.chip/.dot, .bdg.*,
   .card/.card-h/.card-t/.card-d/.card-p/.foot, .frame>.inner, .sep, .pop/.mi/.mi-sep/.mi-lbl, .backdrop, .dlg*,
   .toast, .alert.*, .kbd, .prog, .avatar, .empty/.empty-ic, .num, .muted, .h-title). */

/* Ekran telefonu */
html body .m-screen{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;color:var(--foreground);font-size:14px}
html body .m-status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600}
html body .m-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);background:#fff}
html body .m-title{margin:0;font-size:18px;font-weight:600;letter-spacing:-.011em}
html body .m-body{padding:16px}

/* Cele dotykowe ≥44 px na telefonie (nadpisują rozmiary webowe arkusza) */
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo){height:44px}
html body .m-screen :is(.btn,.btnp,.btnd,.btng,.btns,.btndo).ic{width:44px}
html body .m-screen :is(.inp,.dd,.igroup){height:44px;font-size:16px}
html body .m-screen textarea.inp{height:auto}
html body .m-screen .seg :is(a,button){height:40px}
html body .m-screen .chip{height:36px}
html body .m-screen .mi{min-height:44px}
html body .m-hit{position:relative}
html body .m-hit::before{content:"";position:absolute;inset:-14px}

/* Wiersz listy (ustawienia, strony, wyniki wyszukiwania) */
html body .m-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
html body .m-row:last-child{border-bottom:0}

/* Arkusz od dołu = .dlg przyklejony do dołu */
html body .m-sheet{position:absolute;left:0;right:0;bottom:0;border-radius:16px 16px 0 0;max-height:88%;overflow:auto}
html body .m-grab{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);margin:8px auto 0}

/* Krok +/− */
html body .m-step{display:inline-flex;align-items:center;border:1px solid var(--input);border-radius:var(--radius);box-shadow:var(--shadow-xs5);overflow:hidden}
html body .m-step button{width:44px;height:44px;border:0;background:#fff;font:inherit;font-size:18px;cursor:pointer}
html body .m-step span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}

/* Przycisk pływający (FAB) — nad paskiem zakładek */
html body .m-fab{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:16px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px -4px rgba(38,38,38,.32);cursor:pointer}

body{margin:0;background:#ffffff}
</style>
</helmet>
<div class="m-screen" style="display: flex; flex-direction: column">

  <header class="m-head" style="flex: none; padding: 0 8px"><a href="CMHabits.dc.html" class="btng" style="color: var(--muted-foreground)">Anuluj</a><h1 class="m-title" style="flex: 1; text-align: center; font-size: 16px">Nowy nawyk</h1><a href="CMHabits.dc.html" class="btnp">Zapisz</a></header>
  <div style="flex: 1; overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 20px">
    <label class="fld">Nazwa<input class="inp" type="text" placeholder="Np. Woda 2 l" value="Medytacja 10 min"></label>
    <div class="fld"><span class="lbl">Jak często</span><div class="seg" style="display: flex"><sc-for list="{{freqs}}" as="f" hint-placeholder-count="3"><button type="button" aria-pressed="{{f.p}}" onClick="{{f.pick}}" style="flex: 1">{{f.t}}</button></sc-for></div></div>
    <sc-if value="{{showDays}}" hint-placeholder-val="{{true}}"><div role="group" aria-label="Dni tygodnia" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px"><sc-for list="{{days}}" as="d" hint-placeholder-count="7"><button type="button" class="chip m-hit" aria-pressed="{{d.p}}" aria-label="{{d.label}}" onClick="{{d.pick}}" style="justify-content: center; padding: 0">{{d.t}}</button></sc-for></div></sc-if>
    <sc-if value="{{showTimes}}" hint-placeholder-val="{{false}}"><div class="card"><div class="m-row"><span style="flex: 1">Razy w tygodniu</span><span class="m-step"><button type="button" aria-label="Mniej" onClick="{{tMinus}}">−</button><span>{{times}}</span><button type="button" aria-label="Więcej" onClick="{{tPlus}}">+</button></span></div></div></sc-if>
    <div class="card">
      <div class="m-row"><span style="flex: 1">Przypomnienie</span><button type="button" class="sw m-hit" role="switch" aria-checked="{{rem}}" aria-label="Przypomnienie" onClick="{{toggleRem}}"></button></div>
      <sc-if value="{{remOn}}" hint-placeholder-val="{{true}}"><div class="m-row" style="flex-wrap: wrap; gap: 8px; padding-top: 10px; padding-bottom: 10px"><sc-for list="{{times2}}" as="t" hint-placeholder-count="4"><button type="button" class="chip num m-hit" aria-pressed="{{t.p}}" onClick="{{t.pick}}">{{t.t}}</button></sc-for></div></sc-if>
      <div class="m-row"><span style="flex: 1">Pokazuj na ekranie Dziś</span><button type="button" class="sw m-hit" role="switch" aria-checked="{{today}}" aria-label="Pokazuj na ekranie Dziś" onClick="{{toggleToday}}"></button></div>
    </div>
    <p class="hint" style="margin: 0; line-height: 1.5; font-size: 13px">{{summary}}</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const freq = S.freq || 'days';
    const sel = S.days || [0, 2, 4];
    const WD = ['Pn', 'Wt', 'Śr', 'Cz', 'Pt', 'Sb', 'Nd'];
    const FULL = ['poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota', 'niedziela'];
    const times = S.times || 3, at = S.at || '07:30';
    const rem = S.rem !== false, td = S.td !== false;
    const when = freq === 'daily' ? 'codziennie' : freq === 'times' ? times + '× w tygodniu' : (sel.length ? sel.slice().sort().map((i) => WD[i]).join(', ') : 'brak dni');
    return {
      freqs: [['daily', 'Codziennie'], ['days', 'Wybrane dni'], ['times', 'X w tyg.']].map((f) => ({ t: f[1], p: f[0] === freq ? 'true' : 'false', pick: () => this.setState({ freq: f[0] }) })),
      showDays: freq === 'days', showTimes: freq === 'times',
      days: WD.map((w, i) => { const on = sel.indexOf(i) >= 0; return { t: w, label: FULL[i], p: on ? 'true' : 'false',
        pick: () => this.setState({ days: on ? sel.filter((x) => x !== i) : sel.concat([i]) }) }; }),
      times, tMinus: () => this.setState({ times: Math.max(1, times - 1) }), tPlus: () => this.setState({ times: Math.min(7, times + 1) }),
      rem: rem ? 'true' : 'false', remOn: rem, toggleRem: () => this.setState({ rem: !rem }),
      today: td ? 'true' : 'false', toggleToday: () => this.setState({ td: !td }),
      times2: ['07:30', '12:00', '18:00', '21:00'].map((t) => ({ t, p: t === at ? 'true' : 'false', pick: () => this.setState({ at: t }) })),
      summary: 'Nawyk: ' + when + (rem ? ', przypomnienie o ' + at : ', bez przypomnienia') + '.'
    };
  }
}
</script>
</body>
</html>
