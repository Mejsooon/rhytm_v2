<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Onboarding 2 — Kim jesteś (COSS UI)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="coss/coss.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#fafafa}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid rgba(0,0,0,.1);border-radius:12px;background:#fff;background-clip:padding-box;box-shadow:0 1px 2px rgba(0,0,0,.05);font:inherit;color:#262626;cursor:pointer;box-sizing:border-box;transition:border-color .15s,background-color .15s,box-shadow .15s}
.opt:hover{background:#fafafa}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:rgba(0,0,0,.24);background:rgba(0,0,0,.025);box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.opt .cbx{margin-top:2px;pointer-events:none}
.opt[aria-pressed="true"] .cbx,.opt[aria-checked="true"] .cbx{background:#262626;border-color:#262626;color:#fafafa}
@media (max-width:1100px){.split{grid-template-columns:1fr !important}.pvside{display:none !important}}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: #fafafa; color: #262626; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums">
  <header style="height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 24px">
    <svg width="24" height="24" viewBox="0 0 48 48" role="img" aria-label="rhytm" style="flex: none"><rect x="4" y="4" width="11" height="11" rx="3" fill="#262626"></rect><rect x="18" y="4" width="11" height="11" rx="3" fill="#262626" opacity="0.55"></rect><rect x="32" y="4" width="11" height="11" rx="3" fill="#262626" opacity="0.25"></rect><rect x="4" y="18" width="11" height="11" rx="3" fill="#262626" opacity="0.55"></rect><rect x="18" y="18" width="11" height="11" rx="3" fill="#262626" opacity="0.25"></rect><rect x="32" y="18" width="11" height="11" rx="3" fill="#15803d"></rect><rect x="4" y="32" width="11" height="11" rx="3" fill="#262626" opacity="0.25"></rect><rect x="18" y="32" width="11" height="11" rx="3" fill="#262626"></rect><rect x="32" y="32" width="11" height="11" rx="3" fill="#262626" opacity="0.55"></rect></svg><span style="font-weight: 600; font-size: 16px; letter-spacing: -0.03em">rhytm</span>
    <span class="bdg sec lg" style="margin-left: auto">Krok 2 z 7</span>
    <a href="S2Login.dc.html" class="btng sm" style="margin-left: 8px; color: #686868">Wyloguj</a>
  </header>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 24px 40px">
    <div class="card" style="width: 100%; max-width: 1120px; height: 720px; overflow: hidden">
      <div role="progressbar" aria-label="Postęp" aria-valuemin="1" aria-valuemax="7" aria-valuenow="2" style="display: flex; gap: 4px; padding: 16px 20px 0"><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: #262626"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(0,0,0,.08)"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(0,0,0,.08)"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(0,0,0,.08)"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(0,0,0,.08)"></span><span style="flex: 1; height: 4px; border-radius: 999px; background: rgba(0,0,0,.08)"></span></div>
      <div class="split" style="flex: 1; min-height: 0; display: grid; grid-template-columns: 520px 1fr">
        <div style="display: flex; flex-direction: column; min-height: 0">
          <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; padding: 32px 40px 20px">
            <div><h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em">Kim jesteś?</h1><p class="muted" style="margin: 6px 0 0">Dopasujemy kategorie w kalendarzu. Możesz zaznaczyć kilka</p></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
              <sc-for list="{{roles}}" as="r" hint-placeholder-count="5"><button type="button" class="opt" aria-pressed="{{r.on}}" onClick="{{r.toggle}}" style="{{r.span}}"><span class="cbx"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">{{r.title}}</span><span class="hint" style="font-size: 13px">{{r.desc}}</span></span></button></sc-for>
            </div>
            <sc-if value="{{isStudent}}" hint-placeholder-val="{{true}}"><label class="fld"><span>Kierunek studiów <span class="hint">opcjonalnie</span></span><input class="inp" type="text" value="{{field}}" onChange="{{onField}}"></label></sc-if>
            <div class="alert" style="align-items: center; background: rgba(0,0,0,.02)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#686868" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg><span style="flex: 1">W kalendarzu:</span><span style="display: flex; flex-wrap: wrap; gap: 4px"><sc-for list="{{catBadges}}" as="c" hint-placeholder-count="2"><span class="bdg out"><span class="dot" style="{{c.dot}}"></span>{{c.n}}</span></sc-for></span></div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; padding: 14px 40px; border-top: 1px solid rgba(0,0,0,.08); background: rgba(0,0,0,.02)">
            <a class="btng" href="S2Onboarding.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Wstecz</a>
            <span style="flex: 1"></span>

            <a class="btnp" href="S2OnboardingGoals.dc.html">Dalej<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
          </div>
        </div>
        <div class="pvside" style="position: relative; border-left: 1px solid rgba(0,0,0,.08); overflow: hidden"><dc-import name="S2OnbPreview" s="{{S}}" step="2" hint-size="100%,680px"></dc-import></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { roles: { student: true, sport: true }, field: 'Cyberbezpieczeństwo' }; }
  renderVals() {
    const D = { name: 'Mejson', tz: 'Europe/Warsaw', week: 'pn', clock: '24', roles: { student: true, sport: true }, field: 'Cyberbezpieczeństwo', goals: { plan: true, sport: true, habits: true, subs: true, proj: true }, pages: { Subscriptions: true, Projects: true }, notify: { perm: true, before: true, renew: true, weekly: true, habits: false } };
    const S = Object.assign({}, D, this.state || {});
    const v = (e) => (e && e.target ? e.target.value : e);
    const RO = [['student', 'Student', 'Zajęcia, kolokwia, projekty'], ['work', 'Pracuję', 'Godziny pracy i spotkania'], ['free', 'Freelancer lub firma', 'Klienci, zlecenia, terminy'], ['sport', 'Trenuję regularnie', 'Biegi, siłownia, plan'], ['other', 'Coś innego', 'Kategorie ułożysz sam']];
    const R = S.roles || {};
    const roles = RO.map((r, i) => { const on = !!R[r[0]]; return { title: r[1], desc: r[2], on: on ? 'true' : 'false', span: i === 4 ? 'grid-column:1 / -1' : '',
      toggle: () => this.setState({ roles: Object.assign({}, S.roles, { [r[0]]: !on }) }) }; });
    const CAT = { Studia: '#3b82f6', Projekty: '#15803d', Praca: '#8b5cf6', Sport: '#f59e0b', Dom: '#eab308' };
    const cn = [];
    if (R.student) cn.push('Studia'); if (R.work) cn.push('Praca'); if (R.free) cn.push('Projekty'); if (R.sport) cn.push('Sport'); if (R.other || !cn.length) cn.push('Dom');
    return { S, roles, isStudent: !!R.student, field: S.field, onField: (e) => this.setState({ field: v(e) }), catBadges: cn.map((c) => ({ n: c, dot: 'background:' + CAT[c] })) };
  }
}
</script>
</body>
</html>
